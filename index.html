function renderCatalog(){document.getElementById('catalog').innerHTML=pageHead('Catálogo digital','Catálogo visual con imagen, presentación, precio y disponibilidad')+`<div class="grid cols3">${db.products.filter(p=>p.active).map(p=>`<div class="card">${p.image?`<img class="catalog-img" src="${p.image}" alt="${p.name}">`:`<div class="catalog-img" style="display:flex;align-items:center;justify-content:center;font-size:42px">▦</div>`}<h3>${p.name}</h3><p class="muted">${p.category} · ${p.presentation||p.unit} · ${p.content||1} ${p.contentUnit||p.unit}</p><h2>${money(p.price)}</h2><span class="badge ${p.stock>0?'green':'red'}">${p.stock>0?'Disponible':'Agotado'}</span></div>`).join('')}</div>`}
function renderSettings(){let logo=db.settings.logo||VENTARA_LOGO;document.getElementById('settings').innerHTML=pageHead('Configuración','Empresa, identidad visual, POS, impresión, impuestos, caja, usuarios y sistema',`<button class="btn primary" onclick="saveSettings()">Guardar cambios</button><button class="btn" onclick="exportBackup()">Exportar respaldo</button><button class="btn" onclick="importBackup()">Importar respaldo</button>`)+`<div class="grid cols2"><div class="card"><h3>Datos de la empresa</h3><div class="form"><div class="field"><label>Nombre comercial</label><input id="set_business" value="${db.settings.business}"></div><div class="field"><label>Razón social</label><input id="set_legal" value="${db.settings.legal}"></div><div class="field"><label>NIT / identificación</label><input id="set_nit" value="${db.settings.nit}"></div><div class="field"><label>Ciudad</label><input id="set_city" value="${db.settings.city}"></div><div class="field"><label>Teléfono</label><input id="set_phone" value="${db.settings.phone}"></div><div class="field"><label>Correo</label><input id="set_email" value="${db.settings.email}"></div><div class="field"><label>Tipo de negocio</label><input id="set_type" value="${db.settings.type}"></div><div class="field"><label>Régimen tributario</label><input id="set_tax" value="${db.settings.tax}"></div></div></div><div class="card"><h3>Logo de la empresa</h3><p class="muted">El cliente puede cargar su propio logo. Se mostrará en el encabezado y en el ticket POS.</p><img id="logoPreview" class="brand-preview" src="${logo}" alt="Logo"><div style="margin-top:12px"><input id="set_logo_file" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewCompanyLogo(event)"></div><button class="btn" style="margin-top:10px" onclick="useVentaraLogo()">Usar logo VENTARA</button></div></div><div class="card" style="margin-top:16px"><h3>Facturación y POS</h3><div class="card" style="box-shadow:none;background:#f8fafc">Interfaces preparadas para Factura POS, factura electrónica, nota crédito y nota débito. <b>No se simula conexión real con DIAN.</b> La integración futura debe realizarse mediante proveedor/API autorizado.</div></div><div class="card" style="margin-top:16px"><h3>🖨️ Hardware de caja</h3><p class="muted">Configura la forma en que VENTARA trabajará con impresora térmica POS, lector de códigos, cajón monedero y gramera. El lector de códigos normalmente funciona como teclado y queda listo para escanear en el campo de búsqueda. Para impresoras/cajones USB se recomienda un puente local o Web Serial cuando el dispositivo lo soporte.</p><div class="form"><div class="field"><label>Impresora de tickets</label><select id="hw_printer"><option>Impresora del navegador</option><option>Impresora térmica POS 80 mm / ESC-POS</option><option>Puente local ESC-POS</option></select></div><div class="field"><label>Puerto / conexión</label><input id="hw_port" value="${db.settings.hwPort||''}" placeholder="USB / COM / IP"></div><div class="field"><label>Lector de códigos</label><select id="hw_scanner"><option>Teclado USB (HID)</option><option>Bluetooth HID</option><option>Serial</option></select></div><div class="field"><label>Cajón monedero</label><select id="hw_drawer"><option>Conectado a impresora ESC/POS</option><option>Puerto serial</option><option>No instalado</option></select></div><div class="field"><label>Gramera</label><select id="hw_scale"><option>Manual</option><option>Web Serial</option><option>Puente local</option></select></div></div><div class="actions" style="margin-top:15px"><button class="btn" onclick="testPrinter()">🖨 Probar impresión</button><button class="btn" onclick="openDrawer()">🗄 Abrir cajón</button><button class="btn" onclick="connectSerialDevice()">🔌 Conectar dispositivo</button></div></div>`}

<script id="ventara-iva-module">
(()=>{
  const rates=[0,1,2,4,5,8,10,12,15,16,18,19,20,21,22,25,30,35];
  const pct=n=>Number(n||0);
  window.ventaraIvaRates=rates;
  window.ventaraPriceWithIva=(price,iva)=>Math.round(Number(price||0)*(1+pct(iva)/100)*100)/100;
  window.ventaraIvaAmount=(price,iva)=>Math.round(Number(price||0)*pct(iva)/100*100)/100;
  function modal(){return document.querySelector('.modal, .modal-content, [role="dialog"]')}
  function isProductModal(m){let t=(m?.innerText||'').toLowerCase();return t.includes('precio de venta')||t.includes('precio de costo')||t.includes('crear producto')||t.includes('editar producto')||t.includes('nuevo artículo')||t.includes('nuevo articulo')}
  function findPriceInput(m){let inputs=[...m.querySelectorAll('input')];return inputs.find(i=>/precio.*venta|venta/i.test((i.parentElement?.innerText||'')+' '+(i.previousElementSibling?.innerText||'')))||inputs.find(i=>/price/i.test(i.id||i.name||''))||null}
  function addField(m){if(!isProductModal(m)||m.querySelector('#ventaraProductIva'))return;let price=findPriceInput(m);let field=document.createElement('div');field.className='field';field.style.cssText='margin-top:10px';field.innerHTML='<label>IVA</label><select id="ventaraProductIva">'+rates.map(function(r){return '<option value="'+r+'">'+r+'%</option>'}).join('')+'<option value="custom">Personalizado</option></select><small class="muted">Selecciona el IVA que corresponde al producto.</small><div id="ventaraIvaPreview" class="muted" style="margin-top:6px"></div>';let host=price?.closest('.field')?.parentElement||m.querySelector('.form')||m;host.appendChild(field);let sel=field.querySelector('#ventaraProductIva');let prev=field.querySelector('#ventaraIvaPreview');let update=function(){let iva=sel.value==='custom'?0:Number(sel.value);if(sel.value==='custom'){prev.innerHTML='<input id="ventaraCustomIva" type="number" min="0" max="100" step="0.01" placeholder="% IVA personalizado">';let ci=prev.querySelector('#ventaraCustomIva');if(ci)ci.oninput=update;iva=Number(ci?.value||0)}let base=Number(price?.value||0);prev.textContent=base?'Precio final con IVA: '+new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:2}).format(window.ventaraPriceWithIva(base,iva)):''};sel.onchange=update;if(price)price.addEventListener('input',update);update();window.__ventaraCurrentIva=()=>sel.value==='custom'?Number(prev.querySelector('#ventaraCustomIva')?.value||0):Number(sel.value||0)}
  function saveIvaAfterAction(){let iva=Number(window.__ventaraCurrentIva?.()||0);let m=modal();if(!m||!isProductModal(m))return;let inputs=[...m.querySelectorAll('input')];let name=inputs.find(i=>/name|nombre/i.test(i.id||i.name||''))?.value?.trim();setTimeout(function(){if(!window.db?.products)return;let p=name?db.products.find(x=>x.name===name):null;if(p){p.iva=iva;p.taxRate=iva;p.priceWithIva=window.ventaraPriceWithIva(p.price,iva);if(typeof save==='function')save()}},300)}
  document.addEventListener('click',function(e){let b=e.target.closest('button');if(!b)return;let txt=(b.innerText||'').toLowerCase();if(/guardar|actualizar|crear|save/.test(txt)&&isProductModal(modal()))saveIvaAfterAction()},true);
  new MutationObserver(function(){let m=modal();if(m)addField(m)}).observe(document.documentElement,{subtree:true,childList:true});
  setInterval(function(){let m=modal();if(m)addField(m)},700);
  function normalizeCart(){if(!window.db?.products||!Array.isArray(window.cart))return;window.cart.forEach(function(i){let p=db.products.find(function(x){return x.id===i.id});if(p&&p.iva!=null&&!i.__ventaraIvaApplied){i.basePrice=i.price;i.price=window.ventaraPriceWithIva(p.price,p.iva);i.iva=p.iva;i.__ventaraIvaApplied=true}})}
  setInterval(normalizeCart,700);
})();
</script>
