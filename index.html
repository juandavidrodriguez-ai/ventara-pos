.logo-img{height:42px;width:auto;object-fit:contain;background:#fff;border-radius:10px;padding:3px}.brand{padding-bottom:18px}.brand strong{color:#fff}.nav.active{background:linear-gradient(90deg,var(--orange),var(--orange2));box-shadow:0 5px 14px rgba(255,107,0,.25)}.top{border-bottom:3px solid var(--orange)}
.pos-shell{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(390px,.75fr);gap:18px}.pos-products{min-height:690px}.pos-cart{position:sticky;top:88px;align-self:start}.pos-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#e9f8fc,#fff7eb);border:1px solid #cceaf2;border-left:6px solid var(--orange);border-radius:14px;padding:14px 16px;margin-bottom:14px}.pos-banner h2{margin:0;font-size:22px}.pos-banner p{margin:3px 0 0;color:var(--muted)}.pos-shortcuts{display:flex;gap:6px;flex-wrap:wrap}.key{background:#17324d;color:#fff;border-radius:5px;padding:3px 7px;font-size:11px;font-weight:800}.productgrid.posgrid{grid-template-columns:repeat(4,minmax(0,1fr));max-height:560px}.pitem{min-height:115px;border-top:4px solid var(--blue);transition:.15s}.pitem:active{transform:scale(.98)}.pitem .addline{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.addcircle{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;font-size:20px;line-height:30px;text-align:center;font-weight:900}.cart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.cart-head h3{margin:0}.cart-list{max-height:390px;overflow:auto}.cartrow{grid-template-columns:1fr 112px 92px 30px;padding:12px 0}.qty button{width:32px;height:32px;border-radius:7px;background:#e9f4f7;color:#005f73;font-weight:900}.qty .minus{background:#fff0ea;color:#ff6b00}.qty .plus{background:#e6f8f3;color:#16866f}.checkout{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px}.checkout-total{display:flex;justify-content:space-between;align-items:center;font-size:14px}.checkout-total strong{font-size:30px;color:#005f73}.cash-btn{width:100%;font-size:18px;padding:16px;border-radius:10px;background:linear-gradient(90deg,var(--orange),var(--orange2));color:#fff;font-weight:900;box-shadow:0 8px 18px rgba(255,107,0,.25)}.cash-btn:disabled{opacity:.5;box-shadow:none}.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.quick-actions button{padding:10px;border-radius:8px;background:#edf5f7;color:#005f73;font-weight:800}.payment-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.payment-grid button{padding:13px;border:1px solid var(--border);border-radius:9px;background:#fff;font-weight:800}.payment-grid button.selected{border:2px solid var(--orange);background:#fff5e9;color:#c95e00}.ticket-preview{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#fafafa;border:1px dashed #bbb;padding:15px;border-radius:8px}.brand-preview{max-height:80px;max-width:240px;object-fit:contain;border:1px solid var(--border);border-radius:8px;padding:5px;background:#fff}.user-company{display:flex;align-items:center;gap:10px}.avatar-logo{width:34px;height:34px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--border)}

<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <img class="login-logo" src="assets/ventara.png" alt="VENTARA">
    <h1>VENTARA POS</h1>
    <div class="field"><label for="loginUsername">Usuario</label><input id="loginUsername" autocomplete="username" autofocus></div>
    <div class="field"><label for="loginPassword">Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="login-btn" onclick="login()">Iniciar sesión</button>
    <div id="loginMsg" class="login-msg"></div>
  </div>
</div>

<div class="app" id="mainApp" style="display:none"><aside class="sidebar"><div class="brand"><img class="logo-img" src="assets/ventara.png" alt="VENTARA"><strong>POS</strong></div>
<div class="navgroup"><div class="navtitle">Operación</div><button class="nav active" data-page="dashboard">▦ <span>Inicio</span></button><button class="nav" data-page="pos">▣ <span>Facturar</span></button><button class="nav" data-page="sales">↺ <span>Ventas</span></button><button class="nav" data-page="orders">▤ <span>Pedidos</span></button></div>
<div class="navgroup"><div class="navtitle">Comercial</div><button class="nav" data-page="products">▤ <span>Artículos</span></button><button class="nav" data-page="inventory">▥ <span>Inventario / Kardex</span></button><button class="nav" data-page="purchases">⇩ <span>Compras</span></button><button class="nav" data-page="suppliers">♙ <span>Proveedores</span></button><button class="nav" data-page="clients">♙ <span>Clientes</span></button><button class="nav" data-page="receivables">$ <span>Fiados / Crédito</span></button><button class="nav" data-page="quotes">▧ <span>Cotizaciones</span></button></div>
<div class="navgroup"><div class="navtitle">Finanzas</div><button class="nav" data-page="cash">▣ <span>Caja</span></button><button class="nav" data-page="expenses">− <span>Gastos</span></button><button class="nav" data-page="reports">◒ <span>Reportes</span></button></div>
<div class="navgroup"><div class="navtitle">Administración</div><button class="nav" data-page="users">♟ <span>Usuarios</span></button><button class="nav" data-page="catalog">▦ <span>Catálogo digital</span></button><button class="nav" data-page="settings">⚙ <span>Configuración</span></button></div></aside>
<main class="main"><header class="top"><div class="user-company"><img id="topLogo" class="avatar-logo" src="assets/ventara.png" alt="Logo"><div><div class="business" id="topBusiness">Mi Negocio</div><small class="muted">VENTARA POS · Sistema de ventas</small></div></div><div class="topmeta"><span id="clock"></span><span id="cashState">Caja cerrada</span><span id="topRole">Administrador ▾</span></div></header><section class="content">
<div id="dashboard" class="page active"></div><div id="pos" class="page"></div><div id="sales" class="page"></div><div id="orders" class="page"></div><div id="products" class="page"></div><div id="inventory" class="page"></div><div id="purchases" class="page"></div><div id="suppliers" class="page"></div><div id="clients" class="page"></div><div id="receivables" class="page"></div><div id="quotes" class="page"></div><div id="cash" class="page"></div><div id="expenses" class="page"></div><div id="reports" class="page"></div><div id="users" class="page"></div><div id="catalog" class="page"></div><div id="settings" class="page"></div>
</section></main></div><div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div><div id="toast" class="toast"></div>
<script>
const KEY='ventara_pos_v1';
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const seed={settings:{logo:'',business:'Ferretería El Constructor',legal:'Ferretería El Constructor S.A.S.',nit:'900.123.456-7',city:'Ibagué, Tolima',phone:'300 000 0000',email:'contacto@negocio.com',type:'Comercio',tax:'Responsable de IVA'},products:[
{id:'p1',code:'7701001001',name:'Martillo de uña 16 oz',category:'Herramientas',unit:'UND',presentation:'Unidad',content:1,contentUnit:'UND',price:32000,cost:19000,stock:18,min:5,active:true},
{id:'p2',code:'7701001002',name:'Destornillador Phillips',category:'Herramientas',unit:'UND',presentation:'Unidad',content:1,contentUnit:'UND',price:12000,cost:6500,stock:35,min:8,active:true},
{id:'p3',code:'7701001003',name:'Cinta métrica 5 m',category:'Medición',unit:'UND',presentation:'Unidad',content:1,contentUnit:'UND',price:18000,cost:9500,stock:12,min:5,active:true},
{id:'p4',code:'7701001004',name:'Tornillo 1/4 x 2',category:'Fijación',unit:'UND',presentation:'Unidad',content:1,contentUnit:'UND',price:800,cost:350,stock:120,min:30,active:true},
{id:'p5',code:'7701001005',name:'Pintura blanca 1 galón',category:'Pinturas',unit:'L',presentation:'Botella',content:3.785,contentUnit:'L',price:68000,cost:43000,stock:6,min:3,active:true}],clients:[{id:'c1',name:'Consumidor final',doc:'222222222222',phone:'',email:'',credit:0,balance:0},{id:'c2',name:'Juan Pérez',doc:'1000000000',phone:'3001112233',email:'juan@email.com',credit:500000,balance:0}],suppliers:[{id:'s1',name:'Distribuciones Andinas S.A.S.',nit:'901111222-3',phone:'3005558899',email:'ventas@andinas.com',balance:0}],sales:[],purchases:[],payments:[],expenses:[],quotes:[],orders:[],kardex:[],cash:{open:false,balance:0,opening:0,openedAt:null},users:[{id:'u1',name:'Administrador',role:'Administrador',active:true,logo:'',company:'Ferretería El Constructor'}],audit:[]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;db.settings=db.settings||seed.settings;db.users=(db.users||seed.users).map(u=>({...u,permissions:u.permissions||[]}));db.clients=(db.clients||[]).map(c=>({...c,creditEnabled:c.creditEnabled??(c.credit>0),creditDays:c.creditDays??30}));db.cash.movements=db.cash.movements||[];db.cash.closures=db.cash.closures||[];db.settings.logo=db.settings.logo||'assets/ventara.png';db.products=(db.products||[]).map(p=>({...p,image:p.image||'',presentation:p.presentation||'Unidad',content:p.content??1,contentUnit:p.contentUnit||p.unit||'UND'}));let cart=[];let posClient='c1';

let currentUser=null;
async function hashPassword(password){
  const data=new TextEncoder().encode(password);
  const hash=await crypto.subtle.digest('SHA-256',data);
  return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function canAccess(page){return !currentUser || (ROLE_PERMISSIONS[currentUser.role]||[]).includes(page)}
function scopedSales(){if(!currentUser)return[];if(currentUser.role==='Administrador'||currentUser.role==='Supervisor')return db.sales;return db.sales.filter(s=>s.userId===currentUser.id||s.cashierId===currentUser.id||s.cashier===currentUser.name)}
function userCashId(){return currentUser?.id||'u-anon'}
async function ensureUserPasswords(){
  const defaultHash=await hashPassword('Ventara123!');
  let changed=false;
  db.users=(db.users||[]).map(u=>{
    if(!u.username) {u.username=(u.name||'usuario').toLowerCase().replace(/[^a-z0-9._-]/g,'').slice(0,30)||('user_'+u.id); changed=true;}
    if(!u.passwordHash){u.passwordHash=defaultHash;changed=true;}
    if(!u.permissions||!u.permissions.length){u.permissions=ROLE_PERMISSIONS[u.role]||[];changed=true;}
    return u;
  });
  if(changed)save();
}
function enterApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainApp').style.display='flex';
  const top=document.getElementById('topRole');
  if(top)top.innerHTML=`${currentUser.name} · ${currentUser.role} <button class="logout-btn" onclick="logout()">Salir</button>`;
  document.querySelectorAll('.nav').forEach(b=>b.style.display=canAccess(b.dataset.page)?'flex':'none');
  showPage('dashboard');
}
async function login(){
  const username=document.getElementById('loginUsername').value.trim().toLowerCase();
  const password=document.getElementById('loginPassword').value;
  const msg=document.getElementById('loginMsg');
  const user=db.users.find(u=>(u.username||'').toLowerCase()===username);
  if(!user||!user.active){msg.textContent='Usuario o contraseña incorrectos.';return}
  const hash=await hashPassword(password);
  if(hash!==user.passwordHash){msg.textContent='Usuario o contraseña incorrectos.';return}
  currentUser=user;msg.textContent='';enterApp();
}
function logout(){
  currentUser=null;
  document.getElementById('mainApp').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginUsername').value='';
  document.getElementById('loginPassword').value='';
  document.getElementById('loginMsg').textContent='';
  setTimeout(()=>document.getElementById('loginUsername')?.focus(),50);
}

function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function log(action,detail=''){db.audit.unshift({id:uid('a'),date:new Date().toISOString(),user:currentUser?.username||'Administrador',action,detail});db.audit=db.audit.slice(0,1000);save()}
function pageHead(title,sub,actions=''){return `<div class="head"><div><h1>${title}</h1><p>${sub||''}</p></div><div class="actions">${actions}</div></div>`}
function table(headers,rows,empty='Sin registros'){return `<div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
function nav(){document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>showPage(b.dataset.page));}
function showPage(p){if(currentUser&&!canAccess(p)){toast('Tu rol no tiene permiso para este módulo');return}document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render(p)}
function render(p){({dashboard:renderDashboard,pos:renderPOS,sales:renderSales,orders:renderOrders,products:renderProducts,inventory:renderInventory,purchases:renderPurchases,suppliers:renderSuppliers,clients:renderClients,receivables:renderReceivables,quotes:renderQuotes,cash:renderCash,expenses:renderExpenses,reports:renderReports,users:renderUsers,catalog:renderCatalog,settings:renderSettings}[p]||renderDashboard)()}
function stats(){let d=today(),m=d.slice(0,7),y=d.slice(0,4);let sales=scopedSales().filter(s=>s.status!=='Anulado');return {today:sales.filter(s=>s.date===d).reduce((a,s)=>a+s.total,0),month:sales.filter(s=>s.date.startsWith(m)).reduce((a,s)=>a+s.total,0),year:sales.filter(s=>s.date.startsWith(y)).reduce((a,s)=>a+s.total,0),profit:sales.reduce((a,s)=>a+s.items.reduce((q,i)=>q+(i.price-i.cost)*i.qty,0),0),inventory:db.products.reduce((a,p)=>a+p.stock*p.cost,0),receivable:db.clients.reduce((a,c)=>a+c.balance,0),payable:db.suppliers.reduce((a,s)=>a+s.balance,0),low:db.products.filter(p=>p.stock>0&&p.stock<=p.min).length,out:db.products.filter(p=>p.stock<=0).length}}
function renderDashboard(){let s=stats();document.getElementById('dashboard').innerHTML=pageHead('Inicio','Resumen operativo de VENTARA POS',`<button class="btn primary" onclick="showPage('pos')">+ Nueva factura</button><button class="btn danger" onclick="showPage('cash')">Cerrar caja</button><button class="btn" onclick="showPage('products')">+ Artículo</button><button class="btn" onclick="showPage('purchases')">+ Compra</button>`)+`<div class="card" style="margin-bottom:16px"><b>Atajos de teclado</b><div class="pos-shortcuts" style="margin-top:8px"><span class="hotkey">F1</span> Facturar · <span class="hotkey">F2</span> Vaciar caja · <span class="hotkey">F3</span> Ventas · <span class="hotkey">F4</span> Inventario · <span class="hotkey">F5</span> Compras · <span class="hotkey">F6</span> Clientes · <span class="hotkey">F7</span> Fiados · <span class="hotkey">F8</span> Caja · <span class="hotkey">F9</span> Reportes · <span class="hotkey">F10</span> Cotizaciones · <span class="hotkey">F11</span> Usuarios · <span class="hotkey">F12</span> Configuración</div></div><div class="grid kpis"><div class="card kpi"><div class="label">Ventas de hoy</div><div class="value">${money(s.today)}</div><div class="sub">Operación diaria</div></div><div class="card kpi"><div class="label">Ventas del mes</div><div class="value">${money(s.month)}</div><div class="sub">Acumulado</div></div><div class="card kpi"><div class="label">Utilidad estimada</div><div class="value">${money(s.profit)}</div><div class="sub">Según costo registrado</div></div><div class="card kpi"><div class="label">Caja</div><div class="value">${money(db.cash.balance)}</div><div class="sub">${db.cash.open?'Caja abierta':'Caja cerrada'}</div></div><div class="card kpi"><div class="label">Inventario</div><div class="value">${money(s.inventory)}</div><div class="sub">Valor a costo</div></div><div class="card kpi"><div class="label">Por cobrar</div><div class="value">${money(s.receivable)}</div><div class="sub">Cartera</div></div><div class="card kpi"><div class="label">Por pagar</div><div class="value">${money(s.payable)}</div><div class="sub">Proveedores</div></div><div class="card kpi"><div class="label">Alertas inventario</div><div class="value">${s.low+s.out}</div><div class="sub">${s.low} bajo · ${s.out} agotados</div></div></div><div class="grid cols2" style="margin-top:16px"><div class="card"><h3>Ventas recientes</h3>${table(['Número','Fecha','Cliente','Total','Estado'],scopedSales().slice(0,7).map(x=>`<tr><td>${x.number}</td><td>${x.date}</td><td>${clientName(x.clientId)}</td><td>${money(x.total)}</td><td><span class="badge ${x.status==='Anulado'?'red':'green'}">${x.status}</span></td></tr>`).join(''))}</div><div class="card"><h3>Productos con stock bajo</h3>${table(['Producto','Stock','Mínimo'],db.products.filter(p=>p.stock<=p.min).map(p=>`<tr><td>${p.name}</td><td>${p.stock}</td><td>${p.min}</td></tr>`).join(''),'No hay alertas') }</div></div>`}
function clientName(id){return db.clients.find(c=>c.id===id)?.name||'Consumidor final'}
function renderPOS(){
 document.getElementById('pos').innerHTML=`<div class="pos-banner"><div><h2>FACTURAR · CAJA REGISTRADORA</h2><p>Operación rápida para el cajero. Agrega productos, ajusta cantidades y cobra.</p></div><div class="pos-shortcuts"><span class="key">F1</span> Facturar <span class="key">F2</span> Vaciar caja <span class="key">ENTER</span> Cobrar</div></div>
 ${pageHead('FACTURAR','Registrar y cobrar una factura POS de forma rápida y clara',`<button class="btn" onclick="openProductModal()">+ Nuevo artículo</button><button class="btn" onclick="openCash()">Abrir caja</button><button class="btn cash-danger" onclick="clearCart()">🗑 Vaciar caja <span class="hotkey">F2</span></button>`)}
 <div class="pos-shell"><div class="card pos-products"><div style="display:flex;gap:8px;margin-bottom:10px"><input id="posSearch" class="search" style="margin:0" autofocus placeholder="Buscar producto o escanear código de barras…" onkeydown="posSearchKey(event)" oninput="filterPOS(this.value)"><button class="btn primary" onclick="addFirstSearchResult()">+ Agregar</button><button class="btn" onclick="openScaleModal()">⚖ Gramera</button></div><div class="muted" style="margin-bottom:10px;font-size:12px">Los productos se agregan con <b>+ Agregar</b> o con el botón <b>+</b>. <b>−</b> disminuye. <b>ENTER cobra la factura</b> y abre el proceso de pago/ticket.</div><div id="productGrid" class="productgrid posgrid"></div></div>
 <div class="card pos-cart"><div class="cart-head"><h3>Detalle de la FACTURA</h3><button class="btn sm danger" onclick="clearCart()">Vaciar</button></div><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><select id="posClient" style="flex:1;padding:11px;border:1px solid var(--border);border-radius:8px" onchange="posClient=this.value">${db.clients.map(c=>`<option value="${c.id}" ${c.id===posClient?'selected':''}>${c.name}</option>`).join('')}</select><button class="btn sm" onclick="openClientModal()">+ Cliente</button></div><div id="cart" class="cart-list"></div></div></div>`;
 filterPOS('');renderPOSCart();
 setTimeout(()=>document.getElementById('posSearch')?.focus(),50);
}
function filterPOS(q){let term=(q||'').toLowerCase().trim();let ps=db.products.filter(p=>p.active&&(!term||p.name.toLowerCase().includes(term)||String(p.code).includes(term)));document.getElementById('productGrid').innerHTML=ps.map(p=>`<button class="pitem" onclick="addCart('${p.id}')"><div class="pname">${p.name}</div><div class="pmeta">${p.code} · Stock ${p.stock} ${p.unit}</div><div class="addline"><span class="price">${money(p.price)}</span><span class="addcircle">+</span></div></button>`).join('')||'<div class="empty">No hay productos coincidentes</div>'}
function posSearchKey(e){if(e.key==='Enter'){e.preventDefault();if(cart.length)openPaymentModalPOS();else if((e.target.value||'').trim())toast('Agrega el producto con + antes de cobrar')}else if(e.key==='+'){e.preventDefault();if(cart.length)changeCart(cart[cart.length-1].id,1)}else if(e.key==='-'){e.preventDefault();if(cart.length)changeCart(cart[cart.length-1].id,-1)}}
function addFirstSearchResult(){let q=document.getElementById('posSearch')?.value||'';let ps=db.products.filter(p=>p.active&&(!q||p.name.toLowerCase().includes(q.toLowerCase())||String(p.code).includes(q)));if(ps.length)addCart(ps[0].id);else toast('Producto no encontrado')}
function addCart(id){let p=db.products.find(x=>x.id===id);if(!p||p.stock<=0)return toast('Producto sin stock');let x=cart.find(i=>i.id===id);if(x){if(x.qty>=p.stock)return toast('No hay más unidades disponibles');x.qty++}else cart.push({id,qty:1,price:p.price,cost:p.cost});renderPOSCart();document.getElementById('posSearch')?.focus()}
function renderPOSCart(){let el=document.getElementById('cart');if(!el)return;let subtotal=cart.reduce((a,i)=>a+i.qty*i.price,0),discount=+(document.getElementById('posDiscount')?.value||0),total=Math.max(0,subtotal-discount);el.innerHTML=cart.length?cart.map(i=>{let p=db.products.find(x=>x.id===i.id);return `<div class="cartrow"><div><b>${p.name}</b><br><small class="muted">${money(i.price)} c/u</small></div><div class="qty"><button class="minus" title="Disminuir" onclick="changeCart('${i.id}',-1)">−</button><span style="min-width:26px;text-align:center;font-weight:900">${i.qty}</span><button class="plus" title="Aumentar" onclick="changeCart('${i.id}',1)">+</button></div><b>${money(i.qty*i.price)}</b><button class="btn sm" style="padding:4px 7px" onclick="removeCart('${i.id}')">×</button></div>`}).join('')+`<div class="checkout"><div class="totalline"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="totalline"><span>Descuento</span><input id="posDiscount" type="number" value="${discount}" min="0" style="width:110px;padding:8px;border:1px solid var(--border);border-radius:6px" oninput="renderPOSCart()"></div><div class="checkout-total"><span>TOTAL A COBRAR</span><strong>${money(total)}</strong></div><div class="quick-actions"><button onclick="openPaymentModalPOS()">💳 Forma de pago</button><button onclick="holdSale()">⏸ Suspender venta</button></div><button class="cash-btn" style="margin-top:10px" onclick="openPaymentModalPOS()">💰 COBRAR VENTA · ${money(total)}</button><small class="muted" style="display:block;text-align:center;margin-top:7px"><b>ENTER</b> = COBRAR · <b>+</b> = aumentar · <b>−</b> = disminuir</small></div>`:'<div class="empty" style="padding:50px 20px"><div style="font-size:45px">🛒</div><h3>Venta nueva</h3><p>Escanea un código, busca un producto o haz clic en <b>+</b> para agregarlo.</p></div>'}
function changeCart(id,d){let x=cart.find(i=>i.id===id),p=db.products.find(x=>x.id===id);if(!x)return;if(d>0&&x.qty>=p.stock)return toast('No hay más stock disponible');x.qty+=d;if(x.qty<=0)removeCart(id);else renderPOSCart()}
function removeCart(id){cart=cart.filter(i=>i.id!==id);renderPOSCart()}
function clearCart(){if(!cart.length)return;if(confirm('¿Vaciar la venta actual?')){cart=[];renderPOSCart();toast('Venta vaciada')}}
function holdSale(){if(!cart.length)return toast('No hay productos para suspender');toast('Venta suspendida en esta sesión');}
function openPaymentModalPOS(){if(!cart.length)return toast('Agrega productos a la venta');let subtotal=cart.reduce((a,i)=>a+i.qty*i.price,0),discount=+(document.getElementById('posDiscount')?.value||0),total=Math.max(0,subtotal-discount);openModal(`<h2>💰 Cobrar VENTA</h2><p class="muted">Caja registradora · Total a cobrar</p><div style="text-align:center;background:#f4fbfd;padding:15px;border-radius:12px"><div class="muted">TOTAL</div><div style="font-size:38px;font-weight:900;color:#005f73">${money(total)}</div></div><h3>Forma de pago</h3><div class="payment-grid"><button id="pm-Efectivo" class="selected" onclick="selectPay('Efectivo')">💵 Efectivo</button><button id="pm-Tarjeta" onclick="selectPay('Tarjeta')">💳 Tarjeta</button><button id="pm-Transferencia" onclick="selectPay('Transferencia')">📲 Transferencia</button><button id="pm-Mixto" onclick="selectPay('Mixto')">🔀 Mixto</button><button id="pm-Crédito" onclick="selectPay('Crédito')">🧾 Crédito</button></div><div id="cashFields" style="margin-top:15px"><div class="field"><label>EFECTIVO RECIBIDO</label><input id="cashReceived" type="number" min="0" value="${total}" oninput="calcChange(${total})" onkeydown="if(event.key==='Enter')confirmPayment(${total})"></div><div class="totalline" style="font-size:18px;margin-top:10px"><span>Cambio</span><b id="cashChange">${money(0)}</b></div></div><div id="mixedFields" style="display:none;margin-top:15px"><div class="form"><div class="field"><label>Efectivo</label><input id="mixCash" type="number" value="0" oninput="calcMixed(${total})"></div><div class="field"><label>Tarjeta/Transferencia</label><input id="mixOther" type="number" value="${total}" oninput="calcMixed(${total})"></div></div><p id="mixStatus" class="muted"></p></div><div class="actions" style="margin-top:18px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn success" style="padding:13px 22px" onclick="confirmPayment(${total})">✓ CONFIRMAR Y REGISTRAR VENTA</button></div>`)}
let selectedPay='Efectivo';function selectPay(method){selectedPay=method;document.querySelectorAll('.payment-grid button').forEach(b=>b.classList.remove('selected'));document.getElementById('pm-'+method)?.classList.add('selected');document.getElementById('cashFields').style.display=method==='Efectivo'?'block':'none';document.getElementById('mixedFields').style.display=method==='Mixto'?'block':'none'}
function calcChange(total){let r=+(document.getElementById('cashReceived')?.value||0);document.getElementById('cashChange').textContent=money(Math.max(0,r-total))}
function calcMixed(total){let a=+(document.getElementById('mixCash')?.value||0),b=+(document.getElementById('mixOther')?.value||0),d=a+b-total;document.getElementById('mixStatus').textContent=d>=0?'Pago completo · Cambio '+money(d):'Faltan '+money(Math.abs(d))}
function confirmPayment(total){if(selectedPay==='Efectivo'){let r=+(document.getElementById('cashReceived')?.value||0);if(r<total)return toast('El efectivo recibido es menor al total')}if(selectedPay==='Mixto'){let a=+(document.getElementById('mixCash')?.value||0),b=+(document.getElementById('mixOther')?.value||0);if(a+b<total)return toast('El pago mixto no cubre el total')}finishSale(selectedPay,total,true)}
function finishSale(methodOverride,totalOverride,autoPrint=false){if(!cart.length)return;let client=db.clients.find(c=>c.id===posClient)||db.clients[0];let discount=+(document.getElementById('posDiscount')?.value||0);let subtotal=cart.reduce((a,i)=>a+i.qty*i.price,0),total=totalOverride??Math.max(0,subtotal-discount),method=methodOverride||document.getElementById('payMethod')?.value||'Efectivo';if(method==='Crédito'){if(client.id==='c1')return toast('Selecciona un cliente para vender a crédito');if(client.creditEnabled===false)return toast('Este cliente no tiene el fiado habilitado');if((client.balance||0)+total>(client.credit||0))return toast('La venta supera el límite de crédito disponible');client.balance=(client.balance||0)+total;client.lastCreditDate=today();client.nextPaymentDate=new Date(Date.now()+((client.creditDays||30)*86400000)).toISOString().slice(0,10)}cart.forEach(i=>{let p=db.products.find(x=>x.id===i.id);p.stock-=i.qty;db.kardex.unshift({id:uid('k'),date:today(),type:'Venta',ref:'',productId:p.id,qty:-i.qty,balance:p.stock,cost:p.cost})});let sale={cashier:currentUser?.name||'Administrador',cashierId:currentUser?.id||'',userId:currentUser?.id||'',cashId:userCashId(),id:uid('v'),number:'V-'+String(db.sales.length+1).padStart(6,'0'),date:today(),time:new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}),clientId:client.id,total,discount,method,status:method==='Crédito'?'Crédito':'Pagada',items:cart.map(i=>{let p=db.products.find(x=>x.id===i.id);return {...i,name:p.name}})};db.sales.unshift(sale);if(method!=='Crédito')db.cash.balance+=total;log('Venta registrada',sale.number);save();cart=[];closeModal();renderPOS();toast('FACTURA registrada · '+sale.number);if(autoPrint)printTicket(sale.id);else setTimeout(()=>offerTicket(sale.id),250)}
function offerTicket(id){openModal(`<h2>✓ Venta registrada</h2><p>La venta se registró correctamente.</p><div class="ticket-preview"><b>${db.sales.find(s=>s.id===id)?.number}</b><br>Total: ${money(db.sales.find(s=>s.id===id)?.total)}<br>Pago: ${db.sales.find(s=>s.id===id)?.method}</div><div class="actions" style="margin-top:15px"><button class="btn" onclick="closeModal()">Cerrar</button><button class="btn primary" onclick="printTicket('${id}')">🖨 Imprimir ticket POS</button></div>`)}
function openScaleModal(){if(!db.products.length)return toast('Crea productos primero');let weighted=db.products.filter(p=>p.active&&(p.unit==='G'||p.unit==='KG'));openModal(`<h2>⚖ Gramera / báscula</h2><p class="muted">Puedes ingresar el peso manualmente o conectar una gramera compatible mediante Web Serial cuando el navegador y el dispositivo lo permitan.</p><div class="form"><div class="field"><label>Producto pesable</label><select id="scale_prod">${weighted.map(p=>`<option value="${p.id}">${p.name} · ${p.unit} · ${money(p.price)}/${p.unit}</option>`).join('')||'<option value="">No hay productos G/KG</option>'}</select></div><div class="field"><label>Peso leído (gramos)</label><input id="scale_grams" type="number" step="0.001" min="0" value="1000" autofocus onkeydown="if(event.key==='Enter')addScaleProduct()"></div></div><div class="actions" style="margin-top:15px"><button class="btn" onclick="connectSerialDevice()">🔌 Conectar gramera</button><button class="btn primary" onclick="addScaleProduct()">+ Agregar peso</button></div>`)}
function addScaleProduct(){let id=v('scale_prod'),grams=+v('scale_grams');let p=db.products.find(x=>x.id===id);if(!p||!grams||grams<=0)return toast('Selecciona producto e ingresa un peso válido');let qty=p.unit==='KG'?grams/1000:grams;if(qty>p.stock)return toast('El peso supera el stock disponible');let x=cart.find(i=>i.id===id);if(x)x.qty+=qty;else cart.push({id,qty,price:p.price,cost:p.cost});closeModal();showPage('pos');toast(`${qty.toFixed(3)} ${p.unit} agregado`);setTimeout(()=>document.getElementById('posSearch')?.focus(),50)}
async function connectSerialDevice(){if(!('serial' in navigator))return toast('Tu navegador no permite Web Serial. Usa Chrome/Edge actualizado o un puente local.');try{window._serialPort=await navigator.serial.requestPort();await window._serialPort.open({baudRate:9600});toast('Dispositivo serial conectado');}catch(e){toast('No se pudo conectar el dispositivo')}}
function renderSales(){let rows=scopedSales().map(s=>`<tr><td>${s.number}</td><td>${s.date} ${s.time}</td><td>${clientName(s.clientId)}</td><td>${money(s.total)}</td><td>${s.method}</td><td><span class="badge ${s.status==='Anulado'?'red':'green'}">${s.status}</span></td><td><button class="btn sm" onclick="viewSale('${s.id}')">Ver</button> <button class="btn sm" onclick="returnSale('${s.id}')">Devolver</button></td></tr>`).join('');document.getElementById('sales').innerHTML=pageHead('VENTAS','Historial de facturas, consulta, reimpresión, anulación y devoluciones',`<button class="btn primary" onclick="showPage('pos')">+ NUEVA FACTURA</button>`)+`<div class="card">${table(['Número','Fecha','Cliente','Total','Pago','Estado','Acciones'],rows)}</div>`}
function viewSale(id){let s=db.sales.find(x=>x.id===id);openModal(`<h2>${s.number}</h2><p>${s.date} ${s.time} · ${clientName(s.clientId)}</p>${table(['Producto','Cant.','Precio','Total'],s.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join(''))}<h2 style="text-align:right">${money(s.total)}</h2><button class="btn primary" onclick="printTicket('${s.id}')">Imprimir ticket</button>`)}
function printTicket(id){let s=db.sales.find(x=>x.id===id);if(!s)return;let logo=db.settings.logo||'assets/ventara.png';let rows=s.items.map(i=>`<div class="r"><span>${i.qty} x ${i.name}</span><span>${money(i.qty*i.price)}</span></div>`).join('');let w=window.open('','_blank','width=420,height=800');if(!w)return toast('El navegador bloqueó la ventana de impresión');w.document.write(`<html><head><title>${s.number}</title><style>@page{size:80mm auto;margin:0}html,body{margin:0;padding:0;background:#fff}body{font-family:'Courier New',monospace;font-size:12px;color:#000}.ticket80{width:80mm;box-sizing:border-box;padding:3mm}.c{text-align:center}.l{text-align:left}.r{display:flex;justify-content:space-between;gap:5px}.r span:first-child{max-width:55mm;word-break:break-word}.hr{border-top:1px dashed #000;margin:6px 0}img{max-width:48mm;max-height:22mm;object-fit:contain}h2{font-size:17px;margin:4px 0}h3{font-size:14px;margin:4px 0}</style></head><body><div class="ticket80"><div class="c"><img src="${logo}"><h2>${db.settings.business}</h2><div>${db.settings.nit||''}</div><div>${db.settings.city||''}</div><div>${db.settings.phone||''}</div></div><div class="hr"></div><div><b>FACTURA POS ${s.number}</b><br>${s.date} ${s.time}<br>Cliente: ${clientName(s.clientId)}</div><div class="hr"></div>${rows}<div class="hr"></div><div class="r"><b>TOTAL</b><b>${money(s.total)}</b></div><div class="r"><span>Medio de pago</span><span>${s.method}</span></div>${s.method==='Crédito'?`<div class="r"><span>Plazo</span><span>${db.clients.find(c=>c.id===s.clientId)?.creditDays||0} días</span></div>`:''}<div class="hr"></div><div class="c">Gracias por su compra<br>VENTARA POS</div></div><script>window.onload=()=>{window.print()}<\/script></body></html>`);w.document.close()}
function returnSale(id){let s=db.sales.find(x=>x.id===id);if(!s||s.status==='Anulado'||s.status.includes('DEV'))return toast('Venta no disponible');s.items.forEach(i=>{let p=db.products.find(x=>x.id===i.id);if(p){p.stock+=i.qty;db.kardex.unshift({id:uid('k'),date:today(),type:'Devolución',ref:s.number,productId:p.id,qty:i.qty,balance:p.stock,cost:p.cost})}});if(s.method==='Crédito'){let c=db.clients.find(x=>x.id===s.clientId);c.balance=Math.max(0,c.balance-s.total)}else db.cash.balance=Math.max(0,db.cash.balance-s.total);s.status='DEVUELTA';log('Devolución',s.number);save();toast('Devolución aplicada');renderSales()}
function renderProducts(){document.getElementById('products').innerHTML=pageHead('Artículos','Productos, precios, costos, categorías, imágenes y códigos de barras',`<button class="btn primary" onclick="openProductModal()">+ Nuevo artículo</button><button class="btn" onclick="exportCSV('products')">Exportar CSV</button>`)+`<div class="card">${table(['Imagen','Código','Producto','Categoría','Unidad','Precio','Costo','Stock','Estado','Acciones'],db.products.map(p=>`<tr><td>${p.image?`<img class="product-thumb" src="${p.image}" alt="${p.name}">`:'—'}</td><td>${p.code}</td><td><b>${p.name}</b></td><td>${p.category}</td><td>${p.unit}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${p.stock}</td><td><span class="badge ${p.active?'green':'red'}">${p.active?'Activo':'Inactivo'}</span></td><td><button class="btn sm" onclick="openProductModal('${p.id}')">Editar</button> <button class="btn sm danger" onclick="deleteProduct('${p.id}')">Eliminar</button></td></tr>`).join(''))}</div>`}
function openProductModal(id=''){let p=db.products.find(x=>x.id===id)||{name:'',code:'',category:'General',unit:'UND',presentation:'Unidad',content:1,contentUnit:'UND',price:0,cost:0,stock:0,min:0,active:true};openModal(`<h2>${id?'Editar':'Nuevo'} artículo</h2><div class="form"><div class="field"><label>Nombre del producto</label><input id="f_name" value="${p.name}"></div><div class="field"><label>Código / barras</label><input id="f_code" value="${p.code}"></div><div class="field"><label>Categoría</label><input id="f_cat" value="${p.category}"></div><div class="field full"><label>Imagen del producto</label><input id="f_image_file" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewProductImage(event)"><input id="f_image" type="hidden" value="${p.image||''}"><div style="margin-top:8px">${p.image?`<img id="productImagePreview" class="product-thumb" src="${p.image}" alt="Vista previa">`:`<div id="productImagePreview" class="empty" style="padding:14px">Sin imagen</div>`}</div></div><div class="field"><label>Unidad de venta</label><select id="f_unit"><option ${p.unit==='UND'?'selected':''}>UND</option><option ${p.unit==='G'?'selected':''}>G</option><option ${p.unit==='KG'?'selected':''}>KG</option><option ${p.unit==='ML'?'selected':''}>ML</option><option ${p.unit==='L'?'selected':''}>L</option><option ${p.unit==='M'?'selected':''}>M</option><option ${p.unit==='CM'?'selected':''}>CM</option><option ${p.unit==='CAJA'?'selected':''}>CAJA</option><option ${p.unit==='PAQ'?'selected':''}>PAQ</option></select></div><div class="field"><label>Presentación</label><input id="f_presentation" value="${p.presentation||''}" placeholder="Ej. Bolsa, botella, caja, unidad"></div><div class="field"><label>Contenido / gramaje</label><input id="f_content" type="number" step="0.001" min="0" value="${p.content??1}"></div><div class="field"><label>Unidad del contenido</label><select id="f_contentUnit"><option ${p.contentUnit==='G'?'selected':''}>G</option><option ${p.contentUnit==='KG'?'selected':''}>KG</option><option ${p.contentUnit==='ML'?'selected':''}>ML</option><option ${p.contentUnit==='L'?'selected':''}>L</option><option ${p.contentUnit==='UND'?'selected':''}>UND</option></select></div><div class="field"><label>Precio venta</label><input id="f_price" type="number" step="0.01" value="${p.price}"></div><div class="field"><label>Costo</label><input id="f_cost" type="number" step="0.01" value="${p.cost}"></div><div class="field"><label>Stock inicial</label><input id="f_stock" type="number" step="0.001" value="${p.stock}"></div><div class="field"><label>Stock mínimo</label><input id="f_min" type="number" step="0.001" value="${p.min}"></div></div><p class="muted" style="margin-top:10px">Ejemplo: producto vendido por KG, contenido 500 G por bolsa; o bebida de 1.5 L. El stock y las cantidades admiten decimales para productos pesables.</p><div class="actions" style="margin-top:18px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveProduct('${id}')">Guardar</button></div>`)}
function previewProductImage(e){let f=e.target.files?.[0];if(!f)return;if(f.size>2*1024*1024)return toast('La imagen debe pesar máximo 2 MB');let r=new FileReader();r.onload=()=>{document.getElementById('f_image').value=r.result;let el=document.getElementById('productImagePreview');if(el){el.outerHTML=`<img id="productImagePreview" class="product-thumb" src="${r.result}" alt="Vista previa">`}};r.readAsDataURL(f)}
function saveProduct(id){let p=db.products.find(x=>x.id===id);let old=p?.stock||0;let data={name:v('f_name'),code:v('f_code'),category:v('f_cat'),image:v('f_image'),unit:v('f_unit'),presentation:v('f_presentation'),content:+v('f_content')||1,contentUnit:v('f_contentUnit'),price:+v('f_price'),cost:+v('f_cost'),stock:+v('f_stock'),min:+v('f_min'),active:true};if(p)Object.assign(p,data);else{data.id=uid('p');db.products.push(data);if(data.stock)db.kardex.unshift({id:uid('k'),date:today(),type:'Entrada inicial',ref:'',productId:data.id,qty:data.stock,balance:data.stock,cost:data.cost})}if(p&&old!==data.stock)db.kardex.unshift({id:uid('k'),date:today(),type:'Ajuste',ref:'',productId:p.id,qty:data.stock-old,balance:data.stock,cost:data.cost});log(id?'Artículo editado':'Artículo creado',data.name);save();closeModal();toast('Artículo guardado');renderProducts()}
function deleteProduct(id){if(!confirm('¿Eliminar/desactivar artículo?'))return;let p=db.products.find(x=>x.id===id);p.active=false;log('Artículo desactivado',p.name);save();renderProducts()}
function renderInventory(filter='all'){let moves=db.kardex||[];if(filter==='in')moves=moves.filter(k=>['Entrada','Entrada inicial','Compra'].includes(k.type)||k.qty>0);if(filter==='out')moves=moves.filter(k=>['Salida','Venta'].includes(k.type)||k.qty<0);document.getElementById('inventory').innerHTML=pageHead('Inventario y Kardex','Existencias, entradas, salidas y trazabilidad',`<button class="btn primary" onclick="openAdjustModal()">+ Movimiento</button><button class="btn" onclick="openStockMovementModal('in')">+ Entrada</button><button class="btn" onclick="openStockMovementModal('out')">− Salida</button><button class="btn" onclick="exportCSV('kardex')">Exportar Kardex</button>`)+`<div class="card" style="margin-bottom:14px"><div class="actions"><button class="btn ${filter==='all'?'primary':''}" onclick="renderInventory('all')">Todos</button><button class="btn ${filter==='in'?'primary':''}" onclick="renderInventory('in')">Entradas</button><button class="btn ${filter==='out'?'primary':''}" onclick="renderInventory('out')">Salidas</button></div></div><div class="grid cols2"><div class="card">${table(['Producto','Stock','Mínimo','Estado','Valor costo'],db.products.map(p=>`<tr><td>${p.name}</td><td>${p.stock}</td><td>${p.min}</td><td>${p.stock<=0?'<span class="badge red">Agotado</span>':p.stock<=p.min?'<span class="badge warn">Bajo</span>':'<span class="badge green">OK</span>'}</td><td>${money(p.stock*p.cost)}</td></tr>`).join(''))}</div><div class="card"><h3>${filter==='in'?'Entradas de inventario':filter==='out'?'Salidas de inventario':'Movimientos recientes'}</h3>${table(['Fecha','Tipo','Producto','Cant.','Saldo','Usuario'],moves.slice(0,50).map(k=>`<tr><td>${k.date}</td><td>${k.type}</td><td>${productName(k.productId)}</td><td>${k.qty}</td><td>${k.balance}</td><td>${k.user||'Sistema'}</td></tr>`).join(''))}</div></div>`}
function productName(id){return db.products.find(p=>p.id===id)?.name||''}
function openStockMovementModal(type){let isIn=type==='in';openModal(`<h2>${isIn?'Entrada':'Salida'} de inventario</h2><div class="form"><div class="field"><label>Producto</label><select id="m_prod">${db.products.filter(p=>p.active!==false).map(p=>`<option value="${p.id}">${p.name} (${p.stock})</option>`).join('')}</select></div><div class="field"><label>Cantidad</label><input id="m_qty" type="number" min="0.001" step="0.001"></div><div class="field full"><label>Motivo / referencia</label><input id="m_reason" placeholder="${isIn?'Compra, recepción, devolución…':'Merma, daño, consumo, ajuste…'}"></div></div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="saveStockMovement('${type}')">Registrar ${isIn?'entrada':'salida'}</button></div>`)}
function saveStockMovement(type){let p=db.products.find(x=>x.id===v('m_prod'));let q=+v('m_qty');if(!p||q<=0)return toast('Indica un producto y una cantidad válida');if(type==='out'&&q>p.stock)return toast('La salida supera el inventario disponible');p.stock=type==='in'?p.stock+q:p.stock-q;db.kardex.unshift({id:uid('k'),date:today(),type:type==='in'?'Entrada':'Salida',ref:v('m_reason'),productId:p.id,qty:type==='in'?q:-q,balance:p.stock,cost:p.cost,user:currentUser?.name||'Sistema'});log(type==='in'?'Entrada inventario':'Salida inventario',p.name);save();closeModal();renderInventory();toast(`Movimiento registrado: ${type==='in'?'entrada':'salida'}`)}
function openAdjustModal(){openModal(`<h2>Ajuste de inventario</h2><div class="form"><div class="field"><label>Producto</label><select id="a_prod">${db.products.map(p=>`<option value="${p.id}">${p.name} (${p.stock})</option>`).join('')}</select></div><div class="field"><label>Nuevo stock</label><input id="a_stock" type="number"></div><div class="field full"><label>Motivo</label><input id="a_reason" placeholder="Conteo físico, merma, corrección…"></div></div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="saveAdjust()">Aplicar</button></div>`)}
function saveAdjust(){let p=db.products.find(x=>x.id===v('a_prod'));let n=+v('a_stock'),d=n-p.stock;p.stock=n;db.kardex.unshift({id:uid('k'),date:today(),type:'Ajuste',ref:v('a_reason'),productId:p.id,qty:d,balance:n,cost:p.cost,user:currentUser?.name||'Sistema'});log('Ajuste inventario',p.name);save();closeModal();renderInventory();toast('Inventario actualizado')}
function renderPurchases(){document.getElementById('purchases').innerHTML=pageHead('Compras','Entradas de mercancía, costos y cuentas por pagar',`<button class="btn primary" onclick="openPurchaseModal()">+ Registrar compra</button>`)+`<div class="card">${table(['Número','Fecha','Proveedor','Total','Pago','Estado'],db.purchases.map(x=>`<tr><td>${x.number}</td><td>${x.date}</td><td>${supplierName(x.supplierId)}</td><td>${money(x.total)}</td><td>${x.method}</td><td>${x.status}</td></tr>`).join(''))}</div>`}
function supplierName(id){return db.suppliers.find(s=>s.id===id)?.name||''}
function openPurchaseModal(){openModal(`<h2>Registrar compra</h2><div class="form"><div class="field"><label>Proveedor</label><select id="b_sup">${db.suppliers.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div><div class="field"><label>Forma de pago</label><select id="b_method"><option>Crédito</option><option>Efectivo</option><option>Transferencia</option></select></div><div class="field"><label>Producto</label><select id="b_prod">${db.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div class="field"><label>Cantidad</label><input id="b_qty" type="number" value="1" min="1"></div><div class="field"><label>Costo unitario</label><input id="b_cost" type="number" value="0"></div></div><p class="muted">Esta versión registra una línea por compra; se puede ampliar a múltiples líneas.</p><button class="btn primary" onclick="savePurchase()">Registrar compra</button>`)}
function savePurchase(){let p=db.products.find(x=>x.id===v('b_prod')),qty=+v('b_qty'),cost=+v('b_cost')||p.cost,total=qty*cost,s=db.suppliers.find(x=>x.id===v('b_sup'));p.stock+=qty;p.cost=cost;db.kardex.unshift({id:uid('k'),date:today(),type:'Compra',ref:'',productId:p.id,qty,balance:p.stock,cost});if(v('b_method')==='Crédito')s.balance+=total;else db.cash.balance+=0;let b={id:uid('b'),number:'C-'+String(db.purchases.length+1).padStart(6,'0'),date:today(),supplierId:s.id,total,method:v('b_method'),status:'Registrada',items:[{productId:p.id,qty,cost}]};db.purchases.unshift(b);log('Compra registrada',b.number);save();closeModal();toast('Compra registrada');renderPurchases()}
function renderSuppliers(){document.getElementById('suppliers').innerHTML=pageHead('Proveedores','Maestro de proveedores y cuentas por pagar',`<button class="btn primary" onclick="openSupplierModal()">+ Proveedor</button>`)+`<div class="card">${table(['Proveedor','NIT','Teléfono','Correo','Por pagar','Acciones'],db.suppliers.map(s=>`<tr><td>${s.name}</td><td>${s.nit}</td><td>${s.phone}</td><td>${s.email}</td><td>${money(s.balance)}</td><td><button class="btn sm" onclick="openSupplierModal('${s.id}')">Editar</button></td></tr>`).join(''))}</div>`}
function openSupplierModal(id=''){let s=db.suppliers.find(x=>x.id===id)||{name:'',nit:'',phone:'',email:'',balance:0};openModal(`<h2>${id?'Editar':'Nuevo'} proveedor</h2><div class="form"><div class="field"><label>Nombre / razón social</label><input id="s_name" value="${s.name}"></div><div class="field"><label>NIT</label><input id="s_nit" value="${s.nit}"></div><div class="field"><label>Teléfono</label><input id="s_phone" value="${s.phone}"></div><div class="field"><label>Correo</label><input id="s_email" value="${s.email}"></div></div><button class="btn primary" style="margin-top:15px" onclick="saveSupplier('${id}')">Guardar</button>`)}
function saveSupplier(id){let s=db.suppliers.find(x=>x.id===id);let d={name:v('s_name'),nit:v('s_nit'),phone:v('s_phone'),email:v('s_email'),balance:s?.balance||0};if(s)Object.assign(s,d);else{d.id=uid('s');db.suppliers.push(d)}save();closeModal();renderSuppliers();toast('Proveedor guardado')}
function renderClients(){document.getElementById('clients').innerHTML=pageHead('Clientes','Clientes, línea de crédito y condiciones de pago',`<button class="btn primary" onclick="openClientModal()">+ Cliente</button>`)+`<div class="card">${table(['Cliente','Documento','Teléfono','Crédito','Saldo','Estado','Acciones'],db.clients.map(c=>`<tr><td>${c.name}</td><td>${c.doc}</td><td>${c.phone}</td><td>${money(c.credit)}</td><td>${money(c.balance)}</td><td>${c.balance>0?'<span class="badge warn">Pendiente</span>':'<span class="badge green">Al día</span>'}</td><td><button class="btn sm" onclick="openClientModal('${c.id}')">Editar</button></td></tr>`).join(''))}</div>`}
function openClientModal(id=''){let c=db.clients.find(x=>x.id===id)||{name:'',doc:'',phone:'',email:'',credit:0,balance:0,creditDays:30,creditEnabled:false};openModal(`<h2>${id?'Editar':'Nuevo'} cliente</h2><p class="muted">Configura aquí la línea de crédito o el tradicional <b>fiado</b>.</p><div class="form"><div class="field"><label>Nombre</label><input id="c_name" value="${c.name}"></div><div class="field"><label>Documento</label><input id="c_doc" value="${c.doc}"></div><div class="field"><label>Teléfono</label><input id="c_phone" value="${c.phone}"></div><div class="field"><label>Correo</label><input id="c_email" value="${c.email}"></div><div class="field"><label>Límite de crédito / fiado</label><input id="c_credit" type="number" min="0" value="${c.credit}"></div><div class="field"><label>Plazo para pagar (días)</label><input id="c_days" type="number" min="0" value="${c.creditDays??30}"></div><div class="field"><label>Permitir fiado</label><select id="c_enabled"><option value="1" ${c.creditEnabled!==false?'selected':''}>Sí</option><option value="0" ${c.creditEnabled===false?'selected':''}>No</option></select></div></div><button class="btn primary" style="margin-top:15px" onclick="saveClient('${id}')">Guardar cliente</button>`)}
function saveClient(id){let c=db.clients.find(x=>x.id===id);let d={name:v('c_name'),doc:v('c_doc'),phone:v('c_phone'),email:v('c_email'),credit:+v('c_credit'),creditDays:+v('c_days'),creditEnabled:v('c_enabled')==='1',balance:c?.balance||0};if(c)Object.assign(c,d);else{d.id=uid('c');db.clients.push(d)}save();closeModal();renderClients();toast('Cliente guardado')}
function renderReceivables(){let debtors=db.clients.filter(c=>c.balance>0);let total=debtors.reduce((a,c)=>a+c.balance,0);document.getElementById('receivables').innerHTML=pageHead('Fiados / Crédito','La libreta de fiados digital de VENTARA',`<button class="btn primary" onclick="openClientModal()">+ Nueva línea de crédito</button><button class="btn" onclick="exportCreditReport()">Exportar cartera</button>`)+`<div class="grid cols3"><div class="card kpi"><div class="label">Total fiado</div><div class="value">${money(total)}</div></div><div class="card kpi"><div class="label">Clientes con saldo</div><div class="value">${debtors.length}</div></div><div class="card kpi"><div class="label">Líneas habilitadas</div><div class="value">${db.clients.filter(c=>c.creditEnabled).length}</div></div></div><div class="card" style="margin-top:16px">${table(['Cliente','Límite','Saldo','Disponible','Plazo','Acción'],db.clients.filter(c=>c.creditEnabled||c.balance>0).map(c=>`<tr><td><b>${c.name}</b><br><small class="muted">${c.doc||''}</small></td><td>${money(c.credit)}</td><td>${money(c.balance)}</td><td>${money(Math.max(0,(c.credit||0)-(c.balance||0)))}</td><td>${c.creditDays??0} días</td><td><button class="btn sm" onclick="openPaymentModal('${c.id}')">Abonar</button> <button class="btn sm" onclick="openClientModal('${c.id}')">Editar</button></td></tr>`).join(''),'No hay líneas de crédito configuradas')}</div>`}
function openPaymentModal(id=''){openModal(`<h2>Registrar abono</h2><div class="form"><div class="field"><label>Cliente</label><select id="pay_client">${db.clients.filter(c=>c.balance>0).map(c=>`<option value="${c.id}" ${c.id===id?'selected':''}>${c.name} · ${money(c.balance)}</option>`).join('')}</select></div><div class="field"><label>Valor</label><input id="pay_value" type="number" min="1"></div><div class="field"><label>Método</label><select id="pay_method"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></div></div><button class="btn primary" style="margin-top:15px" onclick="savePayment()">Registrar abono</button>`)}
function savePayment(){let c=db.clients.find(x=>x.id===v('pay_client')),n=Math.min(+v('pay_value'),c.balance);c.balance-=n;db.cash.balance+=n;db.payments.unshift({id:uid('pa'),date:today(),clientId:c.id,value:n,method:v('pay_method')});log('Abono de cartera',c.name);save();closeModal();renderReceivables();toast('Abono registrado')}
function renderQuotes(){document.getElementById('quotes').innerHTML=pageHead('Cotizaciones','Borradores, enviadas, aprobadas y conversión a venta',`<button class="btn primary" onclick="openQuoteModal()">+ Cotización</button>`)+`<div class="card">${table(['Número','Fecha','Cliente','Total','Vigencia','Estado','Acción'],db.quotes.map(q=>`<tr><td>${q.number}</td><td>${q.date}</td><td>${clientName(q.clientId)}</td><td>${money(q.total)}</td><td>${q.validity}</td><td>${q.status}</td><td><button class="btn sm" onclick="convertQuote('${q.id}')">Convertir en venta</button></td></tr>`).join(''))}</div>`}
function openQuoteModal(){openModal(`<h2>Nueva cotización</h2><div class="form"><div class="field"><label>Cliente</label><select id="q_client">${db.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div class="field"><label>Producto</label><select id="q_prod">${db.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div class="field"><label>Cantidad</label><input id="q_qty" type="number" value="1"></div><div class="field"><label>Vigencia</label><input id="q_valid" type="date" value="${today()}"></div></div><button class="btn primary" style="margin-top:15px" onclick="saveQuote()">Crear cotización</button>`)}
function saveQuote(){let p=db.products.find(x=>x.id===v('q_prod')),q=+v('q_qty'),x={id:uid('q'),number:'Q-'+String(db.quotes.length+1).padStart(6,'0'),date:today(),clientId:v('q_client'),validity:v('q_valid'),status:'Borrador',total:p.price*q,items:[{productId:p.id,name:p.name,qty:q,price:p.price,cost:p.cost}]};db.quotes.unshift(x);save();closeModal();renderQuotes();toast('Cotización creada')}
function convertQuote(id){let q=db.quotes.find(x=>x.id===id);if(!q||q.status==='Convertida')return;posClient=q.clientId;cart=q.items.map(i=>({id:i.productId,qty:i.qty,price:i.price,cost:i.cost}));q.status='Convertida';save();showPage('pos');toast('Cotización cargada en POS')}
function renderCash(){document.getElementById('cash').innerHTML=pageHead('Caja','Apertura, movimientos, retiros y cierre de turno',db.cash.open?'<div class="actions"><button class="btn cash-danger" onclick="quickEmptyCash()">💵 Retirar efectivo</button><button class="btn danger" onclick="closeCash()">Cerrar caja</button></div>':'<button class="btn success" onclick="openCash()">Abrir caja</button>')+`<div class="grid cols3"><div class="card kpi"><div class="label">Estado</div><div class="value">${db.cash.open?'ABIERTA':'CERRADA'}</div></div><div class="card kpi"><div class="label">Saldo</div><div class="value">${money(db.cash.balance)}</div></div><div class="card kpi"><div class="label">Apertura</div><div class="value">${money(db.cash.opening)}</div></div></div><div class="card" style="margin-top:16px"><h3>Movimientos</h3>${table(['Fecha','Tipo','Detalle','Valor'],[...db.payments.map(x=>`<tr><td>${x.date}</td><td>Abono</td><td>${clientName(x.clientId)}</td><td>${money(x.value)}</td></tr>`),...db.expenses.map(x=>`<tr><td>${x.date}</td><td>Gasto</td><td>${x.concept}</td><td>-${money(x.value)}</td></tr>`),...db.sales.filter(x=>x.method!=='Crédito').slice(0,30).map(x=>`<tr><td>${x.date}</td><td>Venta</td><td>${x.number}</td><td>${money(x.total)}</td></tr>`)].join(''))}</div>`}
function openCash(){if(db.cash.open)return toast('La caja ya está abierta');let n=+prompt('Base de apertura de caja:','0');if(isNaN(n)||n<0)return;db.cash.open=true;db.cash.opening=n;db.cash.balance=n;db.cash.openedAt=new Date().toISOString();db.cash.movements=db.cash.movements||[];db.cash.movements.unshift({type:'Apertura',value:n,date:new Date().toISOString()});log('Apertura de caja','Base: '+money(n));save();renderCash();document.getElementById('cashState').textContent='Caja abierta';toast('Caja abierta')}
function quickEmptyCash(){if(!db.cash.open)return toast('Abre la caja primero');let max=Math.max(0,db.cash.balance);let n=+prompt('Valor a retirar de caja:',String(max));if(isNaN(n)||n<=0)return;if(n>max)return toast('El retiro supera el saldo de caja');let reason=prompt('Motivo del retiro:','Retiro de efectivo');db.cash.balance-=n;db.cash.movements=db.cash.movements||[];db.cash.movements.unshift({type:'Retiro',value:n,reason:reason||'Retiro de efectivo',date:new Date().toISOString()});log('Retiro de caja',money(n)+' · '+(reason||'Retiro de efectivo'));save();renderCash();toast('Retiro registrado · saldo '+money(db.cash.balance))}
function closeCash(){if(!db.cash.open)return toast('La caja ya está cerrada');let n=db.cash.balance;if(!confirm('¿Cerrar caja con saldo '+money(n)+'?'))return;db.cash.closures=db.cash.closures||[];db.cash.closures.unshift({date:new Date().toISOString(),opening:db.cash.opening,balance:n});db.cash.open=false;db.cash.balance=0;log('Cierre de caja','Saldo contado: '+money(n));save();renderCash();document.getElementById('cashState').textContent='Caja cerrada';toast('Caja cerrada correctamente')}
function renderExpenses(){document.getElementById('expenses').innerHTML=pageHead('Gastos','Egresos que afectan caja y reportes',`<button class="btn primary" onclick="openExpenseModal()">+ Registrar gasto</button>`)+`<div class="card">${table(['Fecha','Concepto','Categoría','Valor','Método','Usuario'],db.expenses.map(x=>`<tr><td>${x.date}</td><td>${x.concept}</td><td>${x.category}</td><td>${money(x.value)}</td><td>${x.method}</td><td>Administrador</td></tr>`).join(''))}</div>`}
function openExpenseModal(){openModal(`<h2>Registrar gasto</h2><div class="form"><div class="field"><label>Concepto</label><input id="e_concept"></div><div class="field"><label>Categoría</label><input id="e_cat" value="Operación"></div><div class="field"><label>Valor</label><input id="e_value" type="number"></div><div class="field"><label>Forma de pago</label><select id="e_method"><option>Efectivo</option><option>Transferencia</option></select></div><div class="field full"><label>Observación</label><textarea id="e_obs"></textarea></div></div><button class="btn primary" style="margin-top:15px" onclick="saveExpense()">Guardar gasto</button>`)}
function saveExpense(){let x={id:uid('e'),date:today(),concept:v('e_concept'),category:v('e_cat'),value:+v('e_value'),method:v('e_method'),obs:v('e_obs')};db.expenses.unshift(x);if(x.method==='Efectivo')db.cash.balance-=x.value;log('Gasto registrado',x.concept);save();closeModal();renderExpenses();toast('Gasto registrado')}
function renderReports(){let s=stats(),sales=scopedSales().filter(x=>x.status!=='Anulado'),d=today(),todaySales=sales.filter(x=>x.date===d),byPay={};sales.forEach(x=>byPay[x.method]=(byPay[x.method]||0)+x.total);let boxes={};sales.forEach(x=>{let k=x.cashier||'Administrador';boxes[k]=(boxes[k]||0)+x.total});let top={};sales.flatMap(x=>x.items).forEach(i=>top[i.name]=(top[i.name]||0)+i.qty);document.getElementById('reports').innerHTML=pageHead('Reportes','Ventas, inventarios, caja, cartera y resultados',`<button class="btn primary" onclick="exportReportExcel('dailySales')">Excel · Ventas diarias</button><button class="btn" onclick="printReportPDF('dailySales')">PDF · Ventas diarias</button>`)+`<div class="report-grid"><div class="card"><h3>Ventas diarias</h3><p class="muted">${d}</p><h2>${money(todaySales.reduce((a,x)=>a+x.total,0))}</h2><button class="btn sm" onclick="exportReportExcel('dailySales')">Exportar Excel</button> <button class="btn sm" onclick="printReportPDF('dailySales')">Generar PDF</button></div><div class="card"><h3>Inventario</h3><p class="muted">Existencias, costo y valoración</p><h2>${db.products.length} artículos</h2><button class="btn sm" onclick="exportReportExcel('inventory')">Exportar Excel</button> <button class="btn sm" onclick="printReportPDF('inventory')">Generar PDF</button></div><div class="card"><h3>Resultados por caja / cajero</h3>${Object.entries(boxes).map(([k,v])=>`<p><b>${k}</b> · ${money(v)}</p>`).join('')||'<p class="muted">Sin movimientos</p>'}<button class="btn sm" onclick="exportReportExcel('cash')">Exportar Excel</button> <button class="btn sm" onclick="printReportPDF('cash')">Generar PDF</button></div><div class="card"><h3>Cartera / fiados</h3><h2>${money(s.receivable)}</h2><p class="muted">Saldos pendientes por cliente</p><button class="btn sm" onclick="exportReportExcel('credit')">Exportar Excel</button> <button class="btn sm" onclick="printReportPDF('credit')">Generar PDF</button></div><div class="card"><h3>Compras y gastos</h3><p>Compras: ${money(db.purchases.reduce((a,x)=>a+(x.total||0),0))}</p><p>Gastos: ${money(db.expenses.reduce((a,x)=>a+x.value,0))}</p><button class="btn sm" onclick="exportReportExcel('expenses')">Exportar Excel</button> <button class="btn sm" onclick="printReportPDF('expenses')">Generar PDF</button></div><div class="card"><h3>Kardex</h3><p class="muted">Movimientos de inventario</p><button class="btn sm" onclick="exportReportExcel('kardex')">Exportar Excel</button> <button class="btn sm" onclick="printReportPDF('kardex')">Generar PDF</button></div></div><div class="card" style="margin-top:16px"><h3>Resumen de medios de pago</h3>${Object.entries(byPay).map(([k,v])=>`<p><b>${k}</b> · ${money(v)}</p>`).join('')||'<div class="empty">Sin ventas</div>'}</div><div class="card" style="margin-top:16px"><h3>Productos más vendidos</h3>${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<p><b>${k}</b> · ${v}</p>`).join('')||'<div class="empty">Sin ventas</div>'}</div>`}
function reportData(type){if(type==='dailySales')return scopedSales().filter(x=>x.date===today()).map(x=>({Número:x.number,Fecha:x.date,Hora:x.time,Cliente:clientName(x.clientId),Total:x.total,Método:x.method,Estado:x.status}));if(type==='inventory')return db.products.map(p=>({Código:p.code,Producto:p.name,Categoría:p.category,Presentación:p.presentation,Contenido:p.content+' '+p.contentUnit,Unidad:p.unit,Precio:p.price,Costo:p.cost,Stock:p.stock,Mínimo:p.min,ValorInventario:p.stock*p.cost}));if(type==='cash')return scopedSales().filter(x=>x.status!=='Anulado').map(x=>({Fecha:x.date,Hora:x.time,Número:x.number,Cajero:x.cashier||'Administrador',Método:x.method,Total:x.total}));if(type==='credit')return db.clients.filter(c=>c.balance>0).map(c=>({Cliente:c.name,Documento:c.doc,Límite:c.credit,Saldo:c.balance,Disponible:Math.max(0,(c.credit||0)-c.balance),PlazoDías:c.creditDays||0,PróximoPago:c.nextPaymentDate||''}));if(type==='expenses')return db.expenses.map(x=>({Fecha:x.date,Concepto:x.concept,Categoría:x.category,Valor:x.value,Método:x.method}));if(type==='kardex')return db.kardex.map(x=>({Fecha:x.date,Tipo:x.type,Referencia:x.ref,Producto:db.products.find(p=>p.id===x.productId)?.name||'',Cantidad:x.qty,Saldo:x.balance,Costo:x.cost}));return db.sales}
function exportReportExcel(type){let rows=reportData(type);let keys=[...new Set(rows.flatMap(x=>Object.keys(x)))];let html=`<html><head><meta charset="utf-8"></head><body><table><tr>${keys.map(k=>`<th>${k}</th>`).join('')}</tr>${rows.map(r=>`<tr>${keys.map(k=>`<td>${String(r[k]??'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}</td>`).join('')}</tr>`).join('')}</table></body></html>`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'application/vnd.ms-excel'}));a.download='ventara-'+type+'-'+today()+'.xls';a.click();toast('Archivo Excel generado')}
function printReportPDF(type){let rows=reportData(type),title={dailySales:'Ventas diarias',inventory:'Inventario',cash:'Resultados por caja / cajero',credit:'Cartera / fiados',expenses:'Compras y gastos',kardex:'Kardex'}[type]||'Reporte';let keys=[...new Set(rows.flatMap(x=>Object.keys(x)))];let w=window.open('','_blank','width=1000,height=800');if(!w)return toast('El navegador bloqueó la ventana');w.document.write(`<html><head><title>${title}</title><style>body{font-family:Arial;padding:25px}h1{margin-bottom:5px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #ddd;padding:6px;text-align:left}th{background:#f2f2f2}@media print{@page{size:A4;margin:12mm}}</style></head><body><h1>${db.settings.business} · ${title}</h1><p>Fecha: ${today()} · VENTARA POS</p><table><thead><tr>${keys.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${String(r[k]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function exportCreditReport(){exportReportExcel('credit')}

function renderUsers(){document.getElementById('users').innerHTML=pageHead('Usuarios y roles','Roles definidos y permisos por módulo',`<button class="btn primary" onclick="openUserModal()">+ Usuario</button>`)+`<div class="grid cols2"><div class="card"><h3>Roles del sistema</h3>${Object.entries(ROLE_PERMISSIONS).map(([r,p])=>`<div style="padding:12px 0;border-bottom:1px solid var(--border)"><b>${r}</b><p class="muted" style="margin:5px 0">${p.length} módulos autorizados</p><small>${p.map(x=>x==='pos'?'Facturar':x).join(' · ')}</small></div>`).join('')}</div><div class="card"><h3>Usuarios</h3>${table(['Usuario','Rol','Estado','Permisos'],db.users.map(u=>`<tr><td>${u.name}</td><td><span class="badge">${u.role}</span></td><td>${u.active?'Activo':'Inactivo'}</td><td>${(ROLE_PERMISSIONS[u.role]||[]).length} módulos</td></tr>`).join(''))}</div></div>`}
function openUserModal(){openModal(`<h2>Nuevo usuario</h2><div class="form"><div class="field"><label>Nombre</label><input id="u_name" autocomplete="name"></div><div class="field"><label>Usuario de acceso</label><input id="u_username" autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="u_password" type="password" autocomplete="new-password"></div><div class="field"><label>Confirmar contraseña</label><input id="u_password2" type="password" autocomplete="new-password"></div><div class="field"><label>Rol</label><select id="u_role">${Object.keys(ROLE_PERMISSIONS).map(r=>`<option>${r}</option>`).join('')}</select></div><div class="field"><label>Activo</label><select id="u_active"><option value="1">Sí</option><option value="0">No</option></select></div></div><p class="muted">El usuario deberá ingresar estas credenciales cada vez que acceda a VENTARA POS.</p><h3 style="margin-top:16px">Permisos incluidos por rol</h3><div class="role-grid" id="rolePerms"></div><button class="btn primary" style="margin-top:15px" onclick="saveUser()">Guardar usuario</button>`);updateRolePerms()}

async function saveUser(){let role=v('u_role'),name=v('u_name').trim(),username=v('u_username').trim().toLowerCase(),password=v('u_password'),password2=v('u_password2');if(!name)return toast('Escribe el nombre');if(!/^[a-z0-9._-]{3,30}$/.test(username))return toast('Usuario inválido');if(password.length<6)return toast('La contraseña debe tener mínimo 6 caracteres');if(password!==password2)return toast('Las contraseñas no coinciden');if(db.users.some(u=>(u.username||'').toLowerCase()===username))return toast('Ese usuario ya existe');db.users.push({id:uid('u'),name,username,role,active:v('u_active')==='1',passwordHash:await hashPassword(password),permissions:ROLE_PERMISSIONS[role]||[],logo:'',company:db.settings.business});save();closeModal();renderUsers();toast('Usuario creado correctamente')}

function renderSettings(){let logo=db.settings.logo||'assets/ventara.png';document.getElementById('settings').innerHTML=pageHead('Configuración','Empresa, identidad visual, POS, impresión, impuestos, caja, usuarios y sistema',`<button class="btn primary" onclick="saveSettings()">Guardar cambios</button><button class="btn" onclick="exportBackup()">Exportar respaldo</button><button class="btn" onclick="importBackup()">Importar respaldo</button>`)+`<div class="grid cols2"><div class="card"><h3>Datos de la empresa</h3><div class="form"><div class="field"><label>Nombre comercial</label><input id="set_business" value="${db.settings.business}"></div><div class="field"><label>Razón social</label><input id="set_legal" value="${db.settings.legal}"></div><div class="field"><label>NIT / identificación</label><input id="set_nit" value="${db.settings.nit}"></div><div class="field"><label>Ciudad</label><input id="set_city" value="${db.settings.city}"></div><div class="field"><label>Teléfono</label><input id="set_phone" value="${db.settings.phone}"></div><div class="field"><label>Correo</label><input id="set_email" value="${db.settings.email}"></div><div class="field"><label>Tipo de negocio</label><input id="set_type" value="${db.settings.type}"></div><div class="field"><label>Régimen tributario</label><input id="set_tax" value="${db.settings.tax}"></div></div></div><div class="card"><h3>Logo de la empresa</h3><p class="muted">El cliente puede cargar su propio logo. Se mostrará en el encabezado y en el ticket POS.</p><img id="logoPreview" class="brand-preview" src="${logo}" alt="Logo"><div style="margin-top:12px"><input id="set_logo_file" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewCompanyLogo(event)"></div><button class="btn" style="margin-top:10px" onclick="useVentaraLogo()">Usar logo VENTARA</button></div></div><div class="card" style="margin-top:16px"><h3>Facturación y POS</h3><div class="card" style="box-shadow:none;background:#f8fafc">Interfaces preparadas para Factura POS, factura electrónica, nota crédito y nota débito. <b>No se simula conexión real con DIAN.</b> La integración futura debe realizarse mediante proveedor/API autorizado.</div></div><div class="card" style="margin-top:16px"><h3>🖨️ Hardware de caja</h3><p class="muted">Configura la forma en que VENTARA trabajará con impresora térmica POS, lector de códigos, cajón monedero y gramera. El lector de códigos normalmente funciona como teclado y queda listo para escanear en el campo de búsqueda. Para impresoras/cajones USB se recomienda un puente local o Web Serial cuando el dispositivo lo soporte.</p><div class="form"><div class="field"><label>Impresora de tickets</label><select id="hw_printer"><option>Impresora del navegador</option><option>Impresora térmica POS 80 mm / ESC-POS</option><option>Puente local ESC-POS</option></select></div><div class="field"><label>Puerto / conexión</label><input id="hw_port" value="${db.settings.hwPort||''}" placeholder="USB / COM / IP"></div><div class="field"><label>Lector de códigos</label><select id="hw_scanner"><option>Teclado USB (HID)</option><option>Bluetooth HID</option><option>Serial</option></select></div><div class="field"><label>Cajón monedero</label><select id="hw_drawer"><option>Conectado a impresora ESC/POS</option><option>Puerto serial</option><option>No instalado</option></select></div><div class="field"><label>Gramera</label><select id="hw_scale"><option>Manual</option><option>Web Serial</option><option>Puente local</option></select></div></div><div class="actions" style="margin-top:15px"><button class="btn" onclick="testPrinter()">🖨 Probar impresión</button><button class="btn" onclick="openDrawer()">🗄 Abrir cajón</button><button class="btn" onclick="connectSerialDevice()">🔌 Conectar dispositivo</button></div></div>`}

async function openDrawer(){if(window._serialPort?.writable){try{let writer=window._serialPort.writable.getWriter();await writer.write(new Uint8Array([27,112,0,60,120]));writer.releaseLock();return toast('Comando de apertura enviado al cajón')}catch(e){return toast('No se pudo enviar el comando al cajón')}}toast('Cajón preparado: para apertura real conecta la impresora/cajón mediante ESC/POS o un puente local.')}
function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ventara-backup-'+today()+'.json';a.click();log('Respaldo exportado')}
function importBackup(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let f=i.files[0],r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!confirm('Esto sobrescribirá los datos actuales. ¿Continuar?'))return;db=x;save();location.reload()}catch(e){toast('Archivo inválido')}};r.readAsText(f)};i.click()}
function exportCSV(type){let arr=db[type]||[];if(type==='products')arr=db.products;if(type==='sales')arr=db.sales;if(type==='clients')arr=db.clients;if(type==='kardex')arr=db.kardex;let keys=[...new Set(arr.flatMap(x=>Object.keys(x)))];let csv='\ufeff'+keys.join(';')+'\n'+arr.map(x=>keys.map(k=>JSON.stringify(x[k]??'')).join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ventara-'+type+'.csv';a.click()}
function v(id){return document.getElementById(id)?.value||''}function openModal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{
 const map={F1:'pos',F3:'sales',F4:'inventory',F5:'purchases',F6:'clients',F7:'receivables',F8:'cash',F9:'reports',F10:'quotes',F11:'users',F12:'settings'};
 if(e.key==='F2'){
   e.preventDefault();
   if(document.getElementById('pos')?.classList.contains('active')) clearCart();
   else { showPage('pos'); toast('F2 solo vacía la caja de facturación cuando estás facturando'); }
   return;
 }
 if(map[e.key]){e.preventDefault();showPage(map[e.key]);return;}
 if(e.key==='Enter'&&document.getElementById('pos')?.classList.contains('active')&&!e.target.closest('.modalbox')){
   if(cart.length){e.preventDefault();openPaymentModalPOS()}
 }
});
function clock(){document.getElementById('clock').textContent=new Date().toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})}setInterval(clock,1000);clock();nav();document.getElementById('topBusiness').textContent=db.settings.business;document.getElementById('topLogo').src=db.settings.logo||'assets/ventara.png';ensureUserPasswords();save();
</script></body></html>
