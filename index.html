:root{--navy:#005f73;--blue:#009fe3;--orange:#ff8a00;--orange2:#ff6b00;--bg:#f4f8fb;--card:#fff;--text:#17324d;--muted:#6b7c8f;--green:#16a085;--red:#e74c3c;--warn:#f59e0b;--border:#d9e4ec;--shadow:0 8px 24px rgba(0,95,115,.10)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--navy);color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:8px 10px 22px;font-weight:800;font-size:20px}.brand span{background:#fff;color:var(--navy);border-radius:10px;padding:8px}.navgroup{margin:12px 0}.navtitle{font-size:11px;text-transform:uppercase;opacity:.55;padding:10px}.nav{display:flex;align-items:center;gap:10px;width:100%;background:transparent;color:#dbeafe;padding:11px 12px;border-radius:9px;text-align:left;margin:3px 0}.nav:hover,.nav.active{background:rgba(255,255,255,.12);color:#fff}.main{margin-left:250px;width:calc(100% - 250px)}.top{height:70px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5}.business{font-weight:700}.topmeta{display:flex;gap:18px;align-items:center;color:var(--muted);font-size:13px}.content{padding:25px}.page{display:none}.page.active{display:block}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0;font-size:25px}.head p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:8px;font-weight:700;background:#e8eef5;color:var(--text)}.btn.primary{background:var(--blue);color:#fff}.btn.success{background:var(--green);color:#fff}.btn.danger{background:var(--red);color:#fff}.btn.warn{background:#f59e0b;color:#fff}.btn.sm{padding:7px 10px;font-siz function localSave(){localStorage.setItem(KEY,JSON.stringify(db));}
async function cloudSave(){if(!cloudReady||!currentCompanyId)return;const state=structuredClone(db);state.users=(state.users||[]).map(u=>{const x={...u};delete x.passwordHash;return x});const {error}=await supabaseClient.from('ventara_state').upsert({company_id:currentCompanyId,state,updated_at:new Date().toISOString(),updated_by:currentUser?.id||null},{onConflict:'company_id'});if(error){console.error(error);toast('No se pudo guardar en la nube: '+error.message);return}localSave()}
function save(){localSave();clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(()=>cloudSave(),250)}
async function loadCloudState(){const {data,error}=await supabaseClient.from('ventara_state').select('state').eq('company_id',currentCompanyId).maybeSingle();if(error)throw error;if(data?.state&&Object.keys(data.state).length){db=data.state}else{await cloudSave()}db.settings=db.settings||seed.settings;db.users=db.users||[];db.heldSales=db.heldSales||[];db.clients=db.clients||[];db.products=db.products||[];db.sales=db.sales||[];db.purchases=db.purchases||[];db.payments=db.payments||[];db.expenses=db.expenses||[];db.quotes=db.quotes||[];db.orders=db.orders||[];db.kardex=db.kardex||[];db.audit=db.audit||[];db.cash=db.cash||structuredClone(seed.cash);db.settings.logo=db.settings.logo||VENTARA_LOGO;localSave()}
async function loadAccount(){const {data,error}=await supabaseClient.from('ventara_accounts').select('id,user_id,company_id,username,full_name,role,active').eq('user_id',currentSession.user.id).maybeSingle();if(error)throw error;if(!data||!data.active)throw new Error('El usuario no está habilitado en VENTARA.');currentCompanyId=data.company_id;currentUser={id:data.user_id,accountId:data.id,name:data.full_name,username:data.username,role:data.role,active:data.active};await loadCloudState();db.users=[{id:data.user_id,name:data.full_name,username:data.username,role:data.role,active:data.active,permissions:ROLE_PERMISSIONS[data.role]||[]}];cloudReady=true}
function canAccess(page){return !currentUser || (ROLE_PERMISSIONS[currentUser.role]||[]).includes(page)}
function scopedSales(){if(!currentUser)return[];if(currentUser.role==='Administrador'||currentUser.role==='Supervisor')return db.sales;return db.sales.filter(s=>s.userId===currentUser.id||s.cashierId===currentUser.id||s.cashier===currentUser.name)}
function userCashId(){return currentUser?.id||'u-anon'}
function enterApp(){document.getElementById('loginScreen').style.display='none';document.getElementById('mainApp').style.display='flex';const top=document.getElementById('topRole');if(top)top.innerHTML=`${currentUser.name} · ${currentUser.role} <button class="logout-btn" onclick="logout()">Salir</button>`;document.querySelectorAll('.nav').forEach(b=>b.style.display=canAccess(b.dataset.page)?'flex':'none');document.getElementById('topBusiness').textContent=db.settings.business;document.getElementById('topLogo').src=db.settings.logo||VENTARA_LOGO;showPage('dashboard')}
async function login(){const username=document.getElementById('loginUsername').value.trim().toLowerCase();const password=document.getElementById('loginPassword').value;const msg=document.getElementById('loginMsg');if(!username||!password){msg.textContent='Escribe usuario y contraseña.';return}msg.textContent='Verificando…';try{let email='';try{const {data:emailData}=await supabaseClient.rpc('ventara_auth_email',{p_username:username});email=emailData?.email||emailData||''}catch(rpcError){console.warn('RPC no disponible; probando correo técnico',rpcError)}if(!email)email=`${username}@login.ventara.app`;let {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error&&email!==`${username}@login.ventara.app`){const retry=await supabaseClient.auth.signInWithPassword({email:`${username}@login.ventara.app`,password});data=retry.data;error=retry.error}if(error)throw error;currentSession=data.session;await loadAccount();msg.textContent='';enterApp();toast('Sesión iniciada correctamente')}catch(e){console.error(e);msg.textContent='Usuario o contraseña incorrectos.'}}
async function logout(){await supabaseClient.auth.signOut();currentUser=null;currentSession=null;currentCompanyId=null;cloudReady=false;document.getElementById('mainApp').style.display='none';document.getElementById('loginScreen').style.display='flex';document.getElementById('loginUsername').value='';document.getElementById('loginPassword').value='';document.getElementById('loginMsg').textContent='';setTimeout(()=>document.getElementById('loginUsername')?.focus(),50)}
async function initCloud(){try{const {data}=await supabaseClient.auth.getSession();if(data.session){currentSession=data.session;await loadAccount();enterApp()}else{document.getElementById('loginScreen').style.display='flex';document.getElementById('mainApp').style.display='none'}}catch(e){console.error(e);document.getElementById('loginMsg').textContent='No se pudo conectar con VENTARA en la nube.'}}

function pageHead(title,sub,actions=''){return `<div class="head"><div><h1>${title}</h1><p>${sub||''}</p></div><div class="actions">${actions}</div></div>`}
function table(headers,rows,empty='Sin registros'){return `<div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
function nav(){document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>showPage(b.dataset.page));}
function showPage(p){if(currentUser&&!canAccess(p)){toast('Tu rol no tiene permiso para este módulo');return}document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render(p)}
function render(p){({dashboard:renderDashboard,pos:renderPOS,sales:renderSales,orders:renderOrders,products:renderProducts,inventory:renderInventory,purchases:renderPurchases,suppliers:renderSuppliers,clients:renderClients,receivables:renderReceivables,quotes:renderQuotes,cash:renderCash,expenses:renderExpenses,reports:renderReports,users:renderUsers,catalog:renderCatalog,settings:renderSettings}[p]||renderDashboard)()}
function stats(){let d=today(),m=d.slice(0,7),y=d.slice(0,4);let sales=scopedSales().filter(s=>s.status!=='Anulado');return {today:sales.filter(s=>s.date===d).reduce((a,s)=>a+s.total,0),month:sales.filter(s=>s.date.startsWith(m)).reduce((a,s)=>a+s.total,0),year:sales.filter(s=>s.date.startsWith(y)).reduce((a,s)=>a+s.total,0),profit:sales.reduce((a,s)=>a+s.items.reduce((q,i)=>q+(i.price-i.cost)*i.qty,0),0),inventory:db.products.reduce((a,p)=>a+p.stock*p.cost,0),receivable:db.clients.reduce((a,c)=>a+c.balance,0),payable:db.suppliers.reduce((a,s)=>a+s.balance,0),low:db.products.filter(p=>p.stock>0&&p.stock<=p.min).length,out:db.products.filter(p=>p.stock<=0).length}}
function salesTrendHTML(){let days=[...Array(7)].map((_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));return d.toISOString().slice(0,10)});let vals=days.map(ds=>scopedSales().filter(x=>x.date===ds&&x.status!=='Anulado').reduce((a,x)=>a+x.total,0));let max=Math.max(1,...vals);return days.map((ds,i)=>`<div class="trend-col"><div class="trend-value">${money(vals[i])}</div><div class="trend-bar"><i style="height:${Math.max(4,Math.round(vals[i]/max*100))}%"></i></div><small>${ds.slice(5)}</small></div>`).join('')}

</div><div class="card kpi"><div class="label">Por pagar</div><div class="value">${money(s.payable)}</div><div class="sub">Proveedores</div></div><div class="card kpi"><div class="label">Alertas inventario</div><div class="value">${s.low+s.out}</div><div class="sub">${s.low} bajo · ${s.out} agotados</div></div></div><div class="card" style="margin-top:16px"><h3>Ventas de los últimos 7 días</h3><div class="sales-trend">${salesTrendHTML()}</div></div><div class="grid cols2" style="margin-top:16px"><div class="card"><h3>Ventas recientes</h3>${table(['Número','Fecha','Cliente','Total','Estado'],scopedSales().slice(0,7).map(x=>`<tr><td>${x.number}</td><td>${x.date}</td><td>${clientName(x.clientId)}</td><td>${money(x.total)}</td><td><span class="badge ${x.status==='Anulado'?'red':'green'}">${x.status}</span></td></tr>`).join(''))}</div><div class="card"><h3>Productos con stock bajo</h3>${table(['Producto','Stock','Mínimo'],db.products.filter(p=>p.stock<=p.min).map(p=>`<tr><td>${p.name}</td><td>${p.stock}</td><td>${p.min}</td></tr>`).join(''),'No hay alertas') }</div></div>`}

 document.getElementById('pos').innerHTML=`<div class="pos-banner"><div><h2>FACTURAR · CAJA REGISTRADORA</h2><p>Operación rápida para el cajero. Agrega productos, ajusta cantidades y cobra.</p></div><div class="pos-shortcuts"><span class="key">F1</span> Facturar <span class="key">F2</span> Vaciar caja <span class="key">ENTER</span> Cobrar</div></div>

 <div class="pos-shell"><div class="card pos-products"><div style="display:flex;gap:8px;margin-bottom:10px"><input id="posSearch" class="search" style="margin:0" autofocus placeholder="Buscar producto o escanear código de barras…" onkeydown="posSearchKey(event)" oninput="filterPOS(this.value)"><button class="btn primary" onclick="addFirstSearchResult()">+ Agregar</button><button class="btn" onclick="openScaleModal()">⚖ Gramera</button></div><div class="muted" style="margin-bottom:10px;font-size:12px">Los productos se agregan con <b>+ Agregar</b> o con el botón <b>+</b>. <b>−</b> disminuye. <b>ENTER cobra la factura</b> y abre el proceso de pago/ticket.</div><div id="productGrid" class="productgrid posgrid"></div></div>
 <div class="card pos-cart"><div class="cart-head"><h3>Detalle de la FACTURA</h3><button class="btn sm danger" onclick="clearCart()">Vaciar</button></div><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><select id="posClient" style="flex:1;padding:11px;border:1px solid var(--border);border-radius:8px" onchange="posClient=this.value">${db.clients.map(c=>`<option value="${c.id}" ${c.id===posClient?'selected':''}>${c.name}</option>`).join('')}</select><button class="btn sm" onclick="openClientModal()">+ Cliente</button></div><div id="cart" class="cart-list"></div></div></div>`;

function filterPOS(q){let term=(q||'').toLowerCase().trim();let ps=db.products.filter(p=>p.active&&(!term||p.name.toLowerCase().includes(term)||String(p.code).includes(term)));document.getElementById('productGrid').innerHTML=ps.map(p=>`<button class="pitem" onclick="addCart('${p.id}')"><div class="pname">${p.name}</div><div class="pmeta">${p.code} · Stock ${p.stock} ${p.unit}</div><div class="addline"><span class="price">${money(p.price)}</span><span class="addcircle">+</span></div></button>`).join('')||'<div class="empty">No hay productos coincidentes</div>'}
function posSearchKey(e){if(e.key==='Enter'){e.preventDefault();if(cart.length)openPaymentModalPOS();else if((e.target.value||'').trim())toast('Agrega el producto con + antes de cobrar')}else if(e.key==='+'){e.preventDefault();if(cart.length)changeCart(cart[cart.length-1].id,1)}else if(e.key==='-'){e.preventDefault();if(cart.length)changeCart(cart[cart.length-1].id,-1)}}
function addFirstSearchResult(){let q=document.getElementById('posSearch')?.value||'';let ps=db.products.filter(p=>p.active&&(!q||p.name.toLowerCase().includes(q.toLowerCase())||String(p.code).includes(q)));if(ps.length)addCart(ps[0].id);else toast('Producto no encontrado')}
function addCart(id){let p=db.products.find(x=>x.id===id);if(!p||p.stock<=0)return toast('Producto sin stock');let x=cart.find(i=>i.id===id);if(x){if(x.qty>=p.stock)return toast('No hay más unidades disponibles');x.qty++}else cart.push({id,qty:1,price:p.price,cost:p.cost});renderPOSCart();document.getElementById('posSearch')?.focus()}
function renderPOSCart(){let el=document.getElementById('cart');if(!el)return;let subtotal=cart.reduce((a,i)=>a+i.qty*i.price,0),discount=+(document.getElementById('posDiscount')?.value||0),total=Math.max(0,subtotal-discount);el.innerHTML=cart.length?cart.map(i=>{let p=db.products.find(x=>x.id===i.id);return `<div class="cartrow"><div><b>${p.name}</b><br><small class="muted">${money(i.price)} c/u</small></div><div class="qty"><button class="minus" title="Disminuir" onclick="changeCart('${i.id}',-1)">−</button><span style="min-width:26px;text-align:center;font-weight:900">${i.qty}</span><button class="plus" title="Aumentar" onclick="changeCart('${i.id}',1)">+</button></div><b>${money(i.qty*i.price)}</b><button class="btn sm" style="padding:4px 7px" onclick="removeCart('${i.id}')">×</button></div>`}).join('')+`<div class="checkout"><div class="totalline"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="totalline"><span>Descuento</span><input id="posDiscount" type="number" value="${discount}" min="0" style="width:110px;padding:8px;border:1px solid var(--border);border-radius:6px" oninput="renderPOSCart()"></div><div class="checkout-total"><span>TOTAL A COBRAR</span><strong>${money(total)}</strong></div><div class="quick-actions"><button onclick="openPaymentModalPOS()">💳 Forma de pago</button><button onclick="holdSale()">⏸ Suspender venta</button><button onclick="openHeldSalesModal()">📂 Suspendidas (${(db.heldSales||[]).length})</button></div><button class="cash-btn" style="margin-top:10px" onclick="openPaymentModalPOS()">💰 COBRAR VENTA · ${money(total)}</button><small class="muted" style="display:block;text-align:center;margin-top:7px"><b>ENTER</b> = COBRAR · <b>+</b> = aumentar · <b>−</b> = disminuir</small></div>`:'<div class="empty" style="padding:50px 20px"><div style="font-size:45px">🛒</div><h3>Venta nueva</h3><p>Escanea un código, busca un producto o haz clic en <b>+</b> para agregarlo.</p></div>'}
function changeCart(id,d){let x=cart.find(i=>i.id===id),p=db.products.find(x=>x.id===id);if(!x)return;if(d>0&&x.qty>=p.stock)return toast('No hay más stock disponible');x.qty+=d;if(x.qty<=0)removeCart(id);else renderPOSCart()}
function removeCart(id){cart=cart.filter(i=>i.id!==id);renderPOSCart()}
function clearCart(){if(!cart.length)return;if(confirm('¿Vaciar la venta actual?')){cart=[];renderPOSCart();toast('Venta vaciada')}}
function holdSale(){if(!cart.length)return toast('No hay productos para suspender');let discount=+(document.getElementById('posDiscount')?.value||0);db.heldSales=db.heldSales||[];db.heldSales.unshift({id:uid('h'),createdAt:new Date().toISOString(),clientId:posClient,discount,items:cart.map(i=>({...i}))});save();cart=[];renderPOS();toast('Venta suspendida correctamente')}
function openHeldSalesModal(){db.heldSales=db.heldSales||[];if(!db.heldSales.length)return toast('No hay ventas suspendidas');openModal(`<h2>⏸ Ventas suspendidas</h2><p class="muted">Recupera una venta pendiente sin volver a escanear los productos.</p>${table(['Fecha','Cliente','Productos','Total','Acción'],db.heldSales.map(h=>{let total=h.items.reduce((a,i)=>a+i.qty*i.price,0)-(h.discount||0);return `<tr><td>${new Date(h.createdAt).toLocaleString('es-CO')}</td><td>${clientName(h.clientId)}</td><td>${h.items.reduce((a,i)=>a+i.qty,0)}</td><td>${money(Math.max(0,total))}</td><td><button class="btn sm primary" onclick="resumeHeldSale('${h.id}')">Continuar</button> <button class="btn sm danger" onclick="deleteHeldSale('${h.id}')">Eliminar</button></td></tr>`}).join(''))}`)}
function resumeHeldSale(id){let h=(db.heldSales||[]).find(x=>x.id===id);if(!h)return;db.heldSales=db.heldSales.filter(x=>x.id!==id);cart=h.items.map(i=>({...i}));posClient=h.clientId||'c1';closeModal();showPage('pos');setTimeout(()=>{let d=document.getElementById('posDiscount');if(d)d.value=h.discount||0;renderPOSCart();document.getElementById('posSearch')?.focus()},60);save();toast('Venta recuperada')}
function deleteHeldSale(id){if(!confirm('¿Eliminar esta venta suspendida?'))return;db.heldSales=(db.heldSales||[]).filter(x=>x.id!==id);save();openHeldSalesModal()}
function openPaymentModalPOS(){if(!cart.length)return toast('Agrega productos a la venta');let subtotal=cart.reduce((a,i)=>a+i.qty*i.price,0),discount=+(document.getElementById('posDiscount')?.value||0),total=Math.max(0,subtotal-discount);let clients=(db.clients||[]).filter(c=>String(c.name||'').trim().toLowerCase()!=='consumidor final'&&c.id!=='c1');openModal(`<h2>💰 Cobrar VENTA</h2><p class="muted">Caja registradora · Total a cobrar</p><div style="text-align:center;background:#f4fbfd;padding:15px;border-radius:12px"><div class="muted">TOTAL</div><div style="font-size:38px;font-weight:900;color:#005f73">${money(total)}</div></div><h3>Forma de pago</h3><div class="payment-grid"><button id="pm-Efectivo" class="selected" onclick="selectPay('Efectivo')">💵 Efectivo</button><button id="pm-Tarjeta" onclick="selectPay('Tarjeta')">💳 Tarjeta</button><button id="pm-Transferencia" onclick="selectPay('Transferencia')">📲 Transferencia</button><button id="pm-Mixto" onclick="selectPay('Mixto')">🔀 Mixto</button><button id="pm-Crédito" onclick="selectPay('Crédito')">🧾 Crédito</button></div><div id="cashFields" style="margin-top:15px"><div class="field"><label>EFECTIVO RECIBIDO</label><input id="cashReceived" type="number" min="0" value="${total}" oninput="calcChange(${total})" onkeydown="if(event.key==='Enter')confirmPayment(${total},event)"></div><div class="totalline" style="font-size:18px;margin-top:10px"><span>Cambio</span><b id="cashChange">${money(0)}</b></div></div><div id="cardFields" style="display:none;margin-top:15px"><div class="field"><label>TIPO DE TARJETA</label><select id="cardType" required><option value="">-- Selecciona --</option><option value="Débito">Débito</option><option value="Crédito Visa">Crédito Visa</option><option value="Crédito Mastercard">Crédito Mastercard</option><option value="Otra">Otra</option></select></div></div><div id="transferFields" style="display:none;margin-top:15px"><div class="field"><label>BANCO / BILLETERA</label><select id="transferBank" required><option value="">-- Selecciona --</option><option value="Nequi">Nequi</option><option value="Daviplata">Daviplata</option><option value="Bancolombia">Bancolombia</option><option value="Otros">Otros</option></select></div></div><div id="creditFields" style="display:none;margin-top:15px"><div class="field"><label>CLIENTE PARA VENTA A CRÉDITO</label><select id="creditClientSelect"><option value="">-- Selecciona un cliente --</option>${clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><p id="creditWarning" class="muted" style="color:#9f1239">Selecciona un cliente para vender a crédito</p></div><div id="mixedFields" style="display:none;margin-top:15px"><div class="form"><div class="field"><label>Efectivo</label><input id="mixCash" type="number" value="0" oninput="calcMixed(${total})"></div><div class="field"><label>Tarjeta/Transferencia</label><input id="mixOther" type="number" value="${total}" oninput="calcMixed(${total})"></div></div><p id="mixStatus" class="muted"></p></div><div class="actions" style="margin-top:18px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn success" style="padding:13px 22px" onclick="confirmPayment(${total},event)">✓ CONFIRMAR Y REGISTRAR VENTA</button></div>`)}
let selectedPay='Efectivo';function selectPay(method){selectedPay=method;document.querySelectorAll('.payment-grid button').forEach(b=>b.classList.remove('selected'));let active=document.getElementById('pm-'+method);if(active)active.classList.add('selected');let panels={Efectivo:'cashFields',Tarjeta:'cardFields',Transferencia:'transferFields',Mixto:'mixedFields','Crédito':'creditFields'};Object.values(panels).forEach(id=>{let el=document.getElementById(id);if(el)el.style.display='none'});let panel=document.getElementById(panels[method]);if(panel)panel.style.display='block';let cash=document.getElementById('cashFields');if(cash)cash.style.display=method==='Efectivo'?'block':'none';let mixed=document.getElementById('mixedFields');if(mixed)mixed.style.display=method==='Mixto'?'block':'none'}
function calcChange(total){let r=+(document.getElementById('cashReceived')?.value||0);let el=document.getElementById('cashChange');if(el)el.textContent=money(Math.max(0,r-total))}
function calcMixed(total){let a=+(document.getElementById('mixCash')?.value||0),b=+(document.getElementById('mixOther')?.value||0),d=a+b-total;let el=document.getElementById('mixStatus');if(el)el.textContent=d>=0?'Pago completo · Cambio '+money(d):'Faltan '+money(Math.abs(d))}
function confirmPayment(total,e){if(e){e.preventDefault();e.stopPropagation()}try{if(!cart.length)return toast('Agrega productos a la venta');if(selectedPay==='Efectivo'){let r=+(document.getElementById('cashReceived')?.value||0);if(r<total)return toast('El efectivo recibido es menor al total')}if(selectedPay==='Mixto'){let a=+(document.getElementById('mixCash')?.value||0),b=+(document.getElementById('mixOther')?.value||0);if(a+b!==total)return toast('El pago mixto debe ser exactamente igual al total')}if(selectedPay==='Crédito'){let creditSelect=document.getElementById('creditClientSelect');if(!creditSelect||!creditSelect.value)return alert('Selecciona un cliente para vender a crédito');posClient=creditSelect.value}let sale=finishSale(selectedPay,total);if(!sale)return;offerTicket(sale.id)}catch(error){console.error('Error al procesar la venta:',error);alert('Ocurrió un error al registrar la venta: '+(error?.message||String(error)))}}
function finishSale(methodOverride,totalOverride){if(!cart.length)return null;let client=db.clients.find(c=>c.id===posClient)||db.clients[0];if(!client)return null;let discount=+(document.getElementById('posDiscount')?.value||0);let subtotal=cart.reduce((a,i)=>a+i.qty*i.price,0),total=totalOverride??Math.max(0,subtotal-discount),method=methodOverride||document.getElementById('payMethod')?.value||'Efectivo';if(method==='Crédito'){if(client.id==='c1'){toast('Selecciona un cliente para vender a crédito');return null}if(client.creditEnabled===false){toast('Este cliente no tiene el fiado habilitado');return null}if((client.balance||0)+total>(client.credit||0)){toast('La venta supera el límite de crédito disponible');return null}client.balance=(client.balance||0)+total;client.lastCreditDate=today();client.nextPaymentDate=new Date(Date.now()+((client.creditDays||30)*86400000)).toISOString().slice(0,10)}cart.forEach(i=>{let p=db.products.find(x=>x.id===i.id);if(!p)throw new Error('Producto no encontrado: '+i.id);if(i.qty>p.stock)throw new Error('Stock insuficiente para '+p.name);p.stock-=i.qty;db.kardex.unshift({id:uid('k'),date:today(),type:'Venta',ref:'',productId:p.id,qty:-i.qty,balance:p.stock,cost:p.cost})});let sale={cashier:currentUser?.name||'Administrador',cashierId:currentUser?.id||'',userId:currentUser?.id||'',cashId:userCashId(),id:uid('v'),number:'V-'+String(db.sales.length+1).padStart(6,'0'),date:today(),time:new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}),clientId:client.id,total,discount,method,status:method==='Crédito'?'Crédito':'Pagada',items:cart.map(i=>{let p=db.products.find(x=>x.id===i.id);return {...i,name:p.name}})};db.sales.unshift(sale);if(method!=='Crédito')db.cash.balance+=total;if(typeof log==='function')log('Venta registrada',sale.number);save();cart=[];closeModal();renderPOS();toast('FACTURA registrada · '+sale.number);return sale}
function offerTicket(id){openModal(`<h2>✓ Venta registrada</h2><p>La venta se registró correctamente.</p><div class="ticket-preview"><b>${db.sales.find(s=>s.id===id)?.number}</b><br>Total: ${money(db.sales.find(s=>s.id===id)?.total)}<br>Pago: ${db.sales.find(s=>s.id===id)?.method}</div><div class="actions" style="margin-top:15px"><button class="btn" onclick="closeModal()">Cerrar</button><button class="btn primary" onclick="printTicket('${id}')">🖨 Imprimir ticket POS</button></div>`)}
function openScaleModal(){if(!db.products.length)return toast('Crea productos primero');let weighted=db.products.filter(p=>p.active&&(p.unit==='G'||p.unit==='KG'));openModal(`<h2>⚖ Gramera / báscula</h2><p class="muted">Puedes ingresar el peso manualmente o conectar una gramera compatible mediante Web Serial cuando el navegador y el dispositivo lo permitan.</p><div class="form"><div class="field"><label>Producto pesable</label><select id="scale_prod">${weighted.map(p=>`<option value="${p.id}">${p.name} · ${p.unit} · ${money(p.price)}/${p.unit}</option>`).join('')||'<option value="">No hay productos G/KG</option>'}</select></div><div class="field"><label>Peso leído (gramos)</label><input id="scale_grams" type="number" step="0.001" min="0" value="1000" autofocus onkeydown="if(event.key==='Enter')addScaleProduct()"></div></div><div class="actions" style="margin-top:15px"><button class="btn" onclick="connectSerialDevice()">🔌 Conectar gramera</button><button class="btn primary" onclick="addScaleProduct()">+ Agregar peso</button></div>`)}
function addScaleProduct(){let id=v('scale_prod'),grams=+v('scale_grams');let p=db.products.find(x=>x.id===id);if(!p||!grams||grams<=0)return toast('Selecciona producto e ingresa un peso válido');let qty=p.unit==='KG'?grams/1000:grams;if(qty>p.stock)return toast('El peso supera el stock disponible');let x=cart.find(i=>i.id===id);if(x)x.qty+=qty;else cart.push({id,qty,price:p.price,cost:p.cost});closeModal();showPage('pos');toast(`${qty.toFixed(3)} ${p.unit} agregado`);setTimeout(()=>document.getElementById('posSearch')?.focus(),50)}
async function connectSerialDevice(){if(!('serial' in navigator))return toast('Tu navegador no permite Web Serial. Usa Chrome/Edge actualizado o un puente local.');try{window._serialPort=await navigator.serial.requestPort();await window._serialPort.open({baudRate:9600});toast('Dispositivo serial conectado');}catch(e){toast('No se pudo conectar el dispositivo')}}
function renderSales(){let rows=scopedSales().map(s=>`<tr><td>${s.number}</td><td>${s.date} ${s.time}</td><td>${clientName(s.clientId)}</td><td>${money(s.total)}</td><td>${s.method}</td><td><span class="badge ${s.status==='Anulado'?'red':'green'}">${s.status}</span></td><td><button class="btn sm" onclick="viewSale('${s.id}')">Ver</button> <button class="btn sm" onclick="returnSale('${s.id}')">Devolver</button></td></tr>`).join('');document.getElementById('sales').innerHTML=pageHead('VENTAS','Historial de facturas, consulta, reimpresión, anulación y devoluciones',`<button class="btn primary" onclick="showPage('pos')">+ NUEVA FACTURA</button>`)+`<div class="card">${table(['Número','Fecha','Cliente','Total','Pago','Estado','Acciones'],rows)}</div>`}
function viewSale(id){let s=db.sales.find(x=>x.id===id);openModal(`<h2>${s.number}</h2><p>${s.date} ${s.time} · ${clientName(s.clientId)}</p>${table(['Producto','Cant.','Precio','Total'],s.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join(''))}<h2 style="text-align:right">${money(s.total)}</h2><button class="btn primary" onclick="printTicket('${s.id}')">Imprimir ticket</button>`)}
function printTicket(id){let s=db.sales.find(x=>x.id===id);if(!s)return;let logo=db.settings.logo||VENTARA_LOGO;let rows=s.items.map(i=>`<div class="r"><span>${i.qty} x ${i.name}</span><span>${money(i.qty*i.price)}</span></div>`).join('');let w=window.open('','_blank','width=420,height=800');if(!w)return toast('El navegador bloqueó la ventana de impresión');w.document.write(`<html><head><title>${s.number}</title><style>@page{size:80mm auto;margin:0}html,body{margin:0;padding:0;background:#fff}body{font-family:'Courier New',monospace;font-size:12px;color:#000}.ticket80{width:80mm;box-sizing:border-box;padding:3mm}.c{text-align:center}.l{text-align:left}.r{display:flex;justify-content:space-between;gap:5px}.r span:first-child{max-width:55mm;word-break:break-word}.hr{border-top:1px dashed #000;margin:6px 0}img{max-width:48mm;max-height:22mm;object-fit:contain}h2{font-size:17px;margin:4px 0}h3{font-size:14px;margin:4px 0}</style></head><body><div class="ticket80"><div class="c"><img src="${logo}"><h2>${db.settings.business}</h2><div>${db.settings.nit||''}</div><div>${db.settings.city||''}</div><div>${db.settings.phone||''}</div></div><div class="hr"></div><div><b>FACTURA POS ${s.number}</b><br>${s.date} ${s.time}<br>Cliente: ${clientName(s.clientId)}</div><div class="hr"></div>${rows}<div class="hr"></div><div class="r"><b>TOTAL</b><b>${money(s.total)}</b></div><div class="r"><span>Medio de pago</span><span>${s.method}</span></div>${s.method==='Crédito'?`<div class="r"><span>Plazo</span><span>${db.clients.find(c=>c.id===s.clientId)?.creditDays||0} días</span></div>`:''}<div class="hr"></div><div class="c">Gracias por su compra<br>VENTARA POS</div></div><script>window.onload=()=>{window.print()}<\/script>

</body></html>`);w.document.close()}
function returnSale(id){let s=db.sales.find(x=>x.id===id);if(!s||s.status==='Anulado'||s.status.includes('DEV'))return toast('Venta no disponible');openModal(`<h2>↩ Devolución de ${s.number}</h2><p class="muted">Selecciona las cantidades a devolver. La venta original se conserva.</p><div class="tablewrap"><table class="table"><thead><tr><th>Producto</th><th>Vendida</th><th>Devolver</th></tr></thead><tbody>${s.items.map((i,n)=>`<tr><td>${i.name}</td><td>${i.qty}</td><td><input id="ret_${n}" type="number" min="0" max="${i.qty}" step="0.001" value="${i.qty}" style="width:110px;padding:8px;border:1px solid var(--border);border-radius:7px"></td></tr>`).join('')}</tbody></table></div><div class="field" style="margin-top:12px"><label>Motivo</label><input id="ret_reason" placeholder="Cambio, garantía, error de venta…"></div><div class="actions" style="margin-top:16px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn danger" onclick="confirmReturn('${s.id}')">Confirmar devolución</button></div>`)}
function confirmReturn(id){let s=db.sales.find(x=>x.id===id);if(!s)return;let returned=0,totalReturn=0;s.items.forEach((i,n)=>{let q=Math.max(0,Math.min(i.qty,+v('ret_'+n)||0));if(q){let p=db.products.find(x=>x.id===i.id);if(p){p.stock+=q;db.kardex.unshift({id:uid('k'),date:today(),type:'Devolución',ref:s.number,productId:p.id,qty:q,balance:p.stock,cost:p.cost,user:currentUser?.name||'Sistema'})}returned+=q;totalReturn+=q*i.price}});if(!returned)return toast('Indica al menos una cantidad para devolver');if(s.method==='Crédito'){let c=db.clients.find(x=>x.id===s.clientId);if(c)c.balance=Math.max(0,c.balance-totalReturn)}else db.cash.balance=Math.max(0,db.cash.balance-totalReturn);let all=s.items.every((i,n)=>(+v('ret_'+n)||0)>=i.qty);s.status=all?'DEVUELTA':'DEVOLUCIÓN PARCIAL';s.returnedAmount=(s.returnedAmount||0)+totalReturn;s.returnReason=v('ret_reason');s.returnedAt=new Date().toISOString();log('Devolución '+(all?'total':'parcial'),s.number+' · '+money(totalReturn));save();closeModal();toast('Devolución registrada · '+money(totalReturn));renderSales()}
function renderProducts(){document.getElementById('products').innerHTML=pageHead('Artículos','Productos, precios, costos, categorías, imágenes y códigos de barras',`<button class="btn primary" onclick="openProductModal()">+ Nuevo artículo</button><button class="btn" onclick="openCategoriesModal()">📂 Categorías</button><button class="btn" onclick="exportCSV('products')">Exportar CSV</button>`)+`<div class="card">${table(['Imagen','Código','Producto','Categoría','Unidad','Precio','Costo','Stock','Estado','Acciones'],db.products.map(p=>`<tr><td>${p.image?`<img class="product-thumb" src="${p.image}" alt="${p.name}">`:'—'}</td><td>${p.code}</td><td><b>${p.name}</b></td><td>${p.category}</td><td>${p.unit}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${p.stock}</td><td><span class="badge ${p.active?'green':'red'}">${p.active?'Activo':'Inactivo'}</span></td><td><button class="btn sm" onclick="openProductModal('${p.id}')">Editar</button> <button class="btn sm danger" onclick="deleteProduct('${p.id}')">Eliminar</button></td></tr>`).join(''))}</div>`}
function openProductModal(id=''){let p=db.products.find(x=>x.id===id)||{name:'',code:'',category:'General',unit:'UND',presentation:'Unidad',content:1,contentUnit:'UND',price:0,cost:0,stock:0,min:0,active:true};openModal(`<h2>${id?'Editar':'Nuevo'} artículo</h2><div class="form"><div class="field"><label>Nombre del producto</label><input id="f_name" value="${p.name}"></div><div class="field"><label>Código / barras</label><input id="f_code" value="${p.code}"></div><div class="field"><label>Categoría</label><select id="productCategory">${[...(Array.isArray(db.categories)?db.categories:[]),...(Array.isArray(db.categoryList)?db.categoryList:[]),...db.products.map(x=>x.category)].map(c=>typeof c==='string'?c:(c?.name||c?.label||'')).map(x=>x.trim()).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).map(c=>`<option value="${String(c).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}" ${c===p.category?'selected':''}>${String(c).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}</option>`).join('')}</select></div><div class="field full"><label>Imagen del producto</label><input id="f_image_file" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewProductImage(event)"><input id="f_image" type="hidden" value="${p.image||''}"><div style="margin-top:8px">${p.image?`<img id="productImagePreview" class="product-thumb" src="${p.image}" alt="Vista previa">`:`<div id="productImagePreview" class="empty" style="padding:14px">Sin imagen</div>`}</div></div><div class="field"><label>Unidad de venta</label><select id="f_unit"><option ${p.unit==='UND'?'selected':''}>UND</option><option ${p.unit==='G'?'selected':''}>G</option><option ${p.unit==='KG'?'selected':''}>KG</option><option ${p.unit==='ML'?'selected':''}>ML</option><option ${p.unit==='L'?'selected':''}>L</option><option ${p.unit==='M'?'selected':''}>M</option><option ${p.unit==='CM'?'selected':''}>CM</option><option ${p.unit==='CAJA'?'selected':''}>CAJA</option><option ${p.unit==='PAQ'?'selected':''}>PAQ</option></select></div><div class="field"><label>Presentación</label><input id="f_presentation" value="${p.presentation||''}" placeholder="Ej. Bolsa, botella, caja, unidad"></div><div class="field"><label>Contenido / gramaje</label><input id="f_content" type="number" step="0.001" min="0" value="${p.content??1}"></div><div class="field"><label>Unidad del contenido</label><select id="f_contentUnit"><option ${p.contentUnit==='G'?'selected':''}>G</option><option ${p.contentUnit==='KG'?'selected':''}>KG</option><option ${p.contentUnit==='ML'?'selected':''}>ML</option><option ${p.contentUnit==='L'?'selected':''}>L</option><option ${p.contentUnit==='UND'?'selected':''}>UND</option></select></div><div class="field"><label>Precio venta</label><input id="f_price" type="number" step="0.01" value="${p.price}"></div><div class="field"><label>Costo</label><input id="f_cost" type="number" step="0.01" value="${p.cost}"></div><div class="field"><label>Stock inicial</label><input id="f_stock" type="number" step="0.001" value="${p.stock}"></div><div class="field"><label>Stock mínimo</label><input id="f_min" type="number" step="0.001" value="${p.min}"></div></div><p class="muted" style="margin-top:10px">Ejemplo: producto vendido por KG, contenido 500 G por bolsa; o bebida de 1.5 L. El stock y las cantidades admiten decimales para productos pesables.</p><div class="actions" style="margin-top:18px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveProduct('${id}')">Guardar</button></div>`)}
function previewProductImage(e){let f=e.target.files?.[0];if(!f)return;if(f.size>2*1024*1024)return toast('La imagen debe pesar máximo 2 MB');let r=new FileReader();r.onload=()=>{document.getElementById('f_image').value=r.result;let el=document.getElementById('productImagePreview');if(el){el.outerHTML=`<img id="productImagePreview" class="product-thumb" src="${r.result}" alt="Vista previa">`}};r.readAsDataURL(f)}
async function saveProduct(id){let p=db.products.find(x=>x.id===id);let old=p?.stock||0;let data={name:v('f_name'),code:v('f_code'),category:v('productCategory'),image:v('f_image'),unit:v('f_unit'),presentation:v('f_presentation'),content:+v('f_content')||1,contentUnit:v('f_contentUnit'),price:+v('f_price'),cost:+v('f_cost'),stock:+v('f_stock'),min:+v('f_min'),active:true};if(!data.name)return toast('Escribe el nombre del producto');const file=document.getElementById('f_image_file')?.files?.[0];if(file&&cloudReady&&currentCompanyId){if(file.size>5*1024*1024)return toast('La imagen debe pesar máximo 5 MB');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const productId=id||uid('p');const path=`${currentCompanyId}/${productId}.${ext}`;const {error:upError}=await supabaseClient.storage.from('product-images').upload(path,file,{upsert:true,contentType:file.type||'image/jpeg'});if(upError)return toast('No se pudo subir la imagen: '+upError.message);data.image=supabaseClient.storage.from('product-images').getPublicUrl(path).data.publicUrl;data.id=productId}if(p)Object.assign(p,data);else{data.id=data.id||uid('p');db.products.push(data);if(data.stock)db.kardex.unshift({id:uid('k'),date:today(),type:'Entrada inicial',ref:'',productId:data.id,qty:data.stock,balance:data.stock,cost:data.cost})}if(p&&old!==data.stock)db.kardex.unshift({id:uid('k'),date:today(),type:'Ajuste',ref:'',productId:p.id,qty:data.stock-old,balance:data.stock,cost:data.cost});log(id?'Artículo editado':'Artículo creado',data.name);save();await cloudSave();closeModal();toast('Artículo guardado');renderProducts()}
function deleteProduct(id){if(!confirm('¿Eliminar/desactivar artículo?'))return;let p=db.products.find(x=>x.id===id);p.active=false;log('Artículo desactivado',p.name);save();renderProducts()}
function renderInventory(filter='all'){let moves=db.kardex||[];if(filter==='in')moves=moves.filter(k=>['Entrada','Entrada inicial','Compra'].includes(k.type)||k.qty>0);if(filter==='out')moves=moves.filter(k=>['Salida','Venta'].includes(k.type)||k.qty<0);document.getElementById('inventory').innerHTML=pageHead('Inventario y Kardex','Existencias, entradas, salidas y trazabilidad',`<button class="btn primary" onclick="openAdjustModal()">+ Movimiento</button><button class="btn" onclick="openStockMovementModal('in')">+ Entrada</button><button class="btn" onclick="openStockMovementModal('out')">− Salida</button><button class="btn" onclick="exportCSV('kardex')">Exportar Kardex</button>`)+`<div class="card" style="margin-bottom:14px"><div class="actions"><button class="btn ${filter==='all'?'primary':''}" onclick="renderInventory('all')">Todos</button><button class="btn ${filter==='in'?'primary':''}" onclick="renderInventory('in')">Entradas</button><button class="btn ${filter==='out'?'primary':''}" onclick="renderInventory('out')">Salidas</button></div></div><div class="grid cols2"><div class="card">${table(['Producto','Stock','Mínimo','Estado','Valor costo'],db.products.map(p=>`<tr><td>${p.name}</td><td>${p.stock}</td><td>${p.min}</td><td>${p.stock<=0?'<span class="badge red">Agotado</span>':p.stock<=p.min?'<span class="badge warn">Bajo</span>':'<span class="badge green">OK</span>'}</td><td>${money(p.stock*p.cost)}</td></tr>`).join(''))}</div><div class="card"><h3>${filter==='in'?'Entradas de inventario':filter==='out'?'Salidas de inventario':'Movimientos recientes'}</h3>${table(['Fecha','Tipo','Producto','Cant.','Saldo','Usuario'],moves.slice(0,50).map(k=>`<tr><td>${k.date}</td><td>${k.type}</td><td>${productName(k.productId)}</td><td>${k.qty}</td><td>${k.balance}</td><td>${k.user||'Sistema'}</td></tr>`).join(''))}</div></div>`}
function productName(id){return db.products.find(p=>p.id===id)?.name||''}
function openStockMovementModal(type){let isIn=type==='in';openModal(`<h2>${isIn?'Entrada':'Salida'} de inventario</h2><div class="form"><div class="field"><label>Producto</label><select id="m_prod">${db.products.filter(p=>p.active!==false).map(p=>`<option value="${p.id}">${p.name} (${p.stock})</option>`).join('')}</select></div><div class="field"><label>Cantidad</label><input id="m_qty" type="number" min="0.001" step="0.001"></div><div class="field full"><label>Motivo / referencia</label><input id="m_reason" placeholder="${isIn?'Compra, recepción, devolución…':'Merma, daño, consumo, ajuste…'}"></div></div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="saveStockMovement('${type}')">Registrar ${isIn?'entrada':'salida'}</button></div>`)}
function saveStockMovement(type){let p=db.products.find(x=>x.id===v('m_prod'));let q=+v('m_qty');if(!p||q<=0)return toast('Indica un producto y una cantidad válida');if(type==='out'&&q>p.stock)return toast('La salida supera el inventario disponible');p.stock=type==='in'?p.stock+q:p.stock-q;db.kardex.unshift({id:uid('k'),date:today(),type:type==='in'?'Entrada':'Salida',ref:v('m_reason'),productId:p.id,qty:type==='in'?q:-q,balance:p.stock,cost:p.cost,user:currentUser?.name||'Sistema'});log(type==='in'?'Entrada inventario':'Salida inventario',p.name);save();closeModal();renderInventory();toast(`Movimiento registrado: ${type==='in'?'entrada':'salida'}`)}
function openAdjustModal(){openModal(`<h2>Ajuste de inventario</h2><div class="form"><div class="field"><label>Producto</label><select id="a_prod">${db.products.map(p=>`<option value="${p.id}">${p.name} (${p.stock})</option>`).join('')}</select></div><div class="field"><label>Nuevo stock</label><input id="a_stock" type="number"></div><div class="field full"><label>Motivo</label><input id="a_reason" placeholder="Conteo físico, merma, corrección…"></div></div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="saveAdjust()">Aplicar</button></div>`)}
function saveAdjust(){let p=db.products.find(x=>x.id===v('a_prod'));let n=+v('a_stock'),d=n-p.stock;p.stock=n;db.kardex.unshift({id:uid('k'),date:today(),type:'Ajuste',ref:v('a_reason'),productId:p.id,qty:d,balance:n,cost:p.cost,user:currentUser?.name||'Sistema'});log('Ajuste inventario',p.name);save();closeModal();renderInventory();toast('Inventario actualizado')}
function renderPurchases(){document.getElementById('purchases').innerHTML=pageHead('Compras','Entradas de mercancía, costos y cuentas por pagar',`<button class="btn primary" onclick="openPurchaseModal()">+ Registrar compra</button>`)+`<div class="card">${table(['Número','Fecha','Proveedor','Total','Pago','Estado'],db.purchases.map(x=>`<tr><td>${x.number}</td><td>${x.date}</td><td>${supplierName(x.supplierId)}</td><td>${money(x.total)}</td><td>${x.method}</td><td>${x.status}</td></tr>`).join(''))}</div>`}
function supplierName(id){return db.suppliers.find(s=>s.id===id)?.name||''}
function openPurchaseModal(){openModal(`<h2>Registrar compra</h2><div class="form"><div class="field"><label>Proveedor</label><select id="b_sup">${db.suppliers.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div><div class="field"><label>Forma de pago</label><select id="b_method"><option>Crédito</option><option>Efectivo</option><option>Transferencia</option></select></div><div class="field"><label>Producto</label><select id="b_prod">${db.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div class="field"><label>Cantidad</label><input id="b_qty" type="number" value="1" min="1"></div><div class="field"><label>Costo unitario</label><input id="b_cost" type="number" value="0"></div></div><p class="muted">Esta versión registra una línea por compra; se puede ampliar a múltiples líneas.</p><button class="btn primary" onclick="savePurchase()">Registrar compra</button>`)}
function savePurchase(){let p=db.products.find(x=>x.id===v('b_prod')),qty=+v('b_qty'),cost=+v('b_cost')||p.cost,total=qty*cost,s=db.suppliers.find(x=>x.id===v('b_sup'));p.stock+=qty;p.cost=cost;db.kardex.unshift({id:uid('k'),date:today(),type:'Compra',ref:'',productId:p.id,qty,balance:p.stock,cost});if(v('b_method')==='Crédito')s.balance+=total;else db.cash.balance+=0;let b={id:uid('b'),number:'C-'+String(db.purchases.length+1).padStart(6,'0'),date:today(),supplierId:s.id,total,method:v('b_method'),status:'Registrada',items:[{productId:p.id,qty,cost}]};db.purchases.unshift(b);log('Compra registrada',b.number);save();closeModal();toast('Compra registrada');renderPurchases()}
function renderSuppliers(){document.getElementById('suppliers').innerHTML=pageHead('Proveedores','Maestro de proveedores y cuentas por pagar',`<button class="btn primary" onclick="openSupplierModal()">+ Proveedor</button>`)+`<div class="card">${table(['Proveedor','NIT','Teléfono','Correo','Por pagar','Acciones'],db.suppliers.map(s=>`<tr><td>${s.name}</td><td>${s.nit}</td><td>${s.phone}</td><td>${s.email}</td><td>${money(s.balance)}</td><td><button class="btn sm" onclick="openSupplierModal('${s.id}')">Editar</button></td></tr>`).join(''))}</div>`}
function openSupplierModal(id=''){let s=db.suppliers.find(x=>x.id===id)||{name:'',nit:'',phone:'',email:'',balance:0};openModal(`<h2>${id?'Editar':'Nuevo'} proveedor</h2><div class="form"><div class="field"><label>Nombre / razón social</label><input id="s_name" value="${s.name}"></div><div class="field"><label>NIT</label><input id="s_nit" value="${s.nit}"></div><div class="field"><label>Teléfono</label><input id="s_phone" value="${s.phone}"></div><div class="field"><label>Correo</label><input id="s_email" value="${s.email}"></div></div><button class="btn primary" style="margin-top:15px" onclick="saveSupplier('${id}')">Guardar</button>`)}
function saveSupplier(id){let s=db.suppliers.find(x=>x.id===id);let d={name:v('s_name'),nit:v('s_nit'),phone:v('s_phone'),email:v('s_email'),balance:s?.balance||0};if(s)Object.assign(s,d);else{d.id=uid('s');db.suppliers.push(d)}save();closeModal();renderSuppliers();toast('Proveedor guardado')}
function renderClients(){document.getElementById('clients').innerHTML=pageHead('Clientes','Clientes, línea de crédito y condiciones de pago',`<button class="btn primary" onclick="openClientModal()">+ Cliente</button>`)+`<div class="card">${table(['Cliente','Documento','Teléfono','Crédito','Saldo','Estado','Acciones'],db.clients.map(c=>`<tr><td>${c.name}</td><td>${c.doc}</td><td>${c.phone}</td><td>${money(c.credit)}</td><td>${money(c.balance)}</td><td>${c.balance>0?'<span class="badge warn">Pendiente</span>':'<span class="badge green">Al día</span>'}</td><td><button class="btn sm" onclick="openClientModal('${c.id}')">Editar</button>${c.id!=='c1'&&String(c.name||'').trim().toLowerCase()!=='consumidor final'?` <button class="btn sm danger" onclick="deleteClient('${c.id}')">Eliminar</button>`:''}</td></tr>`).join(''))}</div>`}
function openClientModal(id=''){let c=db.clients.find(x=>x.id===id)||{name:'',doc:'',phone:'',email:'',credit:0,balance:0,creditDays:30,creditEnabled:false};openModal(`<h2>${id?'Editar':'Nuevo'} cliente</h2><p class="muted">Configura aquí la línea de crédito o el tradicional <b>fiado</b>.</p><div class="form"><div class="field"><label>Nombre</label><input id="c_name" value="${c.name}"></div><div class="field"><label>Documento</label><input id="c_doc" value="${c.doc}"></div><div class="field"><label>Teléfono</label><input id="c_phone" value="${c.phone}"></div><div class="field"><label>Correo</label><input id="c_email" value="${c.email}"></div><div class="field"><label>Límite de crédito / fiado</label><input id="c_credit" type="number" min="0" value="${c.credit}"></div><div class="field"><label>Plazo para pagar (días)</label><input id="c_days" type="number" min="0" value="${c.creditDays??30}"></div><div class="field"><label>Permitir fiado</label><select id="c_enabled"><option value="1" ${c.creditEnabled!==false?'selected':''}>Sí</option><option value="0" ${c.creditEnabled===false?'selected':''}>No</option></select></div></div><button class="btn primary" style="margin-top:15px" onclick="saveClient('${id}')">Guardar cliente</button>`)}
function saveClient(id){let c=db.clients.find(x=>x.id===id);let d={name:v('c_name'),doc:v('c_doc'),phone:v('c_phone'),email:v('c_email'),credit:+v('c_credit'),creditDays:+v('c_days'),creditEnabled:v('c_enabled')==='1',balance:c?.balance||0};if(c)Object.assign(c,d);else{d.id=uid('c');db.clients.push(d)}save();closeModal();renderClients();toast('Cliente guardado')}
function deleteClient(id){let c=db.clients.find(x=>x.id===id);if(!c)return;if(c.id==='c1'||String(c.name||'').trim().toLowerCase()==='consumidor final')return toast('Consumidor final no se puede eliminar');if(!confirm('¿Estás seguro de eliminar este cliente?'))return;db.clients=db.clients.filter(x=>x.id!==id);if(posClient===id)posClient='c1';save();renderClients();toast('Cliente eliminado')}
function deleteCreditLine(id){let c=db.clients.find(x=>x.id===id);if(!c)return;let pending=Number(c.balance||0);let message=pending>0?'Este cliente tiene saldo pendiente de '+money(pending)+'. Al eliminar la línea también se eliminará el cliente y el saldo registrado. ¿Deseas continuar?':'¿Eliminar la línea de crédito correspondiente a este cliente?';if(!confirm(message))return;db.clients=db.clients.filter(x=>x.id!==id);if(posClient===id)posClient='c1';save();renderReceivables();toast('Línea de crédito eliminada')}
function renderReceivables(){let debtors=db.clients.filter(c=>c.balance>0);let total=debtors.reduce((a,c)=>a+c.balance,0);document.getElementById('receivables').innerHTML=pageHead('Fiados / Crédito','La libreta de fiados digital de VENTARA',`<button class="btn primary" onclick="openClientModal()">+ Nueva línea de crédito</button><button class="btn" onclick="exportCreditReport()">Exportar cartera</button>`)+`<div class="grid cols3"><div class="card kpi"><div class="label">Total fiado</div><div class="value">${money(total)}</div></div><div class="card kpi"><div class="label">Clientes con saldo</div><div class="value">${debtors.length}</div></div><div class="card kpi"><div class="label">Líneas habilitadas</div><div class="value">${db.clients.filter(c=>c.creditEnabled).length}</div></div></div><div class="card" style="margin-top:16px">${table(['Cliente','Límite','Saldo','Disponible','Plazo','Acción'],db.clients.filter(c=>c.creditEnabled||c.balance>0).map(c=>`<tr><td><b>${c.name}</b><br><small class="muted">${c.doc||''}</small></td><td>${money(c.credit)}</td><td>${money(c.balance)}</td><td>${money(Math.max(0,(c.credit||0)-(c.balance||0)))}</td><td>${c.creditDays??0} días</td><td><button class="btn sm" onclick="openPaymentModal('${c.id}')">Abonar</button> <button class="btn sm" onclick="openClientModal('${c.id}')">Editar</button> <button class="btn sm danger" onclick="deleteCreditLine('${c.id}')">Eliminar</button></td></tr>`).join(''),'No hay líneas de crédito configuradas')}</div>`}
function openPaymentModal(id=''){openModal(`<h2>Registrar abono</h2><div class="form"><div class="field"><label>Cliente</label><select id="pay_client">${db.clients.filter(c=>c.balance>0).map(c=>`<option value="${c.id}" ${c.id===id?'selected':''}>${c.name} · ${money(c.balance)}</option>`).join('')}</select></div><div class="field"><label>Valor</label><input id="pay_value" type="number" min="1"></div><div class="field"><label>Método</label><select id="pay_method"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></div></div><button class="btn primary" style="margin-top:15px" onclick="savePayment()">Registrar abono</button>`)}
function savePayment(){let c=db.clients.find(x=>x.id===v('pay_client')),n=Math.min(+v('pay_value'),c.balance);c.balance-=n;db.cash.balance+=n;db.payments.unshift({id:uid('pa'),date:today(),clientId:c.id,value:n,method:v('pay_method')});log('Abono de cartera',c.name);save();closeModal();renderReceivables();toast('Abono registrado')}
function renderQuotes(){document.getElementById('quotes').innerHTML=pageHead('Cotizaciones','Crea cotizaciones completas, compártelas y conviértelas en venta',`<button class="btn primary" onclick="openQuoteModal()">+ Cotización</button>`)+`<div class="card">${table(['Número','Fecha','Cliente','Total','Vigencia','Estado','Acción'],db.quotes.map(q=>`<tr><td><b>${q.number}</b></td><td>${q.date}</td><td>${clientName(q.clientId)}</td><td><b>${money(q.total)}</b></td><td>${q.validity||'—'}</td><td><span class="badge">${q.status}</span></td><td><button class="btn sm" onclick="viewQuote('${q.id}')">Ver</button> <button class="btn sm" onclick="printQuotePDF('${q.id}')">PDF</button> <button class="btn sm" onclick="quoteWhatsApp('${q.id}')">WhatsApp</button> <button class="btn sm" onclick="convertQuote('${q.id}')">Venta</button> <button class="btn sm danger" onclick="deleteQuote('${q.id}')">Eliminar</button></td></tr>`).join(''),'Aún no hay cotizaciones. Crea la primera para varios productos.')}</div>`}
let quoteDraftItems=[];
function openQuoteModal(){quoteDraftItems=[];openModal(`<h2>Nueva cotización</h2><p class="muted">Agrega todos los productos que el cliente solicitó. La cotización quedará guardada en la nube y podrás verla, imprimirla en PDF o compartirla por WhatsApp.</p><div class="form"><div class="field"><label>Cliente</label><select id="q_client">${db.clients.map(c=>`<option value="${c.id}">${c.name}${c.phone?' · '+c.phone:''}</option>`).join('')}</select></div><div class="field"><label>Vigencia hasta</label><input id="q_valid" type="date" value="${today()}"></div><div class="field" style="grid-column:1/-1"><label>Observaciones para el cliente</label><textarea id="q_notes" rows="2" placeholder="Ej.: Precios sujetos a disponibilidad. Tiempo de entrega 1 a 2 días."></textarea></div></div><div class="card" style="margin-top:15px;background:#f8fafc"><div class="form"><div class="field"><label>Producto</label><select id="q_prod">${db.products.filter(p=>p.active!==false).map(p=>`<option value="${p.id}">${p.name} · ${money(p.price)}</option>`).join('')}</select></div><div class="field"><label>Cantidad</label><input id="q_qty" type="number" min="0.01" step="0.01" value="1"></div><div class="field" style="align-self:end"><button class="btn primary" onclick="addQuoteItem()">+ Agregar producto</button></div></div><div id="quoteDraftItems" style="margin-top:12px"></div></div><div style="display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:15px"><b>Total: <span id="quoteDraftTotal">${money(0)}</span></b><button class="btn primary" onclick="saveQuote()">Guardar cotización</button></div>`);renderQuoteDraftItems()}
function addQuoteItem(){let p=db.products.find(x=>x.id===v('q_prod')),qty=Number(v('q_qty'));if(!p)return toast('Selecciona un producto');if(!qty||qty<=0)return toast('La cantidad debe ser mayor que cero');let existing=quoteDraftItems.find(i=>i.productId===p.id);if(existing)existing.qty+=qty;else quoteDraftItems.push({productId:p.id,name:p.name,qty,price:p.price,cost:p.cost,unit:p.unit||'UND'});renderQuoteDraftItems()}
function removeQuoteItem(index){quoteDraftItems.splice(index,1);renderQuoteDraftItems()}
function renderQuoteDraftItems(){let el=document.getElementById('quoteDraftItems');let total=quoteDraftItems.reduce((a,i)=>a+i.qty*i.price,0);if(el)el.innerHTML=table(['Producto','Cantidad','Precio unitario','Subtotal','Acción'],quoteDraftItems.map((i,n)=>`<tr><td><b>${i.name}</b><br><small class="muted">${i.unit||''}</small></td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td><td><button class="btn sm danger" onclick="removeQuoteItem(${n})">Quitar</button></td></tr>`).join(''),'Agrega los productos solicitados por el cliente');let t=document.getElementById('quoteDraftTotal');if(t)t.textContent=money(total)}
function saveQuote(){let clientId=v('q_client'),validity=v('q_valid'),notes=v('q_notes').trim();if(!clientId)return toast('Selecciona un cliente');if(!quoteDraftItems.length)return toast('Agrega al menos un producto');let total=quoteDraftItems.reduce((a,i)=>a+i.qty*i.price,0),number='Q-'+String(db.quotes.length+1).padStart(6,'0');let x={id:uid('q'),number,date:today(),clientId,validity,status:'Borrador',total,notes,items:structuredClone(quoteDraftItems)};db.quotes.unshift(x);save();closeModal();renderQuotes();toast('Cotización completa guardada')}
function quoteFor(id){return db.quotes.find(x=>x.id===id)}
function deleteQuote(id){let q=quoteFor(id);if(!q)return;if(q.status==='Convertida')return toast('No puedes eliminar una cotización convertida en venta');if(!confirm('¿Eliminar la cotización '+q.number+'? Esta acción no se puede deshacer.'))return;db.quotes=db.quotes.filter(x=>x.id!==id);save();renderQuotes();toast('Cotización eliminada')}
function quoteHtml(q){let c=db.clients.find(x=>x.id===q.clientId)||{name:'Consumidor final',doc:'',phone:'',email:''};return `<div class="quote-doc"><div class="quote-head"><div><img src="${db.settings.logo||VENTARA_LOGO}" class="quote-logo"><div><h1>${db.settings.business||'VENTARA POS'}</h1><div>${db.settings.legal||''}</div><div>NIT: ${db.settings.nit||''} · ${db.settings.city||''}</div><div>${db.settings.phone||''} · ${db.settings.email||''}</div></div></div><div class="quote-meta"><b>COTIZACIÓN</b><strong>${q.number}</strong><span>Fecha: ${q.date}</span><span>Vigencia: ${q.validity||'—'}</span></div></div><div class="quote-client"><b>Cliente</b><div>${c.name||'Consumidor final'}</div>${c.doc?`<div>Documento: ${c.doc}</div>`:''}${c.phone?`<div>Teléfono: ${c.phone}</div>`:''}${c.email?`<div>Correo: ${c.email}</div>`:''}</div><table class="quote-table"><thead><tr><th>Producto</th><th>Cant.</th><th>Valor unitario</th><th>Total</th></tr></thead><tbody>${(q.items||[]).map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">TOTAL COTIZADO</td><td>${money(q.total)}</td></tr></tfoot></table>${q.notes?`<div class="quote-notes"><b>Observaciones</b><p>${q.notes.split(String.fromCharCode(10)).join('<br>')}</p></div>`:''}<div class="quote-footer">Documento generado por VENTARA POS · Esta cotización no constituye una factura.</div></div>`}
function viewQuote(id){let q=quoteFor(id);if(!q)return;openModal(`<div>${quoteHtml(q)}<div class="actions" style="justify-content:flex-end;margin-top:15px"><button class="btn" onclick="copyQuoteText('${q.id}')">Copiar resumen</button><button class="btn" onclick="quoteWhatsApp('${q.id}')">WhatsApp</button><button class="btn primary" onclick="printQuotePDF('${q.id}')">Generar PDF</button></div></div>`)}
function quoteText(q){let c=db.clients.find(x=>x.id===q.clientId);let lines=['COTIZACIÓN '+q.number,db.settings.business||'VENTARA POS','Cliente: '+(c?.name||'Consumidor final'),'Fecha: '+q.date,'Vigencia: '+(q.validity||'—'),'',(q.items||[]).map(i=>'• '+i.name+' x '+i.qty+': '+money(i.qty*i.price)).join(String.fromCharCode(10)),'','TOTAL: '+money(q.total)];if(q.notes)lines.push('',q.notes);return lines.join(String.fromCharCode(10))}
function copyQuoteText(id){let q=quoteFor(id);if(!q)return;navigator.clipboard?.writeText(quoteText(q)).then(()=>toast('Resumen copiado')).catch(()=>toast('No fue posible copiar automáticamente'))}
function quoteWhatsApp(id){let q=quoteFor(id);if(!q)return;let c=db.clients.find(x=>x.id===q.clientId);let savedPhone=String(c?.phone||'').replace(/[^0-9]/g,'');if(savedPhone.length===10)savedPhone='57'+savedPhone;if(q.status==='Borrador'){q.status='Enviada';save();renderQuotes()}if(!savedPhone){openModal(`<h2>Enviar cotización por WhatsApp</h2><p class="muted">El cliente no tiene un teléfono registrado. Ingresa el número de WhatsApp para enviar esta cotización.</p><div class="field"><label>Número de WhatsApp</label><input id="quote_wa_phone" type="tel" inputmode="numeric" placeholder="3001234567" autofocus></div><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:15px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="sendQuoteWhatsAppFromModal('${q.id}')">Abrir WhatsApp</button></div>`);return}let w=window.open('https://wa.me/'+savedPhone+'?text='+encodeURIComponent(quoteText(q)),'_blank');if(!w)return toast('El navegador bloqueó WhatsApp. Permite ventanas emergentes para VENTARA POS');toast('Cotización preparada para WhatsApp')}
function sendQuoteWhatsAppFromModal(id){let q=quoteFor(id);if(!q)return;let phone=String(v('quote_wa_phone')||'').replace(/[^0-9]/g,'');if(phone.length===10)phone='57'+phone;if(phone.length<11)return toast('Ingresa un número de WhatsApp válido');let w=window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(quoteText(q)),'_blank');if(!w)return toast('El navegador bloqueó WhatsApp. Permite ventanas emergentes para VENTARA POS');closeModal();toast('Cotización preparada para WhatsApp')}
function printQuotePDF(id){let q=quoteFor(id);if(!q)return;let w=window.open('','_blank','width=1000,height=800');if(!w)return toast('El navegador bloqueó la ventana');w.document.write(`<html><head><title>${q.number} · Cotización</title><style>body{font-family:Arial,sans-serif;color:#172033;margin:0;padding:30px}.quote-doc{max-width:900px;margin:auto}.quote-head{display:flex;justify-content:space-between;gap:30px;border-bottom:3px solid #0ea5e9;padding-bottom:18px}.quote-head>div:first-child{display:flex;gap:14px;align-items:center}.quote-logo{width:170px;height:auto;object-fit:contain}.quote-head h1{margin:0 0 5px;font-size:24px}.quote-meta{text-align:right;display:flex;flex-direction:column;gap:4px}.quote-meta b{color:#0284c7;font-size:20px}.quote-meta strong{font-size:18px}.quote-client{margin:22px 0;padding:14px;background:#f1f5f9;border-radius:8px}.quote-table{width:100%;border-collapse:collapse}.quote-table th,.quote-table td{border-bottom:1px solid #dbe3ea;padding:10px;text-align:left}.quote-table th{background:#0f172a;color:white}.quote-table th:nth-child(n+2),.quote-table td:nth-child(n+2){text-align:right}.quote-table tfoot td{font-weight:700;font-size:16px;border-top:2px solid #0f172a}.quote-notes{margin-top:25px;padding:14px;border-left:4px solid #0ea5e9;background:#f8fafc}.quote-footer{margin-top:35px;padding-top:12px;border-top:1px solid #dbe3ea;color:#64748b;font-size:11px}@media print{@page{size:A4;margin:12mm}body{padding:0}.quote-doc{max-width:none}}</style></head><body>${quoteHtml(q)}</body></html>`);w.document.close();setTimeout(()=>w.print(),500)}
function convertQuote(id){let q=quoteFor(id);if(!q||q.status==='Convertida')return;posClient=q.clientId;cart=(q.items||[]).map(i=>({id:i.productId,qty:i.qty,price:i.price,cost:i.cost}));q.status='Convertida';save();showPage('pos');toast('Cotización cargada en POS')}
function renderCash(){document.getElementById('cash').innerHTML=pageHead('Caja','Apertura, movimientos, retiros y cierre de turno',db.cash.open?'<div class="actions"><button class="btn cash-danger" onclick="quickEmptyCash()">💵 Retirar efectivo</button><button class="btn danger" onclick="closeCash()">Cerrar caja</button></div>':'<button class="btn success" onclick="openCash()">Abrir caja</button>')+`<div class="grid cols3"><div class="card kpi"><div class="label">Estado</div><div class="value">${db.cash.open?'ABIERTA':'CERRADA'}</div></div><div class="card kpi"><div class="label">Saldo</div><div class="value">${money(db.cash.balance)}</div></div><div class="card kpi"><div class="label">Apertura</div><div class="value">${money(db.cash.opening)}</div></div></div><div class="card" style="margin-top:16px"><h3>Movimientos</h3>${table(['Fecha','Tipo','Detalle','Valor'],[...db.payments.map(x=>`<tr><td>${x.date}</td><td>Abono</td><td>${clientName(x.clientId)}</td><td>${money(x.value)}</td></tr>`),...db.expenses.map(x=>`<tr><td>${x.date}</td><td>Gasto</td><td>${x.concept}</td><td>-${money(x.value)}</td></tr>`),...db.sales.filter(x=>x.method!=='Crédito').slice(0,30).map(x=>`<tr><td>${x.date}</td><td>Venta</td><td>${x.number}</td><td>${money(x.total)}</td></tr>`)].join(''))}</div>`}
function openCash(){if(db.cash.open)return toast('La caja ya está abierta');let n=+prompt('Base de apertura de caja:','0');if(isNaN(n)||n<0)return;db.cash.open=true;db.cash.opening=n;db.cash.balance=n;db.cash.openedAt=new Date().toISOString();db.cash.movements=db.cash.movements||[];db.cash.movements.unshift({type:'Apertura',value:n,date:new Date().toISOString()});log('Apertura de caja','Base: '+money(n));save();renderCash();document.getElementById('cashState').textContent='Caja abierta';toast('Caja abierta')}
function quickEmptyCash(){if(!db.cash.open)return toast('Abre la caja primero');let max=Math.max(0,db.cash.balance);let n=+prompt('Valor a retirar de caja:',String(max));if(isNaN(n)||n<=0)return;if(n>max)return toast('El retiro supera el saldo de caja');let reason=prompt('Motivo del retiro:','Retiro de efectivo');db.cash.balance-=n;db.cash.movements=db.cash.movements||[];db.cash.movements.unshift({type:'Retiro',value:n,reason:reason||'Retiro de efectivo',date:new Date().toISOString()});log('Retiro de caja',money(n)+' · '+(reason||'Retiro de efectivo'));save();renderCash();toast('Retiro registrado · saldo '+money(db.cash.balance))}
function closeCash(){if(!db.cash.open)return toast('La caja ya está cerrada');let n=db.cash.balance;if(!confirm('¿Cerrar caja con saldo '+money(n)+'?'))return;db.cash.closures=db.cash.closures||[];db.cash.closures.unshift({date:new Date().toISOString(),opening:db.cash.opening,balance:n});db.cash.open=false;db.cash.balance=0;log('Cierre de caja','Saldo contado: '+money(n));save();renderCash();document.getElementById('cashState').textContent='Caja cerrada';toast('Caja cerrada correctamente')}
function renderExpenses(){document.getElementById('expenses').innerHTML=pageHead('Gastos','Egresos que afectan caja y reportes',`<button class="btn primary" onclick="openExpenseModal()">+ Registrar gasto</button>`)+`<div class="card">${table(['Fecha','Concepto','Categoría','Valor','Método','Usuario'],db.expenses.map(x=>`<tr><td>${x.date}</td><td>${x.concept}</td><td>${x.category}</td><td>${money(x.value)}</td><td>${x.method}</td><td>Administrador</td></tr>`).join(''))}</div>`}
function openExpenseModal(){openModal(`<h2>Registrar gasto</h2><div class="form"><div class="field"><label>Concepto</label><input id="e_concept"></div><div class="field"><label>Categoría</label><input id="e_cat" value="Operación"></div><div class="field"><label>Valor</label><input id="e_value" type="number"></div><div class="field"><label>Forma de pago</label><select id="e_method"><option>Efectivo</option><option>Transferencia</option></select></div><div class="field full"><label>Observación</label><textarea id="e_obs"></textarea></div></div><button class="btn primary" style="margin-top:15px" onclick="saveExpense()">Guardar gasto</button>`)}
function saveExpense(){let x={id:uid('e'),date:today(),concept:v('e_concept'),category:v('e_cat'),value:+v('e_value'),method:v('e_method'),obs:v('e_obs')};db.expenses.unshift(x);if(x.method==='Efectivo')db.cash.balance-=x.value;log('Gasto registrado',x.concept);save();closeModal();renderExpenses();toast('Gasto registrado')}
function renderReports(){let s=stats(),sales=scopedSales().filter(x=>x.status!=='Anulado'),d=today(),todaySales=sales.filter(x=>x.date===d),byPay={};sales.forEach(x=>byPay[x.method]=(byPay[x.method]||0)+x.total);let boxes={};sales.forEach(x=>{let k=x.cashier||'Administrador';boxes[k]=(boxes[k]||0)+x.total});let top={};sales.flatMap(x=>x.items).forEach(i=>top[i.name]=(top[i.name]||0)+i.qty);document.getElementById('reports').innerHTML=pageHead('Reportes','Ventas, inventarios, caja, cartera y resultados',`<button class="btn primary" onclick="exportReportExcel('dailySales')">Excel · Ventas diarias</button><button class="btn" onclick="printReportPDF('dailySales')">PDF · Ventas diarias</button>`)+`<div class="report-grid"><div class="card"><h3>Ventas diarias</h3><p class="muted">${d}</p><h2>${money(todaySales.reduce((a,x)=>a+x.total,0))}</h2><button class="btn sm" onclick="exportReportExcel('dailySales')">Exportar Excel</button> <button class="btn sm" onclick="printReportPDF('dailySales')">Generar PDF</button></div><div class="card"><h3>Inventario</h3><p class="muted">Existencias, costo y valoración</p><h2>${db.products.length} artículos</h2><button class="btn sm" onclick="exportReportExcel('inventory')">Exportar Excel</button> <button class="btn sm" onclick="printReportPDF('inventory')">Generar PDF</button></div><div class="card"><h3>Resultados por caja / cajero</h3>${Object.entries(boxes).map(([k,v])=>`<p><b>${k}</b> · ${money(v)}</p>`).join('')||'<p class="muted">Sin movimientos</p>'}<button class="btn sm" onclick="exportReportExcel('cash')">Exportar Excel</button> <button class="btn sm" onclick="printReportPDF('cash')">Generar PDF</button></div><div class="card"><h3>Cartera / fiados</h3><h2>${money(s.receivable)}</h2><p class="muted">Saldos pendientes por cliente</p><button class="btn sm" onclick="exportReportExcel('credit')">Exportar Excel</button> <button class="btn sm" onclick="printReportPDF('credit')">Generar PDF</button></div><div class="card"><h3>Compras y gastos</h3><p>Compras: ${money(db.purchases.reduce((a,x)=>a+(x.total||0),0))}</p><p>Gastos: ${money(db.expenses.reduce((a,x)=>a+x.value,0))}</p><button class="btn sm" onclick="exportReportExcel('expenses')">Exportar Excel</button> <button class="btn sm" onclick="printReportPDF('expenses')">Generar PDF</button></div><div class="card"><h3>Kardex</h3><p class="muted">Movimientos de inventario</p><button class="btn sm" onclick="exportReportExcel('kardex')">Exportar Excel</button> <button class="btn sm" onclick="printReportPDF('kardex')">Generar PDF</button></div></div><div class="card" style="margin-top:16px"><h3>Resumen de medios de pago</h3>${Object.entries(byPay).map(([k,v])=>`<p><b>${k}</b> · ${money(v)}</p>`).join('')||'<div class="empty">Sin ventas</div>'}</div><div class="card" style="margin-top:16px"><h3>Productos más vendidos</h3>${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<p><b>${k}</b> · ${v}</p>`).join('')||'<div class="empty">Sin ventas</div>'}</div>`}
function reportData(type){if(type==='dailySales')return scopedSales().filter(x=>x.date===today()).map(x=>({Número:x.number,Fecha:x.date,Hora:x.time,Cliente:clientName(x.clientId),Total:x.total,Método:x.method,Estado:x.status}));if(type==='inventory')return db.products.map(p=>({Código:p.code,Producto:p.name,Categoría:p.category,Presentación:p.presentation,Contenido:p.content+' '+p.contentUnit,Unidad:p.unit,Precio:p.price,Costo:p.cost,Stock:p.stock,Mínimo:p.min,ValorInventario:p.stock*p.cost}));if(type==='cash')return scopedSales().filter(x=>x.status!=='Anulado').map(x=>({Fecha:x.date,Hora:x.time,Número:x.number,Cajero:x.cashier||'Administrador',Método:x.method,Total:x.total}));if(type==='credit')return db.clients.filter(c=>c.balance>0).map(c=>({Cliente:c.name,Documento:c.doc,Límite:c.credit,Saldo:c.balance,Disponible:Math.max(0,(c.credit||0)-c.balance),PlazoDías:c.creditDays||0,PróximoPago:c.nextPaymentDate||''}));if(type==='expenses')return db.expenses.map(x=>({Fecha:x.date,Concepto:x.concept,Categoría:x.category,Valor:x.value,Método:x.method}));if(type==='kardex')return db.kardex.map(x=>({Fecha:x.date,Tipo:x.type,Referencia:x.ref,Producto:db.products.find(p=>p.id===x.productId)?.name||'',Cantidad:x.qty,Saldo:x.balance,Costo:x.cost}));return db.sales}
function exportReportExcel(type){let rows=reportData(type);let keys=[...new Set(rows.flatMap(x=>Object.keys(x)))];let html=`<html><head><meta charset="utf-8"></head><body><table><tr>${keys.map(k=>`<th>${k}</th>`).join('')}</tr>${rows.map(r=>`<tr>${keys.map(k=>`<td>${String(r[k]??'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}</td>`).join('')}</tr>`).join('')}</table></body></html>`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'application/vnd.ms-excel'}));a.download='ventara-'+type+'-'+today()+'.xls';a.click();toast('Archivo Excel generado')}
function printReportPDF(type){let rows=reportData(type),title={dailySales:'Ventas diarias',inventory:'Inventario',cash:'Resultados por caja / cajero',credit:'Cartera / fiados',expenses:'Compras y gastos',kardex:'Kardex'}[type]||'Reporte';let keys=[...new Set(rows.flatMap(x=>Object.keys(x)))];let w=window.open('','_blank','width=1000,height=800');if(!w)return toast('El navegador bloqueó la ventana');w.document.write(`<html><head><title>${title}</title><style>body{font-family:Arial;padding:25px}h1{margin-bottom:5px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #ddd;padding:6px;text-align:left}th{background:#f2f2f2}@media print{@page{size:A4;margin:12mm}}</style></head><body><h1>${db.settings.business} · ${title}</h1><p>Fecha: ${today()} · VENTARA POS</p><table><thead><tr>${keys.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${String(r[k]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function exportCreditReport(){exportReportExcel('credit')}

function renderUsers(){document.getElementById('users').innerHTML=pageHead('Usuarios y roles','Roles definidos y permisos por módulo',`<button class="btn primary" onclick="openUserModal()">+ Usuario</button>`)+`<div class="grid cols2"><div class="card"><h3>Roles del sistema</h3>${Object.entries(ROLE_PERMISSIONS).map(([r,p])=>`<div style="padding:12px 0;border-bottom:1px solid var(--border)"><b>${r}</b><p class="muted" style="margin:5px 0">${p.length} módulos autorizados</p><small>${p.map(x=>x==='pos'?'Facturar':x).join(' · ')}</small></div>`).join('')}</div><div class="card"><h3>Usuarios</h3>${table(['Usuario','Rol','Estado','Permisos'],db.users.map(u=>`<tr><td>${u.name}</td><td><span class="badge">${u.role}</span></td><td>${u.active?'Activo':'Inactivo'}</td><td>${(ROLE_PERMISSIONS[u.role]||[]).length} módulos</td></tr>`).join(''))}</div></div>`}
function openUserModal(){if(currentUser?.role!=='Administrador')return toast('Solo un Administrador puede crear usuarios');openModal(`<h2>Nuevo usuario</h2><div class="form"><div class="field"><label>Nombre</label><input id="u_name" autocomplete="name"></div><div class="field"><label>Usuario de acceso</label><input id="u_username" autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="u_password" type="password" autocomplete="new-password"></div><div class="field"><label>Confirmar contraseña</label><input id="u_password2" type="password" autocomplete="new-password"></div><div class="field"><label>Rol</label><select id="u_role">${Object.keys(ROLE_PERMISSIONS).map(r=>`<option>${r}</option>`).join('')}</select></div><div class="field"><label>Activo</label><select id="u_active"><option value="1">Sí</option><option value="0">No</option></select></div></div><p class="muted">El usuario ingresará a VENTARA con este usuario y contraseña. La contraseña real la administra Supabase Auth; nunca se guarda en la base de datos de VENTARA.</p><h3 style="margin-top:16px">Permisos incluidos por rol</h3><div class="role-grid" id="rolePerms"></div><button class="btn primary" style="margin-top:15px" onclick="saveUser()">Guardar usuario</button>`);updateRolePerms()}
function updateRolePerms(){let role=v('u_role')||'Cajero';let el=document.getElementById('rolePerms');if(el)el.innerHTML=(ROLE_PERMISSIONS[role]||[]).map(x=>`<label class="perm"><input type="checkbox" checked disabled> ${x==='pos'?'Facturar':x}</label>`).join('');document.getElementById('u_role')?.addEventListener('change',updateRolePerms)}
async function saveUser(){let role=v('u_role'),name=v('u_name').trim(),username=v('u_username').trim().toLowerCase(),password=v('u_password'),password2=v('u_password2'),active=v('u_active')==='1';if(!name)return toast('Escribe el nombre');if(!/^[a-z0-9._-]{3,30}$/.test(username))return toast('Usuario inválido');if(password.length<6)return toast('La contraseña debe tener mínimo 6 caracteres');if(password!==password2)return toast('Las contraseñas no coinciden');try{const {data,error}=await supabaseClient.functions.invoke('create-ventara-user',{body:{username,fullName:name,password,role,active}});if(error)throw error;if(data?.error)throw new Error(data.error);db.users.push({id:data.userId,name,username,role,active,permissions:ROLE_PERMISSIONS[role]||[]});save();closeModal();renderUsers();toast('Usuario creado correctamente en la nube')}catch(e){console.error(e);toast(e.message||'No se pudo crear el usuario')}}
function renderOrders(){document.getElementById('orders').innerHTML=pageHead('Pedidos','Flujo preparado para WhatsApp, catálogo, e-commerce y pedidos externos',`<button class="btn primary" onclick="openOrderModal()">+ Pedido</button>`)+`<div class="card">${table(['Número','Fecha','Cliente','Total','Estado','Acción'],db.orders.map(o=>`<tr><td>${o.number}</td><td>${o.date}</td><td>${clientName(o.clientId)}</td><td>${money(o.total)}</td><td>${o.status}</td><td><select onchange="setOrderStatus('${o.id}',this.value)">${['Nuevo','Confirmado','Preparando','Listo','Enviado','Entregado','Cancelado'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join(''))}</div>`}
function openOrderModal(){openModal(`<h2>Nuevo pedido</h2><div class="form"><div class="field"><label>Cliente</label><select id="o_client">${db.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div class="field"><label>Producto</label><select id="o_prod">${db.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div class="field"><label>Cantidad</label><input id="o_qty" type="number" value="1"></div></div><button class="btn primary" style="margin-top:15px" onclick="saveOrder()">Crear pedido</button>`)}
function saveOrder(){let p=db.products.find(x=>x.id===v('o_prod')),q=+v('o_qty');db.orders.unshift({id:uid('o'),number:'O-'+String(db.orders.length+1).padStart(6,'0'),date:today(),clientId:v('o_client'),total:p.price*q,status:'Nuevo',items:[{productId:p.id,qty:q,price:p.price}]});save();closeModal();renderOrders();toast('Pedido creado')}
