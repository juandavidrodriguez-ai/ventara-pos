name: Apply quotation updates

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quotations:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update quotation module
        run: |
          python tools/patch_quotes.py
          python tools/fix_quote_js.py

      - name: Validate quotation JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'function quoteDraftItems' not in html
          assert 'function addQuoteItem()' in html
          assert 'function printQuotePDF(id)' in html
          assert 'replaceAll(String.fromCharCode(10),\'<br>\')' in html
          assert '.replace(/[^0-9]/g,\'\')' in html
          print('Quotation JavaScript checks passed')
          PY

      - name: Commit quotation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete multi-product quotations with PDF and WhatsApp [skip ci]"
          git push
