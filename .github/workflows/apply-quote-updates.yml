name: Apply quotation updates

# Keeps the quotation module synchronized with the production frontend.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quotations:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace quotation module
        run: python tools/replace_quote_module.py

      - name: Apply quotation preview styles
        run: python tools/add_quote_styles.py

      - name: Validate quotation JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'function addQuoteItem()',
              'function renderQuoteDraftItems()',
              'function saveQuote()',
              'function viewQuote(id)',
              'function printQuotePDF(id)',
              'function quoteWhatsApp(id)',
              'function convertQuote(id)',
              "q.notes.split(String.fromCharCode(10)).join('<br>')",
              ".replace(/[^0-9]/g,'')",
              'ventara-quote-styles',
          ]
          for item in required:
              assert item in html, item
          assert 'q.notes.replace(/' not in html
          scripts = re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          Path('/tmp/ventara-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('Quotation checks passed; inline scripts:', len(scripts))
          PY
          node --check /tmp/ventara-inline.js

      - name: Commit quotation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete multi-product quotations with PDF and WhatsApp [skip ci]"
          git push
