name: Apply quotation updates

# Keeps the quotation module synchronized with the production frontend.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quotations:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace quotation module
        run: python tools/replace_quote_module.py

      - name: Repair quotation JavaScript and WhatsApp
        run: python tools/fix_quote_js.py && python tools/fix_quote_whatsapp.py

      - name: Apply quotation preview styles
        run: python tools/add_quote_styles.py

      - name: Add flexible IVA selector and tax logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = '</body>'
          if 'ventara-iva-module' in html:
              raise SystemExit('IVA module already present')
          js = r'''<script id="ventara-iva-module">
          (()=>{
            const rates=[0,1,2,4,5,8,10,12,15,16,18,19,20,21,22,25,30,35];
            const pct=n=>Number(n||0);
            window.ventaraIvaRates=rates;
            window.ventaraPriceWithIva=(price,iva)=>Math.round(Number(price||0)*(1+pct(iva)/100)*100)/100;
            window.ventaraIvaAmount=(price,iva)=>Math.round(Number(price||0)*pct(iva)/100*100)/100;
            function modal(){return document.querySelector('.modal, .modal-content, [role="dialog"]')}
            function isProductModal(m){let t=(m?.innerText||'').toLowerCase();return t.includes('precio de venta')||t.includes('precio de costo')||t.includes('crear producto')||t.includes('editar producto')||t.includes('nuevo artículo')||t.includes('nuevo articulo')}
            function findPriceInput(m){let inputs=[...m.querySelectorAll('input')];return inputs.find(i=>/precio.*venta|venta/i.test((i.parentElement?.innerText||'')+' '+(i.previousElementSibling?.innerText||'')))||inputs.find(i=>/price/i.test(i.id||i.name||''))||null}
            function addField(m){if(!isProductModal(m)||m.querySelector('#ventaraProductIva'))return;let price=findPriceInput(m);let field=document.createElement('div');field.className='field';field.style.cssText='margin-top:10px';field.innerHTML='<label>IVA</label><select id="ventaraProductIva">'+rates.map(function(r){return '<option value="'+r+'">'+r+'%</option>'}).join('')+'<option value="custom">Personalizado</option></select><small class="muted">Selecciona el IVA que corresponde al producto.</small><div id="ventaraIvaPreview" class="muted" style="margin-top:6px"></div>';let host=price?.closest('.field')?.parentElement||m.querySelector('.form')||m;host.appendChild(field);let sel=field.querySelector('#ventaraProductIva');let prev=field.querySelector('#ventaraIvaPreview');let update=function(){let iva=sel.value==='custom'?0:Number(sel.value);if(sel.value==='custom'){prev.innerHTML='<input id="ventaraCustomIva" type="number" min="0" max="100" step="0.01" placeholder="% IVA personalizado">';let ci=prev.querySelector('#ventaraCustomIva');if(ci)ci.oninput=update;iva=Number(ci?.value||0)}let base=Number(price?.value||0);prev.textContent=base?'Precio final con IVA: '+new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:2}).format(window.ventaraPriceWithIva(base,iva)):''};sel.onchange=update;if(price)price.addEventListener('input',update);update();
              let existingIva=window.__ventaraEditingIva;if(existingIva!=null){let n=Number(existingIva);if(rates.includes(n))sel.value=String(n);else{sel.value='custom';setTimeout(function(){let ci=prev.querySelector('#ventaraCustomIva');if(ci)ci.value=n;update()},0)}update()}
              window.__ventaraCurrentIva=function(){return sel.value==='custom'?Number(prev.querySelector('#ventaraCustomIva')?.value||0):Number(sel.value||0)};
            }
            function saveIvaAfterAction(){let iva=Number(window.__ventaraCurrentIva?.()||0);let m=modal();if(!m||!isProductModal(m))return;let inputs=[...m.querySelectorAll('input')];let name=inputs.find(i=>/name|nombre/i.test(i.id||i.name||''))?.value?.trim();setTimeout(function(){if(!window.db?.products)return;let p=name?db.products.find(x=>x.name===name):null;if(p){p.iva=iva;p.taxRate=iva;p.priceWithIva=window.ventaraPriceWithIva(p.price,iva);if(typeof save==='function')save()}},300)}
            document.addEventListener('click',function(e){let b=e.target.closest('button');if(!b)return;let txt=(b.innerText||'').toLowerCase();if(/guardar|actualizar|crear|save/.test(txt)&&isProductModal(modal()))saveIvaAfterAction()},true);
            new MutationObserver(function(){let m=modal();if(m)addField(m)}).observe(document.documentElement,{subtree:true,childList:true});
            setInterval(function(){let m=modal();if(m)addField(m)},700);
            function normalizeCart(){if(!window.db?.products||!Array.isArray(window.cart))return;window.cart.forEach(function(i){let p=db.products.find(function(x){return x.id===i.id});if(p&&p.iva!=null&&!i.__ventaraIvaApplied){i.basePrice=i.price;i.price=window.ventaraPriceWithIva(p.price,p.iva);i.iva=p.iva;i.__ventaraIvaApplied=true}})}
            setInterval(normalizeCart,700);
          })();
          </script>'''
          html=html.replace(marker,js+'\n'+marker,1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Validate quotation and IVA JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'function addQuoteItem()', 'function renderQuoteDraftItems()',
              'function saveQuote()', 'function viewQuote(id)',
              'function printQuotePDF(id)', 'function quoteWhatsApp(id)',
              'function sendQuoteWhatsAppFromModal(id)', 'function convertQuote(id)',
              'ventara-quote-styles', 'ventara-iva-module',
              'ventaraPriceWithIva', 'ventaraIvaAmount',
          ]
          for item in required: assert item in html, item
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',html,flags=re.I|re.S)
          Path('/tmp/ventara-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/ventara-inline.js

      - name: Commit quotation and IVA changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add product IVA selector and automatic tax pricing [skip ci]"
          git push
