name: Apply quotation updates

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quotations:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update quotation module
        run: python tools/patch_quotes.py

      - name: Commit quotation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete multi-product quotations with PDF and WhatsApp [skip ci]"
          git push
