name: Apply quotation updates

on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  quotations:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace quotation module
        run: python tools/replace_quote_module.py
      - name: Repair quotation JavaScript and WhatsApp
        run: python tools/fix_quote_js.py && python tools/fix_quote_whatsapp.py
      - name: Apply quotation preview styles
        run: python tools/add_quote_styles.py
      - name: Fix IVA module placement
        run: python tools/fix_iva_module_placement.py
      - name: Validate all inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          required=['function addQuoteItem()','function renderQuoteDraftItems()','function saveQuote()','function viewQuote(id)','function printQuotePDF(id)','function quoteWhatsApp(id)','function sendQuoteWhatsAppFromModal(id)','function convertQuote(id)','ventara-quote-styles','ventara-iva-module','ventaraPriceWithIva']
          for x in required: assert x in html, x
          assert html.count('<script id="ventara-iva-module">') == 1
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',html,flags=re.I|re.S)
          Path('/tmp/ventara-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/ventara-inline.js
      - name: Commit repaired frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore frontend script execution after IVA update [skip ci]"
          git push
