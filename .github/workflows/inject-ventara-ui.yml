name: Inject Ventara UI enhancements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject enhancement script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="ventara-ui-enhancements.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('No se encontró </body> en index.html')
              text = text.replace(marker, tag + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
              print('Injected')
          else:
              print('Already injected')
          PY
      - name: Commit if changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: load Ventara UI enhancements [skip ci]'
          git push
