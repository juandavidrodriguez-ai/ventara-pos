name: Surgical Orders Product Selector Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch orders data bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ventara-orders-evolution.js')
          s = p.read_text(encoding='utf-8')
          old_db = "const db=()=>window.db&&typeof window.db==='object'?window.db:null;"
          new_db = "const DB_KEY='ventara_pos_v1';const db=()=>{if(window.db&&typeof window.db==='object')return window.db;try{const raw=localStorage.getItem(DB_KEY);return raw?JSON.parse(raw):null}catch{return null}};"
          old_save = "const save=async()=>{try{if(typeof window.save==='function')window.save()}catch{}try{if(typeof window.cloudSave==='function')await window.cloudSave()}catch{}};"
          new_save = "const save=async()=>{if(window.db&&typeof window.db==='object'){try{if(typeof window.save==='function')window.save()}catch{}try{if(typeof window.cloudSave==='function')await window.cloudSave()}catch{}return}try{const d=db();if(d)localStorage.setItem(DB_KEY,JSON.stringify(d))}catch{}};"
          if s.count(old_db) != 1:
              raise SystemExit('orders db anchor not found exactly once')
          if s.count(old_save) != 1:
              raise SystemExit('orders save anchor not found exactly once')
          s = s.replace(old_db, new_db, 1).replace(old_save, new_save, 1)
          p.write_text(s, encoding='utf-8')
          print('Surgical orders data bridge patched')
          PY

      - name: Validate JavaScript syntax
        run: node --check ventara-orders-evolution.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ventara-orders-evolution.js
          git diff --cached --check
          git diff --cached -- ventara-orders-evolution.js
          git commit -m "fix(orders): load products from active Ventara state"
          git push origin main
