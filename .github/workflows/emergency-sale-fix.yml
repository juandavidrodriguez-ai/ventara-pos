name: Emergency sale flow repair
on:
  push:
    paths:
      - '.github/workflows/emergency-sale-fix.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair sale confirmation safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('function confirmPayment(')
          end = s.index('function offerTicket(', start)
          new = """function confirmPayment(total,e){if(e){e.preventDefault();e.stopPropagation()}try{if(!cart.length)return toast('Agrega productos a la venta');if(selectedPay==='Efectivo'){let r=+(document.getElementById('cashReceived')?.value||0);if(r<total)return toast('El efectivo recibido es menor al total')}if(selectedPay==='Mixto'){let a=+(document.getElementById('mixCash')?.value||0),b=+(document.getElementById('mixOther')?.value||0);if(a+b!==total)return toast('El pago mixto debe ser exactamente igual al total')}let sale=finishSale(selectedPay,total);if(!sale)return;offerTicket(sale.id)}catch(error){console.error('Error al procesar la venta:',error);alert('Ocurrió un error al registrar la venta: '+(error?.message||String(error)))}}\nfunction finishSale(methodOverride,totalOverride){if(!cart.length)return null;let client=db.clients.find(c=>c.id===posClient)||db.clients[0];if(!client)return null;let discount=+(document.getElementById('posDiscount')?.value||0);let subtotal=cart.reduce((a,i)=>a+i.qty*i.price,0),total=totalOverride??Math.max(0,subtotal-discount),method=methodOverride||document.getElementById('payMethod')?.value||'Efectivo';if(method==='Crédito'){if(client.id==='c1'){toast('Selecciona un cliente para vender a crédito');return null}if(client.creditEnabled===false){toast('Este cliente no tiene el fiado habilitado');return null}if((client.balance||0)+total>(client.credit||0)){toast('La venta supera el límite de crédito disponible');return null}client.balance=(client.balance||0)+total;client.lastCreditDate=today();client.nextPaymentDate=new Date(Date.now()+((client.creditDays||30)*86400000)).toISOString().slice(0,10)}cart.forEach(i=>{let p=db.products.find(x=>x.id===i.id);if(!p)throw new Error('Producto no encontrado: '+i.id);if(i.qty>p.stock)throw new Error('Stock insuficiente para '+p.name);p.stock-=i.qty;db.kardex.unshift({id:uid('k'),date:today(),type:'Venta',ref:'',productId:p.id,qty:-i.qty,balance:p.stock,cost:p.cost})});let sale={cashier:currentUser?.name||'Administrador',cashierId:currentUser?.id||'',userId:currentUser?.id||'',cashId:userCashId(),id:uid('v'),number:'V-'+String(db.sales.length+1).padStart(6,'0'),date:today(),time:new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}),clientId:client.id,total,discount,method,status:method==='Crédito'?'Crédito':'Pagada',items:cart.map(i=>{let p=db.products.find(x=>x.id===i.id);return {...i,name:p.name}})};db.sales.unshift(sale);if(method!=='Crédito')db.cash.balance+=total;if(typeof log==='function')log('Venta registrada',sale.number);save();cart=[];closeModal();renderPOS();toast('FACTURA registrada · '+sale.number);return sale}\n"""
          s = s[:start] + new + s[end:]
          s = s.replace('onclick=\"confirmPayment(${total})\"','onclick=\"confirmPayment(${total},event)\"',1)
          s = s.replace("onkeydown=\"if(event.key==='Enter')confirmPayment(${total})\"","onkeydown=\"if(event.key==='Enter')confirmPayment(${total},event)\"",1)
          p.write_text(s, encoding='utf-8')
      - name: Validate JavaScript blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/scripts-check.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/scripts-check.js
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: emergency safe sale confirmation flow'
          git push origin HEAD:main
