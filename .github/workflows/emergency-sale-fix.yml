name: Emergency sale flow repair
on:
  push:
    paths:
      - '.github/workflows/emergency-sale-fix.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply surgical credit payment selector
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          start = s.index('function openPaymentModalPOS(){')
          end = s.index('let selectedPay=', start)
          new_open = r'''function openPaymentModalPOS(){if(!cart.length)return toast('Agrega productos a la venta');let subtotal=cart.reduce((a,i)=>a+i.qty*i.price,0),discount=+(document.getElementById('posDiscount')?.value||0),total=Math.max(0,subtotal-discount);let clients=(db.clients||[]).filter(c=>String(c.name||'').trim().toLowerCase()!=='consumidor final'&&c.id!=='c1');openModal(`<h2>💰 Cobrar VENTA</h2><p class="muted">Caja registradora · Total a cobrar</p><div style="text-align:center;background:#f4fbfd;padding:15px;border-radius:12px"><div class="muted">TOTAL</div><div style="font-size:38px;font-weight:900;color:#005f73">${money(total)}</div></div><h3>Forma de pago</h3><div class="payment-grid"><button id="pm-Efectivo" class="selected" onclick="selectPay('Efectivo')">💵 Efectivo</button><button id="pm-Tarjeta" onclick="selectPay('Tarjeta')">💳 Tarjeta</button><button id="pm-Transferencia" onclick="selectPay('Transferencia')">📲 Transferencia</button><button id="pm-Mixto" onclick="selectPay('Mixto')">🔀 Mixto</button><button id="pm-Crédito" onclick="selectPay('Crédito')">🧾 Crédito</button></div><div id="cashFields" style="margin-top:15px"><div class="field"><label>EFECTIVO RECIBIDO</label><input id="cashReceived" type="number" min="0" value="${total}" oninput="calcChange(${total})" onkeydown="if(event.key==='Enter')confirmPayment(${total},event)"></div><div class="totalline" style="font-size:18px;margin-top:10px"><span>Cambio</span><b id="cashChange">${money(0)}</b></div></div><div id="cardFields" style="display:none;margin-top:15px"><div class="field"><label>TIPO DE TARJETA</label><select id="cardType" required><option value="">-- Selecciona --</option><option value="Débito">Débito</option><option value="Crédito Visa">Crédito Visa</option><option value="Crédito Mastercard">Crédito Mastercard</option><option value="Otra">Otra</option></select></div></div><div id="transferFields" style="display:none;margin-top:15px"><div class="field"><label>BANCO / BILLETERA</label><select id="transferBank" required><option value="">-- Selecciona --</option><option value="Nequi">Nequi</option><option value="Daviplata">Daviplata</option><option value="Bancolombia">Bancolombia</option><option value="Otros">Otros</option></select></div></div><div id="creditFields" style="display:none;margin-top:15px"><div class="field"><label>CLIENTE PARA VENTA A CRÉDITO</label><select id="creditClientSelect"><option value="">-- Selecciona un cliente --</option>${clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><p id="creditWarning" class="muted" style="color:#9f1239">Selecciona un cliente para vender a crédito</p></div><div id="mixedFields" style="display:none;margin-top:15px"><div class="form"><div class="field"><label>Efectivo</label><input id="mixCash" type="number" value="0" oninput="calcMixed(${total})"></div><div class="field"><label>Tarjeta/Transferencia</label><input id="mixOther" type="number" value="${total}" oninput="calcMixed(${total})"></div></div><p id="mixStatus" class="muted"></p></div><div class="actions" style="margin-top:18px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn success" style="padding:13px 22px" onclick="confirmPayment(${total},event)">✓ CONFIRMAR Y REGISTRAR VENTA</button></div>`)}
'''
          s = s[:start] + new_open + s[end:]

          old_select = "let selectedPay='Efectivo';function selectPay(method){selectedPay=method;document.querySelectorAll('.payment-grid button').forEach(b=>b.classList.remove('selected'));document.getElementById('pm-'+method)?.classList.add('selected');document.getElementById('cashFields').style.display=method==='Efectivo'?'block':'none';document.getElementById('mixedFields').style.display=method==='Mixto'?'block':'none'}"
          new_select = "let selectedPay='Efectivo';function selectPay(method){selectedPay=method;document.querySelectorAll('.payment-grid button').forEach(b=>b.classList.remove('selected'));let active=document.getElementById('pm-'+method);if(active)active.classList.add('selected');let panels={Efectivo:'cashFields',Tarjeta:'cardFields',Transferencia:'transferFields',Mixto:'mixedFields','Crédito':'creditFields'};Object.values(panels).forEach(id=>{let el=document.getElementById(id);if(el)el.style.display='none'});let panel=document.getElementById(panels[method]);if(panel)panel.style.display='block';let cash=document.getElementById('cashFields');if(cash)cash.style.display=method==='Efectivo'?'block':'none';let mixed=document.getElementById('mixedFields');if(mixed)mixed.style.display=method==='Mixto'?'block':'none';if(method==='Crédito'){let warning=document.getElementById('creditWarning');if(warning)warning.style.display='block'}})"
          if old_select not in s:
              raise SystemExit('selectPay target not found')
          s = s.replace(old_select, new_select, 1)

          start = s.index('function confirmPayment(')
          end = s.index('function finishSale(', start)
          new_confirm = r'''function confirmPayment(total,e){if(e){e.preventDefault();e.stopPropagation()}try{if(!cart.length)return toast('Agrega productos a la venta');if(selectedPay==='Efectivo'){let r=+(document.getElementById('cashReceived')?.value||0);if(r<total)return toast('El efectivo recibido es menor al total')}if(selectedPay==='Mixto'){let a=+(document.getElementById('mixCash')?.value||0),b=+(document.getElementById('mixOther')?.value||0);if(a+b!==total)return toast('El pago mixto debe ser exactamente igual al total')}if(selectedPay==='Crédito'){let creditSelect=document.getElementById('creditClientSelect');if(!creditSelect||!creditSelect.value)return alert('Selecciona un cliente para vender a crédito');posClient=creditSelect.value}let sale=finishSale(selectedPay,total);if(!sale)return;offerTicket(sale.id)}catch(error){console.error('Error al procesar la venta:',error);alert('Ocurrió un error al registrar la venta: '+(error?.message||String(error)))}}
'''
          s = s[:start] + new_confirm + s[end:]

          p.write_text(s, encoding='utf-8')

      - name: Replace Pedidos directly in index.html
        shell: bash
        run: |
          python3 -m pip install --quiet beautifulsoup4
          python3 <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re

          index = Path('index.html')
          categories = Path('ventara-categories.js')
          soup = BeautifulSoup(index.read_text(encoding='utf-8'), 'html.parser')
          orders = soup.find(id='orders')
          if not orders:
              raise SystemExit('No se encontró #orders en index.html')

          orders_html = '''
          <section id="orders" class="page">
            <div class="head">
              <div><h1>Pedidos</h1><p>Gestión de pedidos, despacho, entregas programadas y alertas preventivas.</p></div>
              <div class="actions"><button id="btnNewOrder" type="button" class="btn btn-primary btn primary">+ Nuevo pedido</button></div>
            </div>
            <div class="grid kpis" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px">
              <div class="card kpi"><div class="label">Pendientes</div><div class="value" id="ordersPendingCount">0</div></div>
              <div class="card kpi"><div class="label">Entregados</div><div class="value" id="ordersDeliveredCount">0</div></div>
              <div class="card kpi"><div class="label">Cancelados</div><div class="value" id="ordersCancelledCount">0</div></div>
            </div>
            <div class="card"><div class="tablewrap"><table id="ordersTable" class="table"><thead><tr><th>ID PEDIDO</th><th>CLIENTE</th><th>DIRECCIÓN / TEL.</th><th>FECHA / HORA ENTREGA</th><th>TOTAL</th><th>ESTADO</th><th>ALERTA</th><th>ACCIONES</th></tr></thead><tbody id="ordersTableBody"><tr><td colspan="8" class="empty">No hay pedidos registrados.</td></tr></tbody></table></div></div>
          </section>'''
          orders.replace_with(BeautifulSoup(orders_html, 'html.parser').find('section'))

          old_modal = soup.find(id='orderModal')
          modal_html = '''
          <div id="orderModal" class="modal" aria-hidden="true">
            <div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="orderModalTitle">
              <div class="head" style="margin-bottom:16px"><div><h2 id="orderModalTitle" style="margin:0">Nuevo pedido</h2></div><button id="btnCloseOrderModal" type="button" class="btn">Cerrar</button></div>
              <form id="orderForm">
                <div class="card" style="box-shadow:none;margin-bottom:14px"><h3 style="margin-top:0">Cliente y entrega</h3><div class="form">
                  <div class="field"><label for="orderCustomer">Cliente</label><select id="orderCustomer"></select></div>
                  <div class="field"><label for="orderPhone">Teléfono de contacto</label><input id="orderPhone" type="text" inputmode="tel"></div>
                  <div class="field full"><label for="orderAddress">Dirección de entrega</label><input id="orderAddress" type="text"></div>
                  <div class="field"><label for="orderDeliveryDate">Fecha programada de entrega</label><input id="orderDeliveryDate" type="date"></div>
                  <div class="field"><label for="orderDeliveryTime">Hora estimada de entrega</label><input id="orderDeliveryTime" type="time"></div>
                  <div class="field"><label for="orderStatus">Estado</label><select id="orderStatus"><option>Pendiente</option><option>Entregado</option><option>Cancelado</option></select></div>
                </div></div>
                <div class="card" style="box-shadow:none"><h3 style="margin-top:0">Productos del pedido</h3><div class="form" style="align-items:end">
                  <div class="field"><label for="orderProductSearch">Buscar producto</label><input id="orderProductSearch" type="search" placeholder="Nombre o código"></div>
                  <div class="field"><label for="orderProduct">Selector de Producto</label><select id="orderProduct"></select></div>
                  <div class="field"><label for="orderQty">Cantidad</label><input id="orderQty" type="number" min="0.001" step="0.001" value="1"></div>
                  <div class="field"><button id="btnAddOrderItem" type="button" class="btn primary">+ Agregar ítem</button></div>
                </div>
                <div class="tablewrap" style="margin-top:14px"><table id="orderItemsTable" class="table"><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th><th>Acciones</th></tr></thead><tbody id="orderItemsBody"><tr><td colspan="5" class="empty">Agrega los productos del pedido.</td></tr></tbody></table></div>
                <div class="totals"><div class="totalline grand"><span>Total general</span><span id="orderTotal">$ 0</span></div></div></div>
                <div class="actions" style="justify-content:flex-end;margin-top:16px"><button id="btnCancelOrder" type="button" class="btn">Cancelar</button><button id="btnSaveOrder" type="submit" class="btn success">Guardar pedido</button></div>
              </form>
            </div>
          </div>'''
          new_modal = BeautifulSoup(modal_html, 'html.parser').find('div', id='orderModal')
          if old_modal: old_modal.replace_with(new_modal)
          else: soup.body.append(new_modal)

          for old in soup.find_all('script', id='ventara-direct-orders-source'):
              old.decompose()
          direct = r'''<script id="ventara-direct-orders-source">
          (()=>{
            'use strict';
            const $=id=>document.getElementById(id);
            const getDb=()=>{try{return typeof db!=='undefined'?db:window.db}catch(e){return window.db}};
            const money=n=>{try{return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n)||0)}catch(e){return '$ '+Number(n||0).toLocaleString('es-CO')}};
            const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
            let orderItems=[];
            const customers=()=>{const d=getDb();return Array.isArray(d?.customers)?d.customers:(Array.isArray(d?.clients)?d.clients:[])};
            const products=()=>{const d=getDb();return Array.isArray(d?.products)?d.products:[]};
            const pname=p=>String(p?.name||p?.nombre||p?.description||'Producto sin nombre');
            const pid=p=>String(p?.id??p?.productId??p?._id??'');
            const pprice=p=>Number(p?.price??p?.salePrice??p?.precio??p?.sellingPrice??0)||0;
            const ensureOrders=()=>{const d=getDb();if(!d)return null;d.orders=Array.isArray(d.orders)?d.orders:[];return d};
            const saveDb=()=>{try{if(typeof window.save==='function')window.save();else{const d=getDb();if(d)localStorage.setItem('ventara_pos_v1',JSON.stringify(d))}}catch(e){}};
            function openNewOrderModal(){const m=$('orderModal');if(!m)return;orderItems=[];$('orderForm')?.reset();$('orderDeliveryDate').value=today();$('orderStatus').value='Pendiente';$('orderQty').value='1';populateCustomers();populateProducts();renderItems();m.classList.add('show');m.style.display='flex';m.setAttribute('aria-hidden','false')}
            window.openNewOrderModal=openNewOrderModal;
            function closeOrderModal(){const m=$('orderModal');if(!m)return;m.classList.remove('show');m.style.display='none';m.setAttribute('aria-hidden','true')}
            function populateCustomers(){const s=$('orderCustomer');if(!s)return;const a=customers();s.innerHTML=(a.length?a:[{id:'c-final',name:'Consumidor Final'}]).map(c=>`<option value="${String(c.id??c._id??'c-final').replace(/"/g,'&quot;')}">${String(c.name??c.nombre??c.razonSocial??'Consumidor Final').replace(/</g,'&lt;')}</option>`).join('')}
            function populateProducts(){const s=$('orderProduct');if(!s)return;const q=String($('orderProductSearch')?.value||'').toLowerCase().trim();const a=products().filter(p=>p?.active!==false&&(!q||pname(p).toLowerCase().includes(q)||String(p?.code||'').toLowerCase().includes(q)));s.innerHTML=a.map(p=>`<option value="${pid(p).replace(/"/g,'&quot;')}">${pname(p).replace(/</g,'&lt;')} · ${money(pprice(p))}</option>`).join('')||'<option value="">No hay productos</option>'}
            function renderItems(){const b=$('orderItemsBody'),t=$('orderTotal');if(!b||!t)return;b.innerHTML=orderItems.length?orderItems.map((i,n)=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${money(i.price)}</td><td><b>${money(i.qty*i.price)}</b></td><td><button type="button" class="btn sm danger" data-remove-order-item="${n}">Eliminar</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Agrega los productos del pedido.</td></tr>';t.textContent=money(orderItems.reduce((s,i)=>s+i.qty*i.price,0));b.querySelectorAll('[data-remove-order-item]').forEach(x=>x.onclick=()=>{orderItems.splice(Number(x.dataset.removeOrderItem),1);renderItems()})}
            function addItem(){const id=$('orderProduct')?.value,qty=Number($('orderQty')?.value)||0,p=products().find(x=>pid(x)===String(id));if(!p||qty<=0)return;const f=orderItems.find(x=>x.productId===pid(p));if(f)f.qty+=qty;else orderItems.push({productId:pid(p),name:pname(p),qty,price:pprice(p)});renderItems()}
            function submitOrder(e){e.preventDefault();const d=ensureOrders();if(!d)return;const c=customers().find(x=>String(x.id??x._id??'')===String($('orderCustomer')?.value||''));const total=orderItems.reduce((s,i)=>s+i.qty*i.price,0);d.orders.push({id:'PED-'+Date.now().toString().slice(-5),customer:String(c?.name??c?.nombre??'Consumidor Final'),customerId:String($('orderCustomer')?.value||''),address:String($('orderAddress')?.value||''),phone:String($('orderPhone')?.value||''),deliveryDate:String($('orderDeliveryDate')?.value||''),deliveryTime:String($('orderDeliveryTime')?.value||''),items:orderItems.map(i=>({...i,subtotal:i.qty*i.price})),total,status:String($('orderStatus')?.value||'Pendiente'),createdAt:new Date().toISOString()});saveDb();closeOrderModal();renderOrders()}
            function renderOrders(){const d=ensureOrders(),b=$('ordersTableBody');if(!d||!b)return;const a=d.orders||[];$('ordersPendingCount').textContent=a.filter(o=>(o.status||'Pendiente')==='Pendiente').length;$('ordersDeliveredCount').textContent=a.filter(o=>o.status==='Entregado').length;$('ordersCancelledCount').textContent=a.filter(o=>o.status==='Cancelado').length;b.innerHTML=a.length?a.map(o=>{const st=o.status||'Pendiente';let al='PROGRAMADO';if(st==='Entregado')al='ENTREGADO';else if(st==='Cancelado')al='CANCELADO';else if(o.deliveryDate===today())al='¡ENTREGAR HOY!';else if(o.deliveryDate&&o.deliveryDate<today())al='¡VENCIDO / RETRASADO!';return `<tr><td><b>${o.id||'P-00001'}</b></td><td>${o.customer||''}</td><td><div>${o.address||''}</div><small class="muted">${o.phone||''}</small></td><td>${[o.deliveryDate,o.deliveryTime].filter(Boolean).join(' ')}</td><td><b>${money(o.total)}</b></td><td><span class="badge ${st==='Entregado'?'green':st==='Cancelado'?'red':'warn'}">${st}</span></td><td><span class="badge ${al==='¡VENCIDO / RETRASADO!'?'red':al==='¡ENTREGAR HOY!'?'warn':al==='ENTREGADO'?'green':''}">${al}</span></td><td><button type="button" class="btn sm" data-order-detail="${o.id}">Ver Detalles</button>${st==='Pendiente'?` <button type="button" class="btn sm success" data-order-deliver="${o.id}">Marcar Entregado</button> <button type="button" class="btn sm danger" data-order-cancel="${o.id}">Cancelar</button>`:''}</td></tr>`}).join(''):'<tr><td colspan="8" class="empty">No hay pedidos registrados.</td></tr>';b.querySelectorAll('[data-order-deliver]').forEach(x=>x.onclick=()=>setStatus(x.dataset.orderDeliver,'Entregado'));b.querySelectorAll('[data-order-cancel]').forEach(x=>x.onclick=()=>setStatus(x.dataset.orderCancel,'Cancelado'));b.querySelectorAll('[data-order-detail]').forEach(x=>x.onclick=()=>{const o=a.find(y=>String(y.id)===String(x.dataset.orderDetail));if(o)alert(`Pedido ${o.id}\nCliente: ${o.customer||''}\nTotal: ${money(o.total)}\nEstado: ${o.status||'Pendiente'}`)})}
            function setStatus(id,status){const d=ensureOrders(),o=d?.orders?.find(x=>String(x.id)===String(id));if(!o)return;o.status=status;saveDb();renderOrders()}
            document.addEventListener('DOMContentLoaded',()=>{const b=$('btnNewOrder');if(b)b.onclick=function(){openNewOrderModal()};$('btnCloseOrderModal')?.addEventListener('click',closeOrderModal);$('btnCancelOrder')?.addEventListener('click',closeOrderModal);$('btnAddOrderItem')?.addEventListener('click',addItem);$('orderProductSearch')?.addEventListener('input',populateProducts);$('orderForm')?.addEventListener('submit',submitOrder);$('orderCustomer')?.addEventListener('change',()=>{const c=customers().find(x=>String(x.id??x._id??'')===String($('orderCustomer').value));if(c)$('orderPhone').value=c.phone??c.telefono??''});$('orderModal')?.addEventListener('click',e=>{if(e.target===$('orderModal'))closeOrderModal()});renderOrders()});
          })();
          </script>'''
          soup.body.append(BeautifulSoup(direct, 'html.parser').find('script'))
          index.write_text(str(soup), encoding='utf-8')

          if categories.exists():
              c = categories.read_text(encoding='utf-8')
              c = re.sub(r"\s*'ventara-orders-dom-fix\.js[^']*',?", '', c)
              c = re.sub(r"\s*'ventara-orders-button-fix\.js[^']*',?", '', c)
              c = re.sub(r"\s*'ventara-orders-evolution\.js[^']*',?", '', c)
              categories.write_text(c, encoding='utf-8')
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/scripts-check.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/scripts-check.js
          node --check ventara-categories.js

      - name: Commit index only and restore workflow
        shell: bash
        run: |
          git checkout HEAD~1 -- .github/workflows/emergency-sale-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ventara-categories.js .github/workflows/emergency-sale-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(orders): replace pedidos source and bind modal directly'
          git push origin HEAD:main
