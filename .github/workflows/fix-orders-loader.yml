name: Fix Orders module loader

on:
  push:
    paths:
      - .github/workflows/fix-orders-loader.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Place Orders module loader at real document end
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="ventara-orders-evolution.js?v=20260916"></script>'
          s = s.replace(tag, '')
          marker = '</body>'
          pos = s.rfind(marker)
          if pos < 0:
              raise SystemExit('No se encontró el cierre real </body> en index.html')
          s = s[:pos].rstrip() + '\n' + tag + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
          print('Orders loader placed immediately before the final </body>.')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: place Orders loader at document end"
            git push origin main
          fi
