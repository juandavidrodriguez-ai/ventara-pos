name: Fix Orders module loader

on:
  push:
    paths:
      - .github/workflows/fix-orders-loader.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject Orders module loader
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="ventara-orders-evolution.js?v=20260916"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('No se encontró </body> en index.html')
              s = s.replace(marker, tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
              print('Orders loader injected.')
          else:
              print('Orders loader already present.')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: load Orders evolution module"
            git push origin main
          fi
