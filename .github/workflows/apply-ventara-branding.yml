name: Apply Ventara branding

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  branding:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply payment credit selector safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('function openPaymentModalPOS(){')
          end = s.index('function finishSale(', start)
          new = r'''function openPaymentModalPOS(){if(!cart.length)return toast('Agrega productos a la venta');let subtotal=cart.reduce((a,i)=>a+i.qty*i.price,0),discount=+(document.getElementById('posDiscount')?.value||0),total=Math.max(0,subtotal-discount);let clients=(db.clients||[]).filter(c=>String(c.name||'').trim().toLowerCase()!=='consumidor final'&&c.id!=='c1');openModal(`<h2>💰 Cobrar VENTA</h2><p class="muted">Caja registradora · Total a cobrar</p><div style="text-align:center;background:#f4fbfd;padding:15px;border-radius:12px"><div class="muted">TOTAL</div><div style="font-size:38px;font-weight:900;color:#005f73">${money(total)}</div></div><h3>Forma de pago</h3><div class="payment-grid"><button id="pm-Efectivo" class="selected" onclick="selectPay('Efectivo')">💵 Efectivo</button><button id="pm-Tarjeta" onclick="selectPay('Tarjeta')">💳 Tarjeta</button><button id="pm-Transferencia" onclick="selectPay('Transferencia')">📲 Transferencia</button><button id="pm-Mixto" onclick="selectPay('Mixto')">🔀 Mixto</button><button id="pm-Crédito" onclick="selectPay('Crédito')">🧾 Crédito</button></div><div id="cashFields" style="margin-top:15px"><div class="field"><label>EFECTIVO RECIBIDO</label><input id="cashReceived" type="number" min="0" value="${total}" oninput="calcChange(${total})" onkeydown="if(event.key==='Enter')confirmPayment(${total},event)"></div><div class="totalline" style="font-size:18px;margin-top:10px"><span>Cambio</span><b id="cashChange">${money(0)}</b></div></div><div id="cardFields" style="display:none;margin-top:15px"><div class="field"><label>TIPO DE TARJETA</label><select id="cardType" required><option value="">-- Selecciona --</option><option value="Débito">Débito</option><option value="Crédito Visa">Crédito Visa</option><option value="Crédito Mastercard">Crédito Mastercard</option><option value="Otra">Otra</option></select></div></div><div id="transferFields" style="display:none;margin-top:15px"><div class="field"><label>BANCO / BILLETERA</label><select id="transferBank" required><option value="">-- Selecciona --</option><option value="Nequi">Nequi</option><option value="Daviplata">Daviplata</option><option value="Bancolombia">Bancolombia</option><option value="Otros">Otros</option></select></div></div><div id="creditFields" style="display:none;margin-top:15px"><div class="field"><label>CLIENTE PARA VENTA A CRÉDITO</label><select id="creditClientSelect"><option value="">-- Selecciona un cliente --</option>${clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><p id="creditWarning" class="muted" style="color:#9f1239">Selecciona un cliente para vender a crédito</p></div><div id="mixedFields" style="display:none;margin-top:15px"><div class="form"><div class="field"><label>Efectivo</label><input id="mixCash" type="number" value="0" oninput="calcMixed(${total})"></div><div class="field"><label>Tarjeta/Transferencia</label><input id="mixOther" type="number" value="${total}" oninput="calcMixed(${total})"></div></div><p id="mixStatus" class="muted"></p></div><div class="actions" style="margin-top:18px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn success" style="padding:13px 22px" onclick="confirmPayment(${total},event)">✓ CONFIRMAR Y REGISTRAR VENTA</button></div>`)}
let selectedPay='Efectivo';function selectPay(method){selectedPay=method;document.querySelectorAll('.payment-grid button').forEach(b=>b.classList.remove('selected'));let active=document.getElementById('pm-'+method);if(active)active.classList.add('selected');let panels={Efectivo:'cashFields',Tarjeta:'cardFields',Transferencia:'transferFields',Mixto:'mixedFields','Crédito':'creditFields'};Object.values(panels).forEach(id=>{let el=document.getElementById(id);if(el)el.style.display='none'});let panel=document.getElementById(panels[method]);if(panel)panel.style.display='block';let cash=document.getElementById('cashFields');if(cash)cash.style.display=method==='Efectivo'?'block':'none';let mixed=document.getElementById('mixedFields');if(mixed)mixed.style.display=method==='Mixto'?'block':'none'}
function calcChange(total){let r=+(document.getElementById('cashReceived')?.value||0);let el=document.getElementById('cashChange');if(el)el.textContent=money(Math.max(0,r-total))}
function calcMixed(total){let a=+(document.getElementById('mixCash')?.value||0),b=+(document.getElementById('mixOther')?.value||0),d=a+b-total;let el=document.getElementById('mixStatus');if(el)el.textContent=d>=0?'Pago completo · Cambio '+money(d):'Faltan '+money(Math.abs(d))}
function confirmPayment(total,e){if(e){e.preventDefault();e.stopPropagation()}try{if(!cart.length)return toast('Agrega productos a la venta');if(selectedPay==='Efectivo'){let r=+(document.getElementById('cashReceived')?.value||0);if(r<total)return toast('El efectivo recibido es menor al total')}if(selectedPay==='Mixto'){let a=+(document.getElementById('mixCash')?.value||0),b=+(document.getElementById('mixOther')?.value||0);if(a+b!==total)return toast('El pago mixto debe ser exactamente igual al total')}if(selectedPay==='Crédito'){let creditSelect=document.getElementById('creditClientSelect');if(!creditSelect||!creditSelect.value)return alert('Selecciona un cliente para vender a crédito');posClient=creditSelect.value}let sale=finishSale(selectedPay,total);if(!sale)return;offerTicket(sale.id)}catch(error){console.error('Error al procesar la venta:',error);alert('Ocurrió un error al registrar la venta: '+(error?.message||String(error)))}}
'''
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Apply exact Ventara sidebar branding
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          html = re.sub(r'(<div[^>]*class=["\']brand["\'][^>]*>\s*<img[^>]+src=["\'])(?:data:image/[^"\']+|assets/(?:ventara\.png|ventara-logo\.png|ventara-favicon\.png))(["\'])',r'\1assets/ventara.png\2',html,flags=re.I|re.S)
          css='''<style id="ventara-sidebar-branding">
          .sidebar{background:#005f73!important;color:#fff!important}
          .brand{display:flex!important;align-items:center!important;justify-content:center!important;padding:12px 8px 18px!important;min-height:86px!important}
          .brand img,.brand .logo-img{display:block!important;width:210px!important;height:auto!important;max-width:100%!important;max-height:64px!important;object-fit:contain!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;filter:drop-shadow(0 0 0.8px #fff) drop-shadow(0 0 1.8px #fff)!important}
          .brand strong,.brand span:not(:has(img)){display:none!important}
          .nav{color:#fff!important}.nav:hover{background:rgba(255,255,255,.12)!important;color:#fff!important}.nav.active{background:linear-gradient(90deg,var(--orange),var(--orange2))!important;color:#fff!important}.navtitle{color:rgba(255,255,255,.72)!important}
          </style>'''
          html=re.sub(r'<style id="ventara-sidebar-branding">.*?</style>\s*','',html,flags=re.I|re.S)
          html=html.replace('</head>',css+'\n</head>',1)
          p.write_text(html,encoding='utf-8')
          PY
      - name: Commit index changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: add defensive credit payment selector [skip ci]"
          git push
