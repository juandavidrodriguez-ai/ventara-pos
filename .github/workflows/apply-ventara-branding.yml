name: Apply Ventara branding

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  branding:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact Ventara sidebar branding
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")

          # The complete wordmark supplied for Ventara is ventara-logo.png.
          # Ensure the sidebar uses it instead of the small POS icon.
          html = re.sub(r'(<(?:img)[^>]+src=["\'])assets/(?:ventara\.png|ventara-logo\.png)["\']', r'\1assets/ventara-logo.png"', html, flags=re.I)

          css = '''<style id="ventara-sidebar-branding">
          .sidebar{background:#17324d!important;color:#fff!important}
          .brand{display:flex!important;align-items:center!important;justify-content:center!important;padding:14px 8px 20px!important;min-height:86px!important}
          .brand img,.brand .logo-img{display:block!important;width:210px!important;height:auto!important;max-width:100%!important;max-height:64px!important;object-fit:contain!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:2px 0 0 #fff,-2px 0 0 #fff,0 2px 0 #fff,0 -2px 0 #fff,1.5px 1.5px 0 #fff,-1.5px -1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px 1.5px 0 #fff!important;filter:drop-shadow(0 0 1px #fff)!important}
          .brand strong,.brand span:not(:has(img)){display:none!important}
          .nav{color:#fff!important}
          .nav:hover{background:rgba(255,255,255,.12)!important;color:#fff!important}
          .nav.active{background:linear-gradient(90deg,var(--orange),var(--orange2))!important;color:#fff!important}
          .navtitle{color:rgba(255,255,255,.65)!important}
          </style>'''
          if 'id="ventara-sidebar-branding"' not in html:
              html = html.replace('</head>', css + '\n</head>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit branding changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: use complete Ventara wordmark in sidebar [skip ci]"
          git push
