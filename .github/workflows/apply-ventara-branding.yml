name: Apply Ventara branding

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  branding:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact Ventara sidebar branding
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")

          # Use the exact complete Ventara wordmark supplied by the user.
          # assets/ventara.png is the full transparent Ventara wordmark;
          # ventara-logo.png is not the sidebar mark and must not be used here.
          html = re.sub(
              r'(<(?:img)[^>]+src=["\'])(?:assets/ventara\.png|assets/ventara-logo\.png|assets/ventara-favicon\.png)["\']',
              r'\1assets/ventara.png"',
              html,
              flags=re.I,
          )

          css = '''<style id="ventara-sidebar-branding">
          .sidebar{background:#17324d!important;color:#fff!important}
          .brand{display:flex!important;align-items:center!important;justify-content:center!important;padding:14px 8px 20px!important;min-height:86px!important}
          .brand img,.brand .logo-img{display:block!important;width:210px!important;height:auto!important;max-width:100%!important;max-height:64px!important;object-fit:contain!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;filter:drop-shadow(0 0 0.8px #fff) drop-shadow(0 0 1.8px #fff)!important}
          .brand strong,.brand span:not(:has(img)){display:none!important}
          .nav{color:#fff!important}
          .nav:hover{background:rgba(255,255,255,.12)!important;color:#fff!important}
          .nav.active{background:linear-gradient(90deg,var(--orange),var(--orange2))!important;color:#fff!important}
          .navtitle{color:rgba(255,255,255,.65)!important}
          </style>'''

          # Replace an earlier generated branding block if it exists, so the
          # white outline is always a silhouette-following drop shadow rather
          # than a rectangular box/shadow.
          html = re.sub(
              r'<style id="ventara-sidebar-branding">.*?</style>\s*',
              '',
              html,
              flags=re.I|re.S,
          )
          html = html.replace('</head>', css + '\n</head>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit branding changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: use exact Ventara wordmark with silhouette outline [skip ci]"
          git push
