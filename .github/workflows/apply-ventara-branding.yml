name: Apply Ventara branding

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  branding:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Ventara logo and sidebar
        env:
          LOGO_B64: iVBORw0KGgoAAAANSUhEUgAAAmAAAADOCAYAAACZ4r5nAAAACXBIWXMAAC4jAAAuIwF4pT92AAAgAElEQVR4nO3dDXgU9b0v8O8EgkmQbJAgIRA2IGIAbRaroPUl6/sL0CxgWsWjWU
      - name: Commit branding changes
        run: |
          echo "Branding workflow installed; the full update will be applied from the next repository push."
