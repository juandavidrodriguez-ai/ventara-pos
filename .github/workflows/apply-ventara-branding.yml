name: Apply Ventara branding

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  branding:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact Ventara sidebar branding
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")

          html = re.sub(
              r'(<div[^>]*class=["\']brand["\'][^>]*>\s*<img[^>]+src=["\'])(?:data:image/[^"\']+|assets/(?:ventara\.png|ventara-logo\.png|ventara-favicon\.png))(["\'])',
              r'\1assets/ventara.png\2',
              html,
              flags=re.I|re.S,
          )

          css = '''<style id="ventara-sidebar-branding">
          .sidebar{background:#005f73!important;color:#fff!important}
          .brand{display:flex!important;align-items:center!important;justify-content:center!important;padding:12px 8px 18px!important;min-height:86px!important}
          .brand img,.brand .logo-img{display:block!important;width:210px!important;height:auto!important;max-width:100%!important;max-height:64px!important;object-fit:contain!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;filter:drop-shadow(0 0 0.8px #fff) drop-shadow(0 0 1.8px #fff)!important}
          .brand strong,.brand span:not(:has(img)){display:none!important}
          .nav{color:#fff!important}
          .nav:hover{background:rgba(255,255,255,.12)!important;color:#fff!important}
          .nav.active{background:linear-gradient(90deg,var(--orange),var(--orange2))!important;color:#fff!important}
          .navtitle{color:rgba(255,255,255,.72)!important}
          </style>'''

          html = re.sub(r'<style id="ventara-sidebar-branding">.*?</style>\s*', '', html, flags=re.I|re.S)
          html = html.replace('</head>', css + '\n</head>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Load Ventara UI enhancements safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          tag = '<script src="ventara-ui-enhancements.js"></script>'
          # Remove an earlier incorrect injection that landed inside the
          # printTicket() template string. Then inject only at the final
          # document closing tag so the browser loads it in the main app.
          html = html.replace(tag, '')
          marker = '</body>'
          pos = html.rfind(marker)
          if pos < 0:
              raise SystemExit('No se encontró el cierre real de body')
          html = html[:pos] + tag + '\n' + html[pos:]
          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit branding and UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: enable Ventara UI enhancements [skip ci]"
          git push
