name: Apply Ventara branding

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  branding:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Ventara branding
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")

          # Use the complete Ventara logo already stored in the repository.
          html = html.replace("assets/ventara-logo.png", "assets/ventara.png")

          # Remove any redundant POS text beside the complete wordmark.
          html = re.sub(
              r'(<div[^>]*class=["\']brand["\'][^>]*>.*?)(<strong>.*?</strong>)(.*?</div>)',
              r'\1\3',
              html,
              count=1,
              flags=re.I | re.S
          )

          marker = '<style id="ventara-branding-v2">'
          if marker not in html:
              branding_css = '<style id="ventara-branding-v2">\n.sidebar{background:#ffffff!important;color:#17324d!important;border-right:1px solid #d9e4ec}\n.brand{justify-content:center;padding:10px 4px 18px}\n.brand span{background:transparent!important;color:inherit!important;padding:0!important;border-radius:0;display:flex;justify-content:center;width:100%}\n.brand strong{display:none!important}\n.logo-img{width:205px!important;height:auto!important;max-height:58px;object-fit:contain;background:#fff!important;border-radius:0!important;padding:0!important}\n.nav{color:#17324d!important}\n.nav:hover{background:#eaf6fb!important;color:#005f73!important}\n.nav.active{background:linear-gradient(90deg,var(--orange),var(--orange2))!important;color:#fff!important}\n.navtitle{color:#17324d!important;opacity:.65!important}\n</style>'
              html = html.replace("</head>", branding_css + "\n</head>", 1)

          p.write_text(html, encoding="utf-8")
          PY

      - name: Commit branding changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: use complete Ventara logo and light sidebar [skip ci]"
          git push
