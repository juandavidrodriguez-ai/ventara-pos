name: Deploy Ventara POS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Repair login and preserve evolved Orders
        if: github.event.head_commit.message != 'FIX: login nativo y pedidos integrados'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('id="loginScreen"','id="login-screen"')
          s=s.replace("getElementById('loginScreen')","getElementById('login-screen')")
          s=s.replace('getElementById("loginScreen")','getElementById("login-screen")')
          s=s.replace('b.onclick=function(e){e.preventDefault();var modal=document.getElementById("orderModal");if(modal){modal.classList.add("show");modal.style.display="block";open()}}',
                      'b.onclick=function(){var modal=document.getElementById("orderModal");if(modal){modal.style.display="block";modal.classList.add("show");open()}}')
          s=s.replace('if(n){e.preventDefault();e.stopImmediatePropagation();',
                      'if(n){e.stopImmediatePropagation();')
          p.write_text(s)
          PY
          rm -f ventara-orders-evolution.js ventara-orders-button-fix.js ventara-orders-dom-fix.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No source repair changes needed."
          else
            git commit -m 'FIX: login nativo y pedidos integrados'
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
