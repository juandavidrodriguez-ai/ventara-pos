name: Fix POS ticket flow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-ticket-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal POS ticket fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = "finishSale(selectedPay,total,true)"
          new = "finishSale(selectedPay,total,false)"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Expected POS payment call was not found; file left unchanged.')

          p.write_text(s, encoding='utf-8')

      - name: Commit only if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git add index.html
          git commit -m "fix: show POS ticket preview after sale"
          git push
