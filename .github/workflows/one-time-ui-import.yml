name: One-time UI clean import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply surgical import with retry against concurrent updates
        run: |
          set -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag='<script src="ventara-ui-clean.js"></script>'

          for attempt in $(seq 1 10); do
            echo "Intento $attempt/10"
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="ventara-ui-clean.js"></script>'
          if tag not in s:
              marker = '</body>'
              pos = s.lower().rfind(marker)
              if pos == -1:
                  raise SystemExit('No se encontró </body> en index.html')
              s = s[:pos] + tag + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
              print('Import agregado.')
          else:
              print('Import ya estaba presente.')
          PY

            rm -f .github/workflows/one-time-ui-import.yml ui-import-trigger.tmp
            git add index.html .github/workflows/one-time-ui-import.yml ui-import-trigger.tmp
            git diff --cached --quiet && { echo 'Sin cambios.'; exit 0; }
            git commit -m 'fix(ui): import surgical UI cleanup script'
            if git push origin HEAD:main; then
              echo 'Push exitoso.'
              exit 0
            fi
            echo 'Push rechazado por actualización concurrente; reintentando.'
            sleep 2
          done
          echo 'No fue posible completar el push tras 10 intentos.'
          exit 1
