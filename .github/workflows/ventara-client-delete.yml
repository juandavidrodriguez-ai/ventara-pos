name: Ventara client deletion UI patch
on:
  push:
    paths:
      - '.github/workflows/ventara-client-delete.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch client and credit deletion actions
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function renderClients(){')
          end=s.index('function openClientModal', start)
          new_clients="""function renderClients(){document.getElementById('clients').innerHTML=pageHead('Clientes','Clientes, línea de crédito y condiciones de pago',`<button class=\"btn primary\" onclick=\"openClientModal()\">+ Cliente</button>`)+`<div class=\"card\">${table(['Cliente','Documento','Teléfono','Crédito','Saldo','Estado','Acciones'],db.clients.map(c=>`<tr><td>${c.name}</td><td>${c.doc}</td><td>${c.phone}</td><td>${money(c.credit)}</td><td>${money(c.balance)}</td><td>${c.balance>0?'<span class=\"badge warn\">Pendiente</span>':'<span class=\"badge green\">Al día</span>'}</td><td><button class=\"btn sm\" onclick=\"openClientModal('${c.id}')\">Editar</button>${c.id!=='c1'&&String(c.name||'').trim().toLowerCase()!=='consumidor final'?` <button class=\"btn sm danger\" onclick=\"deleteClient('${c.id}')\">Eliminar</button>`:''}</td></tr>`).join(''))}</div>`}\n"""
          s=s[:start]+new_clients+s[end:]
          start=s.index('function renderReceivables(){')
          end=s.index('function openPaymentModal', start)
          new_recv="""function renderReceivables(){let debtors=db.clients.filter(c=>c.balance>0);let total=debtors.reduce((a,c)=>a+c.balance,0);document.getElementById('receivables').innerHTML=pageHead('Fiados / Crédito','La libreta de fiados digital de VENTARA',`<button class=\"btn primary\" onclick=\"openClientModal()\">+ Nueva línea de crédito</button><button class=\"btn\" onclick=\"exportCreditReport()\">Exportar cartera</button>`)+`<div class=\"grid cols3\"><div class=\"card kpi\"><div class=\"label\">Total fiado</div><div class=\"value\">${money(total)}</div></div><div class=\"card kpi\"><div class=\"label\">Clientes con saldo</div><div class=\"value\">${debtors.length}</div></div><div class=\"card kpi\"><div class=\"label\">Líneas habilitadas</div><div class=\"value\">${db.clients.filter(c=>c.creditEnabled).length}</div></div></div><div class=\"card\" style=\"margin-top:16px\">${table(['Cliente','Límite','Saldo','Disponible','Plazo','Acción'],db.clients.filter(c=>c.creditEnabled||c.balance>0).map(c=>`<tr><td><b>${c.name}</b><br><small class=\"muted\">${c.doc||''}</small></td><td>${money(c.credit)}</td><td>${money(c.balance)}</td><td>${money(Math.max(0,(c.credit||0)-(c.balance||0)))}</td><td>${c.creditDays??0} días</td><td><button class=\"btn sm\" onclick=\"openPaymentModal('${c.id}')\">Abonar</button> <button class=\"btn sm\" onclick=\"openClientModal('${c.id}')\">Editar</button> <button class=\"btn sm danger\" onclick=\"deleteCreditLine('${c.id}')\">Eliminar</button></td></tr>`).join(''),'No hay líneas de crédito configuradas')}</div>`}\n"""
          s=s[:start]+new_recv+s[end:]
          insert_at=s.index('function renderReceivables(){')
          helpers="""function deleteClient(id){let c=db.clients.find(x=>x.id===id);if(!c)return;if(c.id==='c1'||String(c.name||'').trim().toLowerCase()==='consumidor final')return toast('Consumidor final no se puede eliminar');if(!confirm('¿Estás seguro de eliminar este cliente?'))return;db.clients=db.clients.filter(x=>x.id!==id);if(posClient===id)posClient='c1';save();renderClients();toast('Cliente eliminado')}\nfunction deleteCreditLine(id){let c=db.clients.find(x=>x.id===id);if(!c)return;let pending=Number(c.balance||0);let message=pending>0?'Este cliente tiene saldo pendiente de '+money(pending)+'. Al eliminar la línea también se eliminará el cliente y el saldo registrado. ¿Deseas continuar?':'¿Eliminar la línea de crédito correspondiente a este cliente?';if(!confirm(message))return;db.clients=db.clients.filter(x=>x.id!==id);if(posClient===id)posClient='c1';save();renderReceivables();toast('Línea de crédito eliminada')}\n"""
          s=s[:insert_at]+helpers+s[insert_at:]
          p.write_text(s,encoding='utf-8')
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/scripts-check.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/scripts-check.js
      - name: Commit index and remove patch workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ventara-client-delete.yml
          git add index.html
          git commit -m 'feat: add client and credit line deletion actions'
          git push origin HEAD:main
