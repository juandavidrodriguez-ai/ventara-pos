name: Install Ventara categories module

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          script='<script src="ventara-categories.js"></script>'
          if script not in s:
              marker="<button class=\"btn primary\" onclick=\"openProductModal()\">+ Nuevo artículo</button><button class=\"btn\" onclick=\"exportCSV('products')\">Exportar CSV</button>"
              replacement="<button class=\"btn primary\" onclick=\"openProductModal()\">+ Nuevo artículo</button><button class=\"btn\" onclick=\"openCategoriesModal()\">📂 Categorías</button><button class=\"btn\" onclick=\"exportCSV('products')\">Exportar CSV</button>"
              if marker not in s:
                  raise SystemExit('No se encontró el bloque exacto de acciones de Artículos; no se modifica index.html.')
              s=s.replace(marker,replacement,1)
              body='</body></html>'
              if body not in s:
                  raise SystemExit('No se encontró el cierre de index.html; no se modifica.')
              s=s.replace(body,script+'\n'+body,1)
              p.write_text(s,encoding='utf-8')
          else:
              print('El módulo ya está instalado; no se toca index.html.')
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ventara-categories.js .github/workflows/patch-categories.yml
          git rm -f .github/workflows/patch-categories.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add article categories [skip ci]"
          git push
