name: Monolithic Orders Restore
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: contains(github.event.head_commit.message, 'TRIGGER MONOLITHIC ORDERS RESTORE')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore monolithic Orders source
        shell: bash
        run: |
          set -euo pipefail
          git checkout aa2ba07abb3bc33d6003378f2064f14a3a22c9f7 -- index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for name in ['ventara-orders-evolution.js','ventara-orders-button-fix.js','ventara-orders-dom-fix.js']:
              s=s.replace('<script src="'+name+'"></script>','')
              s=s.replace('<script src="./'+name+'"></script>','')
          block=r'''\n<!-- VENTARA PEDIDOS: estructura monolítica directa -->\n<div id="orderModal" class="modal" aria-hidden="true">\n  <div class="modalbox">\n    <div class="head"><div><h2>Nuevo pedido</h2><p>Registra cliente, entrega y productos del pedido.</p></div><button type="button" class="btn" id="btnCloseOrderModal">Cerrar</button></div>\n    <section class="card" style="margin-bottom:14px">\n      <h3>1. Cliente y entrega</h3>\n      <div class="form">\n        <div class="field"><label>Cliente</label><select id="o_client"></select></div>\n        <div class="field"><label>Teléfono de contacto</label><input id="o_phone" type="tel"></div>\n        <div class="field full"><label>Dirección de entrega</label><input id="o_address" type="text"></div>\n        <div class="field"><label>Fecha programada de entrega</label><input id="o_deliveryDate" type="date"></div>\n        <div class="field"><label>Hora estimada de entrega</label><input id="o_deliveryTime" type="time"></div>\n        <div class="field"><label>Estado</label><select id="o_status"><option>Pendiente</option><option>Confirmado</option><option>Preparando</option><option>Listo</option><option>Enviado</option><option>Entregado</option><option>Cancelado</option></select></div>\n      </div>\n    </section>\n    <section class="card">\n      <h3>2. Productos del pedido</h3>\n      <div class="form">\n        <div class="field full"><label>Buscar producto</label><input id="o_search" type="search" placeholder="Buscar por nombre o código"></div>\n        <div class="field"><label>Producto</label><select id="o_prod"></select></div>\n        <div class="field"><label>Cantidad</label><input id="o_qty" type="number" min="0.001" step="0.001" value="1"></div>\n      </div>\n      <div class="actions" style="margin-top:12px"><button type="button" class="btn primary" id="btnAddOrderItem">+ Agregar ítem</button></div>\n      <div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Total</th><th>Acción</th></tr></thead><tbody id="orderItemsBody"><tr><td colspan="5" class="empty">Agrega productos al pedido.</td></tr></tbody><tfoot><tr><td colspan="3"><b>Total del pedido</b></td><td colspan="2"><b id="orderItemsTotal">$0</b></td></tr></tfoot></table></div>\n    </section>\n    <div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" id="btnCancelOrder">Cancelar</button><button type="button" class="btn success" id="btnSaveOrderMonolithic">Guardar pedido</button></div>\n  </div>\n</div>\n<script id="ventara-orders-monolithic">\n(function(){\n  var modal=document.getElementById('orderModal');\n  var items=[];\n  function data(){try{return JSON.parse(localStorage.getItem('ventara_pos_v1')||'{}')}catch(e){return {}}}\n  function esc(v){return String(v??'').replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})}\n  function money(n){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n)||0)}\n  function defaultId(i){return 'O-'+String(i+1).padStart(6,'0')}\n  function fillClients(){var d=data(), list=Array.isArray(d.clients)?d.clients:[], sel=document.getElementById('o_client');if(!sel)return;sel.innerHTML=list.map(function(c){return '<option value="'+esc(c.id||'')+'">'+esc(c.name||'Consumidor final')+'</option>'}).join('')}\n  function fillProducts(q){var d=data(),list=(Array.isArray(d.products)?d.products:[]).filter(function(p){var t=String(q||'').toLowerCase().trim();return !t||String(p.name||'').toLowerCase().includes(t)||String(p.code||'').includes(t)}),sel=document.getElementById('o_prod');if(!sel)return;sel.innerHTML=list.map(function(p){return '<option value="'+esc(p.id||'')+'">'+esc(p.name||'Producto')+' · '+money(p.price)+'</option>'}).join('')}\n  function renderItems(){var body=document.getElementById('orderItemsBody'),total=items.reduce(function(a,i){return a+i.qty*i.price},0);if(!body)return;body.innerHTML=items.length?items.map(function(i,n){return '<tr><td>'+esc(i.name)+'</td><td>'+i.qty+'</td><td>'+money(i.price)+'</td><td>'+money(i.qty*i.price)+'</td><td><button type="button" class="btn sm danger" data-remove-order-item="'+n+'">Eliminar</button></td></tr>'}).join(''):'<tr><td colspan="5" class="empty">Agrega productos al pedido.</td></tr>';var t=document.getElementById('orderItemsTotal');if(t)t.textContent=money(total)}\n  function open(){items=[];fillClients();fillProducts('');document.getElementById('o_search').value='';document.getElementById('o_qty').value='1';document.getElementById('o_deliveryDate').value=new Date().toISOString().slice(0,10);modal.classList.add('show');modal.style.display='block';modal.setAttribute('aria-hidden','false');renderItems()}\n  function close(){modal.classList.remove('show');modal.style.display='none';modal.setAttribute('aria-hidden','true')}\n  function renderOrdersMonolithic(){var d=data(),orders=Array.isArray(d.orders)?d.orders:[],el=document.getElementById('orders');if(!el)return;var rows=orders.map(function(o,i){var id=o&&o.id?o.id:(o&&o.number?o.number:defaultId(i));var date=[o&&o.deliveryDate,o&&o.deliveryTime].filter(Boolean).join(' ')||'—';var name=o&&o.customer?o.customer:(d.clients||[]).find(function(c){return c.id===o.clientId})?.name||'—';var phone=o&&o.phone?o.phone:(d.clients||[]).find(function(c){return c.id===o.clientId})?.phone||'—';var total=Number(o&&o.total)||0;var status=o&&o.status?o.status:'Pendiente';return '<tr><td><b>'+esc(id)+'</b></td><td>'+esc(name)+'</td><td><div>'+esc(o&&o.address?o.address:'—')+'</div><small class="muted">'+esc(phone||'—')+'</small></td><td>'+esc(date)+'</td><td><b>'+money(total)+'</b></td><td><span class="badge">'+esc(status)+'</span></td><td><span class="badge">'+(status==='Pendiente'?'Pendiente':'—')+'</span></td><td><button type="button" class="btn sm" data-order-open="'+esc(id)+'">Ver</button></td></tr>'}).join('');el.innerHTML='<div class="head"><div><h1>Pedidos</h1><p>Gestión de pedidos, despacho, entregas programadas y alertas preventivas.</p></div><div class="actions"><button type="button" class="btn primary" id="btnNewOrder">+ Nuevo pedido</button></div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>ID PEDIDO</th><th>CLIENTE</th><th>DIRECCIÓN / TEL.</th><th>FECHA / HORA ENTREGA</th><th>TOTAL</th><th>ESTADO</th><th>ALERTA</th><th>ACCIONES</th></tr></thead><tbody>'+(rows||'<tr><td colspan="8" class="empty">No hay pedidos registrados.</td></tr>')+'</tbody></table></div></div>';var b=document.getElementById('btnNewOrder');if(b){b.onclick=function(e){e.preventDefault();var modal=document.getElementById('orderModal');if(modal){modal.classList.add('show');modal.style.display='block';open()}}}}\n  document.addEventListener('click',function(e){var r=e.target.closest('[data-remove-order-item]');if(r){items.splice(Number(r.getAttribute('data-remove-order-item')),1);renderItems();return}var n=e.target.closest('[data-page="orders"]');if(n){e.preventDefault();e.stopImmediatePropagation();document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active')});document.getElementById('orders').classList.add('active');document.querySelectorAll('.nav').forEach(function(x){x.classList.toggle('active',x===n)});renderOrdersMonolithic();return}},true);\n  document.getElementById('btnAddOrderItem').onclick=function(){var d=data(),id=document.getElementById('o_prod').value,p=(d.products||[]).find(function(x){return x.id===id}),q=Number(document.getElementById('o_qty').value)||0;if(!p||q<=0)return;if(items.some(function(i){return i.productId===p.id})){items=items.map(function(i){return i.productId===p.id?Object.assign({},i,{qty:i.qty+q}):i})}else items.push({productId:p.id,name:p.name,qty:q,price:Number(p.price)||0});renderItems()};\n  document.getElementById('o_search').oninput=function(){fillProducts(this.value)};\n  document.getElementById('btnCloseOrderModal').onclick=close;document.getElementById('btnCancelOrder').onclick=close;\n  document.getElementById('btnSaveOrderMonolithic').onclick=function(){var d=data();d.orders=Array.isArray(d.orders)?d.orders:[];if(!items.length)return alert('Agrega al menos un producto.');var c=(d.clients||[]).find(function(x){return x.id===document.getElementById('o_client').value});var total=items.reduce(function(a,i){return a+i.qty*i.price},0);var order={id:'o_'+Date.now().toString(36),number:defaultId(d.orders.length),date:new Date().toISOString().slice(0,10),deliveryDate:document.getElementById('o_deliveryDate').value||null,deliveryTime:document.getElementById('o_deliveryTime').value||null,customer:c?.name||'—',customerId:c?.id||'',phone:document.getElementById('o_phone').value||c?.phone||'',address:document.getElementById('o_address').value||'',status:document.getElementById('o_status').value||'Pendiente',total:total,items:items};d.orders.unshift(order);localStorage.setItem('ventara_pos_v1',JSON.stringify(d));close();renderOrdersMonolithic()};\n  window.ventaraRenderOrdersMonolithic=renderOrdersMonolithic;\n  if(document.getElementById('orders'))renderOrdersMonolithic();\n})();\n</script>\n'''
          s=s.replace('</body>',block+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f ventara-orders-evolution.js ventara-orders-button-fix.js ventara-orders-dom-fix.js
          git config user.name 'juandavidrodriguez-ai'
          git config user.email 'juandavidrodriguez@colegiolossamanes.edu.co'
          git add -A
          git commit -m 'RESTORE: Pedidos monolítico directo en index.html'
          git push origin main
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/monolithic-orders-restore.yml
          git config user.name 'juandavidrodriguez-ai'
          git config user.email 'juandavidrodriguez@colegiolossamanes.edu.co'
          git commit -m 'CHORE: remove temporary monolithic restore workflow'
          git push origin main
# trigger-ready-v3
