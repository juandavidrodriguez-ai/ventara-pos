name: Emergency Monolithic Source Repair
on: [push]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair index.html
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "FIX: restaurar login y pedidos monolíticos en index.html" ]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=s.replace('id="loginScreen"','id="login-screen"').replace("getElementById('loginScreen')","getElementById('login-screen')").replace('getElementById("loginScreen")','getElementById("login-screen")')
          if '#login-screen{display:flex!important}' not in s: s=s.replace('</style>','\n#login-screen{display:flex!important}\n</style>',1)
          new_render='''function renderOrders(){var el=document.getElementById('orders');if(!el)return;var orders=Array.isArray(db.orders)?db.orders:[];var rows=orders.map(function(o,i){var id=o.id||o.number||('O-'+String(i+1).padStart(6,'0'));var client=o.customer||o.clientName||clientName(o.clientId)||'—';var phone=o.phone||db.clients.find(function(c){return c.id===o.clientId})?.phone||'—';var addr=o.address||o.deliveryAddress||'—';var date=o.deliveryDate||o.date||'—';var time=o.deliveryTime||o.time||'—';var total=Number(o.total)||0;var status=o.status||'Pendiente';var alert=status==='Pendiente'?'Pendiente':'—';return '<tr><td><b>'+id+'</b></td><td>'+client+'</td><td><div>'+addr+'</div><small class="muted">'+phone+'</small></td><td>'+date+' / '+time+'</td><td><b>'+money(total)+'</b></td><td><span class="badge">'+status+'</span></td><td><span class="badge">'+alert+'</span></td><td><button class="btn sm" type="button">Ver</button></td></tr>'}).join('');el.innerHTML=pageHead('Pedidos','Gestión de pedidos, despacho, entregas programadas y alertas preventivas','<button class="btn primary" type="button" id="btnNewOrder">+ Nuevo pedido</button>')+'<div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>ID PEDIDO</th><th>CLIENTE</th><th>DIRECCIÓN / TEL.</th><th>FECHA / HORA ENTREGA</th><th>TOTAL</th><th>ESTADO</th><th>ALERTA</th><th>ACCIONES</th></tr></thead><tbody>'+(rows||'<tr><td colspan="8" class="empty">No hay pedidos registrados.</td></tr>')+'</tbody></table></div></div>';document.getElementById('btnNewOrder').onclick=function(){document.getElementById('orderModal').style.display='block';document.getElementById('orderModal').classList.add('show');window.openEvolvedOrderModal&&window.openEvolvedOrderModal()}}\nfunction openOrderModal(){var m=document.getElementById('orderModal');if(!m)return;m.style.display='block';m.classList.add('show');window.openEvolvedOrderModal&&window.openEvolvedOrderModal()}\n'''
          s,n=re.subn(r'function renderOrders\(\)\{.*?\nfunction openOrderModal\(\)\{.*?\nfunction saveOrder\(\)',new_render+'function saveOrder()',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderOrders replacement failed')
          s=re.sub(r'\n<!-- VENTARA PEDIDOS: estructura monolítica directa -->\n<div id="orderModal" class="modal" aria-hidden="true">.*?\n</script>\n(?=\s*</body>)','\n',s,count=1,flags=re.S)
          order='''\n<!-- VENTARA PEDIDOS: módulo monolítico -->\n<div id="orderModal" class="modal" aria-hidden="true"><div class="modalbox" style="width:min(920px,94vw)"><div class="head"><div><h2>Nuevo pedido</h2><p>Registra cliente, entrega y productos del pedido.</p></div><button type="button" class="btn" id="btnCloseOrderModal">Cerrar</button></div><section class="card" style="margin-bottom:14px"><h3>Cliente y entrega</h3><div class="form"><div class="field"><label>Cliente</label><select id="o_client"></select></div><div class="field"><label>Teléfono de contacto</label><input id="o_phone" type="tel"></div><div class="field full"><label>Dirección de entrega</label><input id="o_address" type="text"></div><div class="field"><label>Fecha programada de entrega</label><input id="o_deliveryDate" type="date"></div><div class="field"><label>Hora estimada de entrega</label><input id="o_deliveryTime" type="time"></div><div class="field"><label>Estado</label><select id="o_status"><option>Pendiente</option><option>Confirmado</option><option>Preparando</option><option>Listo</option><option>Enviado</option><option>Entregado</option><option>Cancelado</option></select></div></div></section><section class="card"><h3>Productos del pedido</h3><div class="form"><div class="field full"><label>Buscar producto</label><input id="o_search" type="search" placeholder="Buscar por nombre o código"></div><div class="field"><label>Producto</label><select id="o_prod"></select></div><div class="field"><label>Cantidad</label><input id="o_qty" type="number" min="0.001" step="0.001" value="1"></div></div><div class="actions" style="margin-top:12px"><button type="button" class="btn primary" id="btnAddOrderItem">+ Agregar ítem</button></div><div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Total</th><th>Acción</th></tr></thead><tbody id="orderItemsBody"><tr><td colspan="5" class="empty">Agrega productos al pedido.</td></tr></tbody><tfoot><tr><td colspan="3"><b>Total del pedido</b></td><td colspan="2"><b id="orderItemsTotal">$0</b></td></tr></tfoot></table></div></section><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" id="btnCancelOrder">Cancelar</button><button type="button" class="btn success" id="btnSaveOrderMonolithic">Guardar pedido</button></div></div></div>\n<script id="ventara-orders-monolithic">\n(function(){var items=[];function open(){items=[];var cs=db.clients||[],ps=db.products||[],c=document.getElementById('o_client'),p=document.getElementById('o_prod');if(c)c.innerHTML=cs.map(function(x){return '<option value="'+x.id+'">'+(x.name||'Consumidor final')+'</option>'}).join('');if(p)p.innerHTML=ps.map(function(x){return '<option value="'+x.id+'">'+(x.name||'Producto')+' · '+money(x.price)+'</option>'}).join('');document.getElementById('o_search').value='';document.getElementById('o_qty').value='1';document.getElementById('o_deliveryDate').value=today();render()}function close(){var m=document.getElementById('orderModal');m.classList.remove('show');m.style.display='none';m.setAttribute('aria-hidden','true')}function render(){var b=document.getElementById('orderItemsBody'),t=document.getElementById('orderItemsTotal'),total=items.reduce(function(a,i){return a+i.qty*i.price},0);if(!b)return;b.innerHTML=items.length?items.map(function(i,n){return '<tr><td>'+i.name+'</td><td>'+i.qty+'</td><td>'+money(i.price)+'</td><td>'+money(i.qty*i.price)+'</td><td><button type="button" class="btn sm danger" data-remove-order-item="'+n+'">Eliminar</button></td></tr>'}).join(''):'<tr><td colspan="5" class="empty">Agrega productos al pedido.</td></tr>';if(t)t.textContent=money(total)}window.openEvolvedOrderModal=open;window.closeEvolvedOrderModal=close;document.getElementById('btnCloseOrderModal').onclick=close;document.getElementById('btnCancelOrder').onclick=close;document.getElementById('btnAddOrderItem').onclick=function(){var p=(db.products||[]).find(function(x){return String(x.id)===String(document.getElementById('o_prod').value)}),q=Number(document.getElementById('o_qty').value)||0;if(!p||q<=0)return;items.push({productId:p.id,name:p.name,qty:q,price:Number(p.price)||0});render()};document.getElementById('o_search').oninput=function(){var q=this.value.toLowerCase().trim(),sel=document.getElementById('o_prod');sel.innerHTML=(db.products||[]).filter(function(p){return !q||String(p.name||'').toLowerCase().includes(q)||String(p.code||'').includes(q)}).map(function(p){return '<option value="'+p.id+'">'+p.name+' · '+money(p.price)+'</option>'}).join('')};document.addEventListener('click',function(e){var r=e.target.closest('[data-remove-order-item]');if(r){items.splice(Number(r.dataset.removeOrderItem),1);render()}});document.getElementById('btnSaveOrderMonolithic').onclick=function(){if(!items.length)return alert('Agrega al menos un producto.');var c=(db.clients||[]).find(function(x){return String(x.id)===String(document.getElementById('o_client').value)}),total=items.reduce(function(a,i){return a+i.qty*i.price},0),o={id:'o_'+Date.now().toString(36),number:'O-'+String((db.orders||[]).length+1).padStart(6,'0'),date:today(),deliveryDate:document.getElementById('o_deliveryDate').value||null,deliveryTime:document.getElementById('o_deliveryTime').value||null,customer:c?.name||'—',clientId:c?.id||'',phone:document.getElementById('o_phone').value||c?.phone||'',address:document.getElementById('o_address').value||'',status:document.getElementById('o_status').value||'Pendiente',total,items};db.orders=db.orders||[];db.orders.unshift(o);save();close();renderOrders()};})();\n</script>\n'''
          s=s.replace('</body>',order+'</body>',1)
          for name in ['ventara-orders-evolution.js','ventara-orders-button-fix.js','ventara-orders-dom-fix.js']: Path(name).unlink(missing_ok=True)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'id="login-screen"' in s
          assert '#login-screen{display:flex!important}' in s
          assert s.count('<!-- VENTARA PEDIDOS: módulo monolítico -->') == 1
          for h in ['ID PEDIDO','CLIENTE','DIRECCIÓN / TEL.','FECHA / HORA ENTREGA','TOTAL','ESTADO','ALERTA','ACCIONES','Cliente y entrega','Productos del pedido']:
              assert h in s, h
          assert "document.getElementById('btnNewOrder').onclick=function(){" in s
          for name in ['ventara-orders-evolution.js','ventara-orders-button-fix.js','ventara-orders-dom-fix.js']:
              assert not Path(name).exists(), name
          print('index.html validation OK')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'FIX: restaurar login y pedidos monolíticos en index.html'
          git push origin main
